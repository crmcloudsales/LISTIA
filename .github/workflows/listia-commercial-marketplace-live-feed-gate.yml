name: LISTIA Commercial Marketplace Live Feed Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-commercial-marketplace-live-feed-gate.yml'
  workflow_run:
    workflows:
      - 'LISTIA Commercial Global i18n'
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: listia-commercial-marketplace-live-feed-gate
  cancel-in-progress: true

jobs:
  live-feed:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Require visible commercial Marketplace and real inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          page_code=$(curl -sS -L --max-time 20 -o /tmp/marketplace.html -w '%{http_code}' 'https://listiaapp.com/marketplace')
          test "$page_code" = 200
          grep -Fq 'LISTIA busca por ti' /tmp/marketplace.html
          grep -Fq 'id="results"' /tmp/marketplace.html
          grep -Fq 'id="map"' /tmp/marketplace.html

          feed_code=$(curl -sS -L --max-time 25 -o /tmp/feed.json -w '%{http_code}' \
            -X POST 'https://listiaapp.com/marketplace/api/feed' \
            -H 'content-type: application/json' \
            --data '{"p_limit":6,"p_offset":0}')
          test "$feed_code" = 200
          python3 -c "import json; rows=json.load(open('/tmp/feed.json')); assert isinstance(rows,list) and len(rows)>0, rows; assert all(isinstance(x,dict) and x.get('id') for x in rows); print('real_inventory_rows=',len(rows))"

          filtered_code=$(curl -sS -L --max-time 25 -o /tmp/feed-filtered.json -w '%{http_code}' \
            -X POST 'https://listiaapp.com/marketplace/api/feed' \
            -H 'content-type: application/json' \
            --data '{"p_limit":6,"p_offset":0,"p_q":"Quintana Roo"}')
          test "$filtered_code" = 200
          python3 -c "import json; rows=json.load(open('/tmp/feed-filtered.json')); assert isinstance(rows,list), rows; print('filtered_rows=',len(rows))"

          echo 'LISTIA commercial Marketplace is live and connected to real inventory.'
