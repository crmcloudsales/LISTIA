name: LISTIA Entitlement UI Copy Sync Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-entitlement-ui-copy-sync-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Align LISTIA entitlement and password copy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, replacements):
              p=Path(path); text=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  count=text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected 1 occurrence, got {count}: {old[:80]}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          replace_exact('public/i18n.js',[
            ("'intake.free_note': 'Free incluye 1 propiedad.'", "'intake.free_note': 'Free incluye hasta 3 propiedades activas.'"),
            ("'msg.free_property_limit': 'Tu plan Free incluye 1 propiedad. Puedes usar la propiedad actual o cambiar de plan más adelante.'", "'msg.free_property_limit': 'Tu plan Free incluye hasta 3 propiedades activas. Archiva una para liberar espacio o cambia de plan más adelante.'"),
            ("'intake.free_note': 'Free includes 1 property.'", "'intake.free_note': 'Free includes up to 3 active properties.'"),
            ("'msg.free_property_limit': 'Your Free plan includes 1 property. You can use the current property or change plans later.'", "'msg.free_property_limit': 'Your Free plan includes up to 3 active properties. Archive one to free a slot or change plans later.'"),
            ("'intake.free_note': 'Free comprend 1 bien.'", "'intake.free_note': 'Free comprend jusqu’à 3 biens actifs.'"),
            ("'msg.free_property_limit': 'Votre offre Free comprend 1 bien. Vous pouvez utiliser le bien actuel ou changer d’offre plus tard.'", "'msg.free_property_limit': 'Votre offre Free comprend jusqu’à 3 biens actifs. Archivez-en un pour libérer une place ou changez d’offre.'"),
          ])

          replace_exact('public/i18n-extra.js',[
            ('\'intake.free_note\': "Il piano Free include 1 immobile."', '\'intake.free_note\': "Il piano Free include fino a 3 immobili attivi."'),
            ('\'msg.free_property_limit\': "Il piano Free include 1 immobile. Puoi usare quello attuale o cambiare piano in seguito."', '\'msg.free_property_limit\': "Il piano Free include fino a 3 immobili attivi. Archivia un immobile per liberare un posto oppure cambia piano."'),
            ('\'intake.free_note\': "O plano Free inclui 1 imóvel."', '\'intake.free_note\': "O plano Free inclui até 3 imóveis ativos."'),
            ('\'msg.free_property_limit\': "Seu plano Free inclui 1 imóvel. Você pode usar o imóvel atual ou mudar de plano depois."', '\'msg.free_property_limit\': "Seu plano Free inclui até 3 imóveis ativos. Arquive um imóvel para liberar uma vaga ou mude de plano."'),
            ('\'intake.free_note\': "Free umfasst 1 Immobilie."', '\'intake.free_note\': "Free umfasst bis zu 3 aktive Immobilien."'),
            ('\'msg.free_property_limit\': "Ihr Free-Tarif umfasst 1 Immobilie. Sie können die vorhandene Immobilie verwenden oder später den Tarif wechseln."', '\'msg.free_property_limit\': "Ihr Free-Tarif umfasst bis zu 3 aktive Immobilien. Archivieren Sie eine Immobilie, um einen Platz freizugeben, oder wechseln Sie den Tarif."'),
            ('\'intake.free_note\': "تشمل باقة Free عقاراً واحداً."', '\'intake.free_note\': "تشمل باقة Free ما يصل إلى 3 عقارات نشطة."'),
            ('\'msg.free_property_limit\': "تشمل باقة Free عقاراً واحداً. يمكنك استخدام العقار الحالي أو تغيير الباقة لاحقاً."', '\'msg.free_property_limit\': "تشمل باقة Free ما يصل إلى 3 عقارات نشطة. أرشف عقاراً لتحرير مكان أو غيّر الباقة لاحقاً."'),
          ])

          replace_exact('public/global-locales.js',[
            ("'msg.free_property_limit':'Free включает до 3 объектов. Чтобы добавить ещё один, перейдите на Pro или Premium.'", "'msg.free_property_limit':'Free включает до 3 активных объектов. Архивируйте один объект, чтобы освободить место, или смените план.'"),
            ("'msg.free_property_limit':'Free כולל עד 3 נכסים. כדי להוסיף נכס נוסף, עבור ל-Pro או Premium.'", "'msg.free_property_limit':'Free כולל עד 3 נכסים פעילים. העבר נכס לארכיון כדי לפנות מקום, או החלף מסלול.'"),
            ("'msg.free_property_limit':'Free 最多包含 3 个房源。要添加更多房源，请升级到 Pro 或 Premium。'", "'msg.free_property_limit':'Free 最多包含 3 个活跃房源。归档一个房源可释放名额，也可以稍后更改计划。'"),
          ])

          replace_exact('public/japanese-locale.js',[
            ("'msg.free_property_limit':'Free は最大3物件です。追加するには Pro または Premium に変更してください。'", "'msg.free_property_limit':'Free は最大3件の有効な物件です。1件をアーカイブして枠を空けるか、プランを変更してください。'"),
          ])

          # New password creation is 12+, while legacy login remains 8+.
          for path in ['public/i18n.js','public/i18n-extra.js','public/global-locales.js','public/japanese-locale.js']:
              p=Path(path); text=p.read_text(encoding='utf-8')
              text,n1=re.subn(r"('signup\.password_placeholder'\s*:\s*['\"][^'\"]*?)8([^'\"]*['\"])",r"\g<1>12\2",text)
              text,n2=re.subn(r"('msg\.password_min8_signup'\s*:\s*['\"][^'\"]*?)8([^'\"]*['\"])",r"\g<1>12\2",text)
              if n1 < 1 or n2 < 1:
                  raise SystemExit(f'{path}: signup password copy not found ({n1},{n2})')
              p.write_text(text,encoding='utf-8')

          app=Path('public/app.js'); text=app.read_text(encoding='utf-8')
          count=text.count('"free_property_limit": "msg.free_property_limit"')
          if count != 1: raise SystemExit(f'app mapping count={count}')
          text=text.replace('"free_property_limit": "msg.free_property_limit"','"property_limit_reached": "msg.free_property_limit"')
          count=text.count('raw === "free_property_limit"')
          if count != 1: raise SystemExit(f'app fallback count={count}')
          text=text.replace('raw === "free_property_limit"','raw === "property_limit_reached"')
          app.write_text(text,encoding='utf-8')

          # Assertions: old UI copy must be gone from canonical locale files.
          combined='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['public/i18n.js','public/i18n-extra.js'])
          for stale in ['Free incluye 1 propiedad','Free includes 1 property','Free comprend 1 bien','include 1 immobile','inclui 1 imóvel','umfasst 1 Immobilie','عقاراً واحداً']:
              if stale in combined: raise SystemExit(f'stale entitlement copy: {stale}')
          if '"free_property_limit": "msg.free_property_limit"' in text: raise SystemExit('stale app error mapping')
          print('LISTIA_ENTITLEMENT_UI_COPY_ALIGNED')
          PY

          git diff --check
          git diff -- public/app.js public/i18n.js public/i18n-extra.js public/global-locales.js public/japanese-locale.js
      - name: Persist aligned LISTIA copy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app.js public/i18n.js public/i18n-extra.js public/global-locales.js public/japanese-locale.js
          git diff --cached --quiet && { echo 'Already aligned.'; exit 0; }
          git commit -m 'Align LISTIA Free entitlement and password copy'
          git push origin main
