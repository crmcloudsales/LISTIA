name: LISTIA AI Engine Gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/listia-ai-engine/**'
      - 'supabase/functions/listia-ai-readiness/**'
      - 'supabase/functions/listia-conversation/**'
      - 'supabase/functions/listia-public-chat/**'
      - 'supabase/functions/listia-tts/**'
      - 'supabase/functions/property-ai-worker/**'
      - 'supabase/migrations/20260904171619_consolidate_listia_ai_engine.sql'
      - 'supabase/migrations/20260904172548_add_ai_engine_tts_route.sql'
      - 'supabase/migrations/20260905122107_listia_ai_engine_free_first_providers.sql'
      - '.github/workflows/listia-ai-engine-gate.yml'
  pull_request:
    paths:
      - 'supabase/functions/listia-ai-engine/**'
      - 'supabase/functions/listia-ai-readiness/**'
      - 'supabase/functions/listia-conversation/**'
      - 'supabase/functions/listia-public-chat/**'
      - 'supabase/functions/listia-tts/**'
      - 'supabase/functions/property-ai-worker/**'
      - 'supabase/migrations/20260904171619_consolidate_listia_ai_engine.sql'
      - 'supabase/migrations/20260904172548_add_ai_engine_tts_route.sql'
      - 'supabase/migrations/20260905122107_listia_ai_engine_free_first_providers.sql'
      - '.github/workflows/listia-ai-engine-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-engine-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Enforce central LISTIA AI Engine
        shell: bash
        run: |
          set -Eeuo pipefail
          engine='supabase/functions/listia-ai-engine/index.ts'
          adapters='supabase/functions/listia-ai-engine/adapters.ts'
          readiness='supabase/functions/listia-ai-readiness/index.ts'
          migration='supabase/migrations/20260904171619_consolidate_listia_ai_engine.sql'
          tts_migration='supabase/migrations/20260904172548_add_ai_engine_tts_route.sql'
          free_migration='supabase/migrations/20260905122107_listia_ai_engine_free_first_providers.sql'
          conversation='supabase/functions/listia-conversation/index.ts'
          public_chat='supabase/functions/listia-public-chat/index.ts'
          tts='supabase/functions/listia-tts/index.ts'
          property_worker='supabase/functions/property-ai-worker/index.ts'
          consumers=("$conversation" "$public_chat" "$tts" "$property_worker")

          # Provider endpoints and provider protocol live only in adapters.
          grep -Fq 'https://api.openai.com/v1/responses' "$adapters"
          grep -Fq 'https://api.openai.com/v1/audio/speech' "$adapters"
          grep -Fq 'https://integrate.api.nvidia.com/v1/chat/completions' "$adapters"
          grep -Fq 'https://api.groq.com/openai/v1/chat/completions' "$adapters"
          grep -Fq 'https://generativelanguage.googleapis.com/v1beta/models/' "$adapters"
          grep -Fq 'https://api.cloudflare.com/client/v4/accounts/' "$adapters"
          grep -Fq "from './adapters.ts'" "$engine"
          grep -Fq "name='listia_ai_engine_secret'" "$engine"
          grep -Fq "case'groq'" "$engine"
          grep -Fq "case'google'" "$engine"
          grep -Fq "case'cloudflare'" "$engine"
          grep -Fq "task==='tts'" "$engine"
          grep -Fq 'private.ai_runs' "$engine"
          grep -Fq 'private.ai_route_policies' "$engine"
          grep -Fq 'private.ai_provider_runtimes' "$engine"

          # Cost policy must fail closed: free-only, paid disabled, premium budget zero.
          grep -Fq "mode:'free_only'" "$engine"
          grep -Fq 'paid_fallback_enabled:false' "$engine"
          grep -Fq 'monthly_paid_budget_usd:0' "$engine"
          grep -Fq "costClass==='premium'" "$engine"
          grep -Fq "mode!=='free_only'" "$engine"
          grep -Fq "data_classification||''" "$engine"
          grep -Fq ":'private'" "$engine"
          grep -Fq "mode:'free_only'" "$readiness"
          grep -Fq 'monthly_paid_budget_usd:0' "$readiness"
          grep -Fq 'premium_spend_blocked' "$readiness"

          # Every consumer explicitly classifies data at the Engine boundary.
          grep -Fq "data_classification:'private'" "$conversation"
          grep -Fq "data_classification:'public'" "$public_chat"
          grep -Fq "data_classification:'private'" "$tts"
          grep -Fq "data_classification:'private'" "$property_worker"

          # Product functions may know the Engine, never provider URLs or raw provider secrets.
          for file in "${consumers[@]}"; do
            grep -Fq '/functions/v1/listia-ai-engine' "$file"
            grep -Fq 'listia_ai_engine_secret' "$file"
            if grep -Eqi 'api\.openai\.com|integrate\.api\.nvidia\.com|api\.groq\.com|generativelanguage\.googleapis\.com|api\.cloudflare\.com/client/v4/accounts/.*/ai|OPENAI_API_KEY|NVIDIA_API_KEY|NIM_API_KEY|GROQ_API_KEY|GOOGLE_GENAI_API_KEY|CLOUDFLARE_AI_TOKEN|LISTIA_LLM_API_KEY|brain\.listiaapp\.com' "$file"; then
              echo "Direct provider dependency found outside LISTIA AI Engine: $file"
              exit 1
            fi
          done

          # Core routing and LISTIA-owned credentials are source-of-truth.
          grep -Fq "'nvidia:listia_direct'" "$migration"
          grep -Fq "'listia_nvidia_api_key'" "$migration"
          grep -Fq "'listia_openai_api_key'" "$migration"
          grep -Fq "'openai:gpt-5.6-sol'" "$migration"
          grep -Fq "'openai:gpt-5.6-terra'" "$migration"
          grep -Fq "'openai:gpt-5.6-luna'" "$migration"
          grep -Fq "'conversation','q1'" "$migration"
          grep -Fq "'property_extract','q1'" "$migration"
          grep -Fq "'openai:gpt-4o-mini-tts'" "$tts_migration"
          grep -Fq "'tts','q1'" "$tts_migration"

          # Free-first providers remain LISTIA-owned and fail-closed until configured.
          grep -Fq "'cloudflare:workers_ai'" "$free_migration"
          grep -Fq "'listia_cloudflare_ai_token'" "$free_migration"
          grep -Fq "'listia_cloudflare_account_id'" "$free_migration"
          grep -Fq "'groq:direct'" "$free_migration"
          grep -Fq "'listia_groq_api_key'" "$free_migration"
          grep -Fq "'google:direct'" "$free_migration"
          grep -Fq "'listia_google_genai_api_key'" "$free_migration"
          grep -Fq "'not_configured'" "$free_migration"
          grep -Fq "'cloudflare:nemotron-3-120b-a12b'" "$free_migration"
          grep -Fq "'groq:gpt-oss-120b'" "$free_migration"

          # Engine itself is LISTIA-only and does not cross into Marketplace or another product.
          ! grep -Eqi 'cloudsales|cloudco|marketplace_listings|public\.marketplace_|/functions/v1/marketplace' "$engine" "$adapters"

          echo 'LISTIA_AI_ENGINE_BOUNDARY_OK'
