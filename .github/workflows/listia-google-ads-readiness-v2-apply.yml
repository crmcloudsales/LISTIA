name: LISTIA Google Ads Readiness V2 Apply

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-listia-google-ads-readiness-v2.py'
      - '.github/workflows/listia-google-ads-readiness-v2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-google-ads-readiness-v2-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply LISTIA Google Ads readiness UI patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/patch-listia-google-ads-readiness-v2.py
          node --check public/google-ads-connect.js
          grep -Fq "['qualified_lead','appointment','conversion'].every" public/google-ads-connect.js
          grep -Fq 'actions for qualified lead, appointment and conversion' public/google-ads-connect.js
      - name: Persist LISTIA Google Ads readiness UI
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- public/google-ads-connect.js; then
            echo 'Google Ads readiness UI already aligned.'
            exit 0
          fi
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public/google-ads-connect.js
          git commit -m 'Align LISTIA Google Ads full readiness UI'
          git push origin main
