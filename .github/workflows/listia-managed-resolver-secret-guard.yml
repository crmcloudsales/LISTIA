name: LISTIA Managed Resolver Secret Guard

on:
  push:
    branches: [main]
    paths:
      - 'sites-worker/index.js'
      - '.github/workflows/listia-managed-resolver-secret-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Remove resolver Turnstile secret forwarding
        shell: python
        run: |
          from pathlib import Path
          p=Path('sites-worker/index.js')
          s=p.read_text()
          old="async function site(host,env){if(!env?.TURNSTILE_SECRET)return null;const r=await fetch(`${SUPABASE_URL}/functions/v1/managed-site-resolver`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json','x-listia-gateway-secret':env.TURNSTILE_SECRET},body:JSON.stringify({host})});if(!r.ok)return null;const data=await r.json().catch(()=>null);return data?.site??null}"
          new="async function site(host){const r=await fetch(`${SUPABASE_URL}/functions/v1/managed-site-resolver`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({host})});if(!r.ok)return null;const data=await r.json().catch(()=>null);return data?.site??null}"
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit('Unsafe resolver pattern is not unique')
              p.write_text(s.replace(old,new))
          elif 'x-listia-gateway-secret' in s:
              raise SystemExit('Unexpected resolver secret-forwarding pattern requires review')
      - name: Verify Worker syntax and boundary
        run: |
          set -Eeuo pipefail
          node --check sites-worker/index.js
          ! grep -Fq 'x-listia-gateway-secret' sites-worker/index.js
          grep -Fq "async function site(host){" sites-worker/index.js
          grep -Fq "x-listia-turnstile-secret':env.TURNSTILE_SECRET" sites-worker/index.js
      - name: Persist hardening if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- sites-worker/index.js; then
            echo 'Resolver secret forwarding already absent.'
            exit 0
          fi
          git config user.name 'LISTIA Security'
          git config user.email 'actions@users.noreply.github.com'
          git add sites-worker/index.js
          git commit -m 'Stop forwarding Turnstile secret to public resolver'
          git push origin HEAD:main
