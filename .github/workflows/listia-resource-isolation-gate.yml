name: LISTIA Resource Isolation Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'listia-app-worker/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'listia-app-worker/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Block CloudSales and CloudCo resource dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          roots=()
          for p in public scripts listia-app-worker supabase/functions; do
            [[ -e "$p" ]] && roots+=("$p")
          done
          [[ ${#roots[@]} -gt 0 ]] || exit 0

          forbidden='cloudsales\.app|@cloudsales\.app|CLOUDSALES_[A-Z0-9_]*|CLOUDCO_[A-Z0-9_]*|cloudco-investment-lead|cloudco_form_rate_limits|cloudco_investment_leads|cloudco-assets|cloudco-logo'
          if grep -RInE --binary-files=without-match --exclude='*.md' --exclude='*.txt' --exclude='*.map' "$forbidden" "${roots[@]}"; then
            echo 'ERROR: LISTIA runtime contains a forbidden CloudSales/CloudCo resource dependency.'
            exit 1
          fi
          echo 'Cross-product resource dependency scan passed.'

      - name: Protect LISTIA control-plane changes from CloudSales resources
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == pull_request && -n "${PR_BASE_SHA:-}" ]]; then
            base="$PR_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE_SHA"
            git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true
          else
            base="HEAD^"
          fi

          changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          control="$(printf '%s\n' "$changed" | grep -E '^(supabase/migrations/|\.github/workflows/)' | grep -vE '^\.github/workflows/(listia-resource-isolation-gate|listia-independence-gate)\.yml$' || true)"
          [[ -n "$control" ]] || { echo 'No changed LISTIA control-plane files require cross-product scanning.'; exit 0; }

          forbidden='cloudsales\.app|@cloudsales\.app|cloudsalescrm\.com|CLOUDSALES_[A-Z0-9_]*|cloudco-investment-lead|CLOUDCO_[A-Z0-9_]*'
          failed=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            if grep -InE --binary-files=without-match "$forbidden" "$file"; then
              echo "ERROR: changed LISTIA control-plane file references a CloudSales/CloudCo resource: $file"
              failed=1
            fi
          done <<< "$control"
          [[ "$failed" == 0 ]]
          echo 'Changed LISTIA workflows/migrations are isolated from CloudSales resources.'

      - name: Validate narrow legacy URL compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          hits="$(grep -RIn --binary-files=without-match --exclude='*.md' --exclude='*.txt' '/cloudco' scripts public listia-app-worker supabase/functions 2>/dev/null || true)"
          if [[ -n "$hits" ]]; then
            echo "$hits"
            bad="$(printf '%s\n' "$hits" | grep -v 'scripts/build-commercial-worker.py' || true)"
            [[ -z "$bad" ]] || { echo 'ERROR: legacy /cloudco URL exists outside the canonical commercial compatibility router.'; exit 1; }
            grep -Fq "url.pathname==='/cloudco'" scripts/build-commercial-worker.py
            grep -Fq "url.pathname='/investment'" scripts/build-commercial-worker.py
            ! grep -Fq 'CLOUDCO_' scripts/build-commercial-worker.py
            ! grep -Fq 'cloudco-investment-lead' scripts/build-commercial-worker.py
          fi
          echo 'Legacy URL compatibility is redirect-only / LISTIA-backed.'

      - name: Enforce LISTIA-scoped provider secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          roots=()
          for p in public scripts listia-app-worker supabase/functions; do
            [[ -e "$p" ]] && roots+=("$p")
          done
          [[ ${#roots[@]} -gt 0 ]] || exit 0
          if grep -RInE --binary-files=without-match --exclude='*.md' --exclude='*.txt' '(^|[^A-Z0-9_])(RESEND_API_KEY|BREVO_API_KEY|MAILGUN_API_KEY|SENDGRID_API_KEY|POSTMARK_SERVER_TOKEN|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)([^A-Z0-9_]|$)' "${roots[@]}"; then
            echo 'ERROR: unscoped provider secret detected. LISTIA integrations must use LISTIA_* secret names.'
            exit 1
          fi
          echo 'LISTIA provider secret naming verified.'
