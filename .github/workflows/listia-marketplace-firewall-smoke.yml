name: LISTIA Marketplace Firewall Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-marketplace-firewall-smoke.yml'
      - 'listia-app-worker/**'
      - 'public/marketplace-interest-gateway.js'
      - 'wrangler-listia-app.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production firewall API routes
        shell: bash
        run: |
          set -Eeuo pipefail
          # Edge proof synchronized on 2026-08-29.
          config_body=$(mktemp)
          config_code=$(curl -sS --max-time 20 -o "$config_body" -w '%{http_code}' 'https://app.listiaapp.com/api/security/turnstile-config')
          [[ "$config_code" == 200 ]] || { echo "Turnstile config HTTP ${config_code}"; cat "$config_body"; exit 1; }
          jq -e '.sitekey | type == "string" and length > 10' "$config_body" >/dev/null

          interest_body=$(mktemp)
          interest_code=$(curl -sS --max-time 20 -o "$interest_body" -w '%{http_code}' 'https://app.listiaapp.com/api/interest')
          [[ "$interest_code" == 405 ]] || { echo "Interest GET HTTP ${interest_code}"; cat "$interest_body"; exit 2; }
          jq -e '.error == "method_not_allowed"' "$interest_body" >/dev/null

          cross_body=$(mktemp)
          cross_code=$(curl -sS --max-time 20 -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data '{}' -o "$cross_body" -w '%{http_code}' 'https://app.listiaapp.com/api/interest')
          [[ "$cross_code" == 403 ]] || { echo "Cross-origin POST HTTP ${cross_code}"; cat "$cross_body"; exit 3; }
          jq -e '.error == "origin_not_allowed"' "$cross_body" >/dev/null

          human_body=$(mktemp)
          human_code=$(curl -sS --max-time 20 -X POST \
            -H 'Origin: https://app.listiaapp.com' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Authorization: Bearer synthetic-smoke-token' \
            -H 'apikey: synthetic-smoke-key' \
            -H 'Content-Type: application/json' \
            --data '{"mode":"click","p_listing_id":"00000000-0000-0000-0000-000000000000"}' \
            -o "$human_body" -w '%{http_code}' 'https://app.listiaapp.com/api/interest')
          [[ "$human_code" == 403 ]] || { echo "Missing Turnstile HTTP ${human_code}"; cat "$human_body"; exit 4; }
          jq -e '.error == "missing_human_verification"' "$human_body" >/dev/null

          feed_body=$(mktemp)
          feed_code=$(curl -sS --max-time 20 -X POST \
            -H 'Origin: https://app.listiaapp.com' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' \
            --data '{"p_limit":1,"p_offset":0}' \
            -o "$feed_body" -w '%{http_code}' 'https://app.listiaapp.com/api/marketplace/feed')
          [[ "$feed_code" == 200 ]] || { echo "Protected feed HTTP ${feed_code}"; cat "$feed_body"; exit 5; }
          jq -e 'type == "array" and length <= 1' "$feed_body" >/dev/null

          feed_cross=$(mktemp)
          feed_cross_code=$(curl -sS --max-time 20 -X POST \
            -H 'Origin: https://evil.example' \
            -H 'Sec-Fetch-Site: cross-site' \
            -H 'Content-Type: application/json' \
            --data '{"p_limit":1}' \
            -o "$feed_cross" -w '%{http_code}' 'https://app.listiaapp.com/api/marketplace/feed')
          [[ "$feed_cross_code" == 403 ]] || { echo "Cross-origin feed HTTP ${feed_cross_code}"; cat "$feed_cross"; exit 6; }
          jq -e '.error == "origin_not_allowed"' "$feed_cross" >/dev/null

          direct_body=$(mktemp)
          direct_code=$(curl -sS --max-time 20 -X POST \
            -H 'apikey: sb_publishable_aY9AjGa59GQ5rNGZlGAJpw_uhgVZfb1' \
            -H 'Content-Type: application/json' \
            --data '{"p_limit":1}' \
            -o "$direct_body" -w '%{http_code}' 'https://zvzafiarwerbuoaccnoz.supabase.co/rest/v1/rpc/marketplace_public_feed_v2')
          [[ "$direct_code" != 200 ]] || { echo 'Direct Supabase Marketplace RPC is unexpectedly public'; cat "$direct_body"; exit 7; }

          echo 'Marketplace firewall production smoke: PASS'
          echo 'Cross-origin lead attempts: BLOCKED'
          echo 'Lead attempts without Turnstile: BLOCKED'
          echo 'Marketplace feed: EDGE-PROTECTED'
          echo 'Direct public Supabase feed RPC: CLOSED'
