name: LISTIA LinkedIn Conversions UI wire v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-linkedin-conversions-ui-wire-v1.yml'

permissions:
  contents: write

concurrency:
  group: listia-linkedin-conversions-ui-wire-v1
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Wire LinkedIn Conversions module into PWA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script defer="" src="/tiktok-events-connect.js?v=1"></script>'
          tag='<script defer="" src="/linkedin-conversions-connect.js?v=1"></script>'
          if tag not in s:
              if s.count(marker)!=1:
                  raise SystemExit(f'Expected exactly one TikTok script marker, found {s.count(marker)}')
              s=s.replace(marker,marker+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check public/linkedin-conversions-connect.js
          grep -Fq '<script defer="" src="/linkedin-conversions-connect.js?v=1"></script>' public/index.html
      - name: Commit PWA wiring only
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then exit 0; fi
          test "$changed" = 'public/index.html' || { echo 'Unexpected files changed' >&2; exit 1; }
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Wire LinkedIn Conversions API setup into LISTIA PWA'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
