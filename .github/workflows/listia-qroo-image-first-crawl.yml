name: LISTIA Quintana Roo Image-First Crawl

# SECURITY HOLD (2026-08-29):
# The previous workflow committed raw crawl snapshots to a public repository.
# Production ingest also depended on raw.githubusercontent.com, so silently
# changing storage would break the pipeline. Keep this workflow non-writing and
# blocked until a private server-to-server ingest path is deployed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listia-qroo-image-first-crawl
  cancel-in-progress: true

jobs:
  security-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Block public crawl snapshot publication
        shell: bash
        run: |
          echo "Q.Roo crawl is intentionally blocked: raw inventory snapshots must not be committed to a public repository."
          echo "Deploy the private server-to-server ingest path before re-enabling this workflow."
          exit 1
