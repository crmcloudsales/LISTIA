name: LISTIA Quintana Roo Image-First Crawl

# Raw crawl snapshots are ephemeral runner data only. They must never be committed
# to GitHub or uploaded as public artifacts. Authentication to LISTIA uses GitHub
# Actions OIDC; no Supabase API key is stored in this repository/workflow.
# Manual-only until larger state runs are deliberately promoted after QA.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to crawl (0 = all discovered pages)"
        required: true
        default: "5"
      detail_image_fallback:
        description: "QA only: fetch individual property pages to recover media"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: listia-qroo-image-first-crawl
  cancel-in-progress: false

jobs:
  private-crawl-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QROO_WORKERS: "6"
      QROO_CRAWL_SLEEP: "0.20"
      QROO_INGEST_BATCH_SIZE: "200"
      QROO_DETAIL_IMAGE_FALLBACK: "${{ inputs.detail_image_fallback }}"
      QROO_PRIVATE_INGEST_URL: "https://zvzafiarwerbuoaccnoz.supabase.co/functions/v1/qroo-private-ingest"

    steps:
      - name: Checkout LISTIA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi

      - name: Resolve safe crawl size and ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          pages="${{ inputs.max_pages }}"
          if ! [[ "${pages}" =~ ^[0-9]+$ ]] || (( pages > 1000 )); then
            echo "Invalid max_pages=${pages}" >&2
            exit 2
          fi
          echo "QROO_MAX_PAGES=${pages}" >> "${GITHUB_ENV}"
          echo "QROO_CRAWL_OUT=${RUNNER_TEMP}/qroo-crawl" >> "${GITHUB_ENV}"

      - name: Crawl image-first inventory to ephemeral runner storage
        run: python scripts/crawl-qroo-image-first.py

      - name: Verify strict image output before transport
        shell: python
        run: |
          import json, pathlib, re, os
          from urllib.parse import urlparse

          root = pathlib.Path(os.environ["QROO_CRAWL_OUT"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("image_required") is True
          assert manifest.get("generic_placeholders_rejected") is True
          assert manifest.get("image_listing_binding_enforced") is True

          # Detail recovery is disabled by default. If explicitly enabled for QA,
          # the same ownership/reuse checks below still apply before transport.
          requested_detail = os.environ.get("QROO_DETAIL_IMAGE_FALLBACK", "false").lower() == "true"
          assert bool(manifest.get("detail_page_image_fallback")) is requested_detail

          bad = re.compile(r"(?:background[-_]?card|empty[-_]?card|fallback[-_]?image|placeholder|default[-_]?image|no[-_]?image|no[-_]?photo|sin[-_]?imagen|sin[-_]?foto|image[-_]?not[-_]?available|missing[-_]?image|favicon|avatar|gravatar|sprite|tracking[-_]?pixel)", re.I)
          numeric_id = re.compile(r"(?<!\d)(\d{6,})(?!\d)")
          rows = 0
          seen_covers = {}

          for entry in manifest.get("chunks", []):
              payload = json.loads((root / entry["file"]).read_text(encoding="utf-8"))
              for row in payload:
                  rows += 1
                  external_id = str(row.get("external_id") or "")
                  cover = str(row.get("cover_image_url") or "")
                  gallery = row.get("gallery") or []
                  assert external_id.isdigit() and len(external_id) >= 6, external_id
                  assert cover.startswith(("http://", "https://")) and not bad.search(cover), (external_id, cover)
                  ids = set(numeric_id.findall(urlparse(cover).path))
                  assert not ids or external_id in ids, (external_id, cover, sorted(ids))
                  assert cover not in seen_covers, ("ambiguous_reused_cover", external_id, seen_covers.get(cover), cover)
                  seen_covers[cover] = external_id
                  assert isinstance(gallery, list) and gallery, external_id
                  assert all(isinstance(url, str) and url.startswith(("http://", "https://")) and not bad.search(url) for url in gallery), external_id

          assert rows == int(manifest.get("unique_listings", -1)), (rows, manifest.get("unique_listings"))
          print(json.dumps({
              "validated_rows": rows,
              "unique_covers": len(seen_covers),
              "rejected_without_image": manifest.get("rejected_without_image"),
              "rejected_ambiguous_reused_image": manifest.get("rejected_ambiguous_reused_image"),
              "recovered_from_detail_pages": manifest.get("recovered_from_detail_pages"),
              "detail_page_image_fallback": manifest.get("detail_page_image_fallback"),
              "failures": len(manifest.get("failures", [])),
          }))

      - name: Send batches to LISTIA through GitHub OIDC
        run: python scripts/push-qroo-private-ingest.py "${QROO_CRAWL_OUT}"

      - name: Confirm no repository snapshot mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "Crawler changed tracked repository files; refusing to finish." >&2
            git status --short
            exit 1
          fi
          echo "Private Q.Roo run completed without writing crawl snapshots to GitHub."
