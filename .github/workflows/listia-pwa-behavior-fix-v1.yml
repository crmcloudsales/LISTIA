name: LISTIA PWA Behavior Fix v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listia-pwa-behavior-fix-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch marketplace interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/marketplace.js')
          s=p.read_text()
          a="media.tabIndex=0;media.setAttribute('role','button');media.onclick=()=>detail(x);media.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();detail(x)}};"
          b="title.tabIndex=0;title.onclick=()=>detail(x);title.onkeydown=e=>{if(e.key==='Enter'){detail(x)}};"
          if a not in s or b not in s: raise SystemExit('marketplace interaction anchors missing')
          p.write_text(s.replace(a,'',1).replace(b,'',1))
          p=Path('public/marketplace.css')
          s=p.read_text()
          s=s.replace('.marketplace-media[role=button],.marketplace-title{cursor:pointer}','')
          s=s.replace('.marketplace-media:focus-visible,.marketplace-title:focus-visible,.marketplace-gallery-thumb:focus-visible{outline:3px solid #7b3fff;outline-offset:3px}', '.marketplace-gallery-thumb:focus-visible{outline:3px solid #7b3fff;outline-offset:3px}')
          p.write_text(s)
          PY
      - name: Patch pricing hold residue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/pricing-hold.js')
          s=p.read_text()
          needle=" const form=document.getElementById('planForm');"
          add=" const checkpoint=document.querySelector('[data-i18n=\"checkpoint.plan\"]');if(checkpoint){checkpoint.removeAttribute('data-i18n');checkpoint.textContent='Configuration saved'}; const intakeNote=document.getElementById('intakePlanNote');if(intakeNote){intakeNote.hidden=true;intakeNote.textContent=''};"
          if needle not in s: raise SystemExit('pricing hold anchor missing')
          if 'intakeNote.hidden=true' not in s: s=s.replace(needle,add+needle,1)
          p.write_text(s)
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('<span data-i18n="checkpoint.plan">✓ Plan seleccionado</span>','<span>✓ Configuración guardada</span>')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check public/marketplace.js
          node --check public/pricing-hold.js
          grep -Fq 'interest.onclick=()=>interestClick(x,interest)' public/marketplace.js
          grep -Fq 'Configuración guardada' public/index.html
          grep -Fq 'intakeNote.hidden=true' public/pricing-hold.js
          if grep -Fq "media.onclick=()=>detail(x)" public/marketplace.js; then exit 1; fi
          if grep -Fq "title.onclick=()=>detail(x)" public/marketplace.js; then exit 1; fi
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name LISTIA-PWA-Behavior-Bot
          git config user.email actions@users.noreply.github.com
          git add public/marketplace.js public/marketplace.css public/pricing-hold.js public/index.html
          git commit -m 'fix pwa marketplace CTA and plan residue'
          git push origin HEAD:main
