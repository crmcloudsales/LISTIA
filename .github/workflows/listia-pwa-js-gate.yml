name: LISTIA PWA JavaScript Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/**/*.js'
      - 'sites-worker/**/*.js'
      - '.github/workflows/listia-pwa-js-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check critical LISTIA browser and Worker modules
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            public/config.js \
            public/app.js \
            public/sw.js \
            public/analytics.js \
            public/app-shell-v2.js \
            public/listia-voice.js \
            public/assistant-intelligence.js \
            public/ai-chat.js \
            public/control-center.js \
            public/control-attention.js \
            public/account-center.js \
            public/account-resilience.js \
            public/account-edit.js \
            public/ui-state-labels.js \
            public/listing-workspace.js \
            public/listings-v2.js \
            public/website-status.js \
            public/website-language-settings.js \
            public/website-provision-bridge.js \
            public/developments.js \
            public/development-property-bridge.js \
            public/property-processing-auto.js \
            public/property-status.js \
            public/property-complete.js \
            public/property-complete-integration.js \
            public/draft-actions.js \
            public/office-modules.js \
            public/lead-stage-actions.js \
            public/lead-workspace.js \
            public/appointment-actions.js \
            public/contact-engine.js \
            public/marketplace.js \
            public/marketplace-extra-locales.js \
            public/marketplace-assistant.js \
            public/marketplace-feed-enhancements.js \
            public/marketplace-experience-v8.js \
            public/marketplace-interest-gateway.js \
            public/marketplace-saved.js \
            public/marketplace-alerts.js \
            public/marketplace-saved-manager.js \
            public/marketplace-auth-bridge.js \
            public/account-mode.js \
            public/billing.js \
            public/billing-management.js \
            sites-worker/index.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Build precise freeze observer audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const out=[];
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&p.endsWith('.js')){const s=fs.readFileSync(p,'utf8');const direct=/\.observe\s*\(\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,800}?childList\s*:\s*true/gs;const fallback=/\.observe\s*\(\s*[^,;]{0,180}\|\|\s*document\.body\s*,\s*\{[^}]{0,800}?childList\s*:\s*true/gs;if(direct.test(s)||fallback.test(s))out.push(p)}}}
          walk('public');fs.writeFileSync('freeze-observers.txt',out.join('\n')+(out.length?'\n':''));for(const p of out)console.log('Unsafe global childList MutationObserver:',p);
          NODE
      - name: Build runtime risk report
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');let out=[];
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&p.endsWith('.js')){const s=fs.readFileSync(p,'utf8');const lines=s.split(/\n/);lines.forEach((line,i)=>{if(/setInterval\s*\(/.test(line)||/window\.fetch\s*=/.test(line)||/Object\.defineProperty\s*\(\s*window\s*,\s*['"]fetch/.test(line))out.push(`${p}:${i+1}: ${line.trim().slice(0,500)}`)})}}}
          walk('public');fs.writeFileSync('runtime-risks.txt',out.join('\n')+(out.length?'\n':''));
          NODE
      - name: Upload runtime audits
        uses: actions/upload-artifact@v4
        with:
          name: listia-runtime-audit
          path: |
            freeze-observers.txt
            runtime-risks.txt
          if-no-files-found: error
          retention-days: 1
      - name: Reject global childList mutation observers
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -s freeze-observers.txt
