name: LISTIA PWA JavaScript Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/**/*.js'
      - 'sites-worker/**/*.js'
      - '.github/workflows/listia-pwa-js-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check critical LISTIA browser and Worker modules
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            public/config.js \
            public/app.js \
            public/app-shell-v2.js \
            public/listia-voice.js \
            public/assistant-intelligence.js \
            public/ai-chat.js \
            public/control-center.js \
            public/listing-workspace.js \
            public/listings-v2.js \
            public/property-processing-auto.js \
            public/property-status.js \
            public/property-complete.js \
            public/property-complete-integration.js \
            public/draft-actions.js \
            public/office-modules.js \
            public/contact-engine.js \
            public/marketplace.js \
            public/marketplace-assistant.js \
            public/marketplace-saved.js \
            public/marketplace-auth-bridge.js \
            public/account-mode.js \
            public/billing.js \
            public/billing-management.js \
            sites-worker/index.js; do
            echo "Checking $f"
            node --check "$f"
          done
