name: CloudCo Live Deployment Proof

on:
  push:
    branches: [main]
    paths:
      - 'commercial/**'
      - 'scripts/build-commercial-worker.py'
      - '.github/workflows/cloudco-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudco-live-proof
  cancel-in-progress: true

jobs:
  prove-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for Cloudflare and verify public CloudCo release
        shell: bash
        run: |
          set -Eeuo pipefail
          ok='false'
          for attempt in $(seq 1 30); do
            root_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/root.html --write-out '%{http_code}' 'https://listiaapp.com/' || true)"
            cloudco_code="$(curl --silent --show-error --location --max-time 20 --dump-header /tmp/cloudco.headers --output /tmp/cloudco.html --write-out '%{http_code}' 'https://listiaapp.com/cloudco' || true)"
            footer_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/footer.js --write-out '%{http_code}' 'https://listiaapp.com/footer-legal.js' || true)"
            robots_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/robots.txt --write-out '%{http_code}' 'https://listiaapp.com/robots.txt' || true)"
            echo "Attempt ${attempt}/30 root=${root_code} cloudco=${cloudco_code} footer=${footer_code} robots=${robots_code}"
            if [[ "${root_code}" == '200' && "${cloudco_code}" == '200' && "${footer_code}" == '200' && "${robots_code}" == '200' ]] && \
               grep -Fq 'Plan de Inversión' /tmp/cloudco.html && \
               grep -Fq 'Aceleramos y Aumentamos tu productividad' /tmp/cloudco.html && \
               grep -Fq 'Powered by <a href="/cloudco">CloudCo</a>' /tmp/footer.js && \
               grep -Fq 'Disallow: /cloudco' /tmp/robots.txt && \
               grep -Fiq 'x-robots-tag: noindex' /tmp/cloudco.headers; then
              ok='true'
              break
            fi
            sleep 10
          done
          [[ "${ok}" == 'true' ]] || {
            echo 'CloudCo public release was not verifiable within the wait window.'
            exit 1
          }

          {
            echo 'CLOUDCO LIVE DEPLOYMENT VERIFIED'
            echo "verified_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "source_commit=${GITHUB_SHA}"
            echo 'root=https://listiaapp.com/ HTTP 200'
            echo 'cloudco=https://listiaapp.com/cloudco HTTP 200'
            echo 'footer=https://listiaapp.com/footer-legal.js HTTP 200'
            echo 'robots=https://listiaapp.com/robots.txt HTTP 200'
            echo 'cloudco_noindex=true'
            echo 'footer_powered_by_cloudco=true'
            echo 'robots_disallow_cloudco=true'
          } > CLOUDCO_LIVE_DEPLOYMENT_PROOF.txt

      - name: Persist public deployment proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add CLOUDCO_LIVE_DEPLOYMENT_PROOF.txt
          git commit -m 'Record verified CloudCo public deployment' || exit 0
          git push origin main
