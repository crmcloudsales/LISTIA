name: LISTIA Investment Live Deployment Proof

on:
  push:
    branches: [main]
    paths:
      - 'commercial/investment.html'
      - 'commercial/footer-legal.js'
      - 'scripts/build-commercial-worker.py'
      - '.github/workflows/cloudco-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-investment-live-proof
  cancel-in-progress: true

jobs:
  prove-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public LISTIA investment route and compatibility redirect
        shell: bash
        run: |
          set -Eeuo pipefail
          ok='false'
          for attempt in $(seq 1 30); do
            root_code="$(curl -sS -L --max-time 20 --output /tmp/root.html --write-out '%{http_code}' 'https://listiaapp.com/' || true)"
            investment_code="$(curl -sS -L --max-time 20 --output /tmp/investment.html --write-out '%{http_code}' 'https://listiaapp.com/investment' || true)"
            legacy_meta="$(curl -sS --max-time 20 --output /dev/null --write-out '%{http_code}|%{redirect_url}' 'https://listiaapp.com/cloudco' || true)"
            footer_code="$(curl -sS -L --max-time 20 --output /tmp/footer.js --write-out '%{http_code}' 'https://listiaapp.com/footer-legal.js' || true)"
            echo "Attempt ${attempt}/30 root=${root_code} investment=${investment_code} legacy=${legacy_meta} footer=${footer_code}"
            if [[ "${root_code}" == '200' && "${investment_code}" == '200' && "${footer_code}" == '200' ]] && \
               grep -Fq 'LISTIA — Inversión y alianzas estratégicas' /tmp/investment.html && \
               grep -Fq 'id="investmentForm"' /tmp/investment.html && \
               grep -Fq '/investment/contact' /tmp/investment.html && \
               ! grep -Fiq 'Powered by CloudCo' /tmp/footer.js && \
               [[ "${legacy_meta}" == 308\|https://listiaapp.com/investment* ]]; then
              ok='true'
              break
            fi
            sleep 10
          done
          [[ "${ok}" == 'true' ]]

          {
            echo 'LISTIA INVESTMENT LIVE DEPLOYMENT VERIFIED'
            echo "verified_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "source_commit=${GITHUB_SHA}"
            echo 'investment=https://listiaapp.com/investment HTTP 200'
            echo 'legacy_cloudco_route=redirect_only'
            echo 'investment_backend=listia-investment-lead'
            echo 'resource_boundary=LISTIA_ONLY'
          } > LISTIA_INVESTMENT_LIVE_DEPLOYMENT_PROOF.txt

      - name: Persist deployment proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add LISTIA_INVESTMENT_LIVE_DEPLOYMENT_PROOF.txt
          git commit -m 'Record verified LISTIA investment deployment' || exit 0
          git push origin main
