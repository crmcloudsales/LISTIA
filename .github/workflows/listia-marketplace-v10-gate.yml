name: LISTIA Marketplace v10 Gate

on:
  pull_request:
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-voice.js'
      - 'public/sw.js'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - 'listia-app-worker/index.js'
      - '.github/workflows/listia-marketplace-v10-gate.yml'
  push:
    branches: [main]
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-voice.js'
      - 'public/sw.js'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - 'listia-app-worker/index.js'
      - '.github/workflows/listia-marketplace-v10-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/marketplace-gateway-v9.js
          node --check public/marketplace-assistant.js
          node --check public/marketplace-experience-v8.js
          node --check public/marketplace.js
          node --check public/listia-voice.js
          node --check public/sw.js

      - name: Validate secure map gateway and route
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('public/marketplace-gateway-v9.js','utf8');
          const need=s=>{if(!text.includes(s))throw new Error(`gateway missing ${s}`)};
          for(const s of ["version:'10.0.0'",'EDGE_PAGE_SIZE=30','EDGE_MAX_OFFSET=5000','delete clean.mode','firewallPreserved:true','/marketplace','mode===\'map\'','voice']) need(s);
          console.log('Secure Marketplace gateway OK');
          NODE

      - name: Validate Marketplace UI and voice contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const assistant=fs.readFileSync('public/marketplace-assistant.js','utf8');
          const experience=fs.readFileSync('public/marketplace-experience-v8.js','utf8');
          const base=fs.readFileSync('public/marketplace.js','utf8');
          const voice=fs.readFileSync('public/listia-voice.js','utf8');
          const need=(text,s,label)=>{if(!text.includes(s))throw new Error(`${label} missing ${s}`)};
          need(assistant,'!window.LISTIA_MARKETPLACE_EXPERIENCE&&isMarketplaceIntent','legacy voice deferral');
          for(const s of ['marketplaceV8SearchButton','marketplace-v8-voice-button','data-marketplace-view="list"','data-marketplace-view="map"','marketplaceV8NearButton','marketplaceV8Map']) need(experience,s,'experience');
          if(!/(hasta|under|up to)/i.test(experience)) throw new Error('experience missing max-budget language parser');
          for(const s of ['registerAction','SpeechRecognition','speechSynthesis']) need(voice,s,'voice');
          for(const s of ['marketplace-interest-button','sendInterestClick']) need(base,s,'interest CTA');
          console.log('Marketplace UI + voice + interest contracts OK');
          NODE

      - name: Validate Marketplace firewall contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('listia-app-worker/index.js','utf8');
          const set=worker.match(/const FEED_KEYS=new Set\(\[([^\]]+)\]\)/s);
          if(!set) throw new Error('FEED_KEYS missing');
          const keys=set[1];
          for(const s of ["'p_limit'","'p_offset'","'p_q'","'p_operation'","'p_property_type'","'p_min_price'","'p_max_price'","'p_bedrooms'","'p_lat'","'p_lng'"]) if(!keys.includes(s)) throw new Error(`feed firewall missing ${s}`);
          if(keys.includes("'mode'")) throw new Error('client mode must stay outside firewall contract');
          for(const s of ['TURNSTILE_VERIFY','MARKETPLACE_EDGE_PROOF','unexpected_parameter','export default']) if(!worker.includes(s)) throw new Error(`worker security missing ${s}`);
          console.log('Marketplace firewall contract preserved');
          NODE

      - name: Validate PWA cache and icon state
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('public/sw.js','utf8');
          const icon=fs.readFileSync('public/APP_ICON_VERSION.txt','utf8');
          if(!sw.includes('listia-pwa-v0.27.7-marketplace-v14')) throw new Error('PWA cache v14 missing');
          for(const s of ['release=0.27.7','icon_version=13','background_mode=full_bleed_gradient','white_background=forbidden','house_scale=0.72']) if(!icon.includes(s)) throw new Error(`icon state missing ${s}`);
          NODE
          python3 - <<'PY'
          import json,glob
          files=glob.glob('public/manifest*.webmanifest')
          assert len(files)>=12, f'Expected >=12 manifests, got {len(files)}'
          for path in files:
              data=json.load(open(path,encoding='utf-8'))
              icons=data.get('icons') or []
              assert icons, f'{path}: no icons'
              assert any('maskable' in str(i.get('purpose','')) for i in icons), f'{path}: no maskable icon'
              for icon in icons:
                  assert str(icon.get('src','')).endswith('?v=13'), f'{path}: non-v13 icon {icon}'
          print('PWA cache + icon v13 contract OK')
          PY

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm Marketplace v10 deployment reached app.listiaapp.com
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://app.listiaapp.com'
          deployed=0
          for i in $(seq 1 45); do
            sw="$(curl -fLsS --connect-timeout 5 --max-time 15 "$base/sw.js?gate=$GITHUB_SHA" || true)"
            if grep -Fq 'listia-pwa-v0.27.7-marketplace-v14' <<<"$sw"; then deployed=1; break; fi
            sleep 10
          done
          test "$deployed" = 1
          fetch(){ local url="$1" out="$2"; local code; code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$out" -w '%{http_code}' "$url")"; echo "LIVE ${url} -> ${code}"; test "$code" = 200; }
          need(){ local file="$1" marker="$2" label="$3"; if ! grep -Fq "$marker" "$file"; then echo "LIVE ASSERTION FAILED: ${label} missing marker: ${marker}"; head -c 500 "$file" || true; echo; exit 1; fi; }
          fetch "$base/" /tmp/root.html
          fetch "$base/marketplace?gate=$GITHUB_SHA" /tmp/marketplace.html
          fetch "$base/marketplace-gateway-v9.js?v=1&gate=$GITHUB_SHA" /tmp/gateway.js
          fetch "$base/marketplace-experience-v8.js?v=3&gate=$GITHUB_SHA" /tmp/experience.js
          fetch "$base/listia-voice.js?v=7&gate=$GITHUB_SHA" /tmp/voice.js
          fetch "$base/manifest.webmanifest?v=13&gate=$GITHUB_SHA" /tmp/manifest.json
          need /tmp/gateway.js "version:'10.0.0'" 'gateway version'
          need /tmp/gateway.js 'EDGE_PAGE_SIZE=30' 'secure map batch size'
          need /tmp/gateway.js 'firewallPreserved:true' 'firewall preservation marker'
          need /tmp/experience.js 'marketplaceV8SearchButton' 'Buscar UI'
          need /tmp/experience.js 'marketplace-v8-voice-button' 'voice UI'
          need /tmp/experience.js 'data-marketplace-view="map"' 'map/list toggle'
          need /tmp/voice.js 'registerAction' 'voice action registry'
          need /tmp/marketplace.html 'LISTIA' '/marketplace shell'
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert any('maskable' in str(i.get('purpose','')) for i in m.get('icons',[]))
          assert all(str(i.get('src','')).endswith('?v=13') for i in m.get('icons',[]))
          print('Live PWA assets OK')
          PY

      - name: Confirm Marketplace firewall remains enforced
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://app.listiaapp.com'
          code=$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' -X POST "$base/api/marketplace/feed" -H 'content-type: application/json' --data '{"p_limit":1,"p_offset":0}')
          echo "No-origin protected feed -> ${code}"
          test "$code" = '403'
          code=$(curl -sS -o /tmp/feed.json -w '%{http_code}' -X POST "$base/api/marketplace/feed" -H 'Origin: https://app.listiaapp.com' -H 'content-type: application/json' --data '{"p_limit":1,"p_offset":0}')
          echo "Trusted-origin protected feed -> ${code}"
          test "$code" = '200'
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/feed.json'))
          assert isinstance(rows,list)
          print(f'Protected feed OK rows={len(rows)}')
          PY
          code=$(curl -sS -o /tmp/interest.json -w '%{http_code}' -X POST "$base/api/interest" -H 'Origin: https://app.listiaapp.com' -H 'content-type: application/json' --data '{}')
          echo "Unauthenticated protected interest -> ${code}"
          test "$code" = '401'
          echo 'Marketplace firewall and protected interest endpoint OK'