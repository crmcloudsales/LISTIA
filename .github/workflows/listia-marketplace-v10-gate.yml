name: LISTIA Marketplace Contract Gate

on:
  pull_request:
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-voice.js'
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - 'listia-app-worker/index.js'
      - 'scripts/audit-public-runtime.py'
      - '.github/workflows/listia-marketplace-v10-gate.yml'
  push:
    branches: [main]
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-voice.js'
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - 'listia-app-worker/index.js'
      - 'scripts/audit-public-runtime.py'
      - '.github/workflows/listia-marketplace-v10-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Validate browser JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check public/marketplace-native-runtime-v1.js
          node --check public/marketplace-gateway-v9.js
          node --check public/marketplace-interest-gateway.js
          node --check public/marketplace-assistant.js
          node --check public/marketplace-experience-v8.js
          node --check public/marketplace.js
          node --check public/marketplace-qroo-map.js
          node --check public/listia-voice.js
          node --check public/config.js
          node --check public/sw.js

      - name: Validate Marketplace gateway capabilities
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('public/marketplace-gateway-v9.js','utf8');
          const need=s=>{if(!text.includes(s))throw new Error(`gateway missing capability: ${s}`)};
          for(const s of [
            'EDGE_PAGE_SIZE=30','EDGE_MAX_OFFSET=5000','MAP_REQUEST_MAX=1000',
            "API_FEED='/api/marketplace/feed'","QROO_API='/api/marketplace/qroo'",
            'delete clean.mode','firewallPreserved:true',"mode==='map'",
            'wantsMarketplace','wantsVoice','credentials:\'same-origin\''
          ]) need(s);
          if(!/version:'\d+\.\d+\.\d+'/.test(text)) throw new Error('gateway semantic version marker missing');
          console.log('Marketplace gateway capability contract OK');
          NODE

      - name: Validate Marketplace UI, voice and latest-search-wins contracts
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const assistant=fs.readFileSync('public/marketplace-assistant.js','utf8');
          const experience=fs.readFileSync('public/marketplace-experience-v8.js','utf8');
          const base=fs.readFileSync('public/marketplace.js','utf8');
          const qroo=fs.readFileSync('public/marketplace-qroo-map.js','utf8');
          const voice=fs.readFileSync('public/listia-voice.js','utf8');
          const nativeRuntime=fs.readFileSync('public/marketplace-native-runtime-v1.js','utf8');
          const need=(text,s,label)=>{if(!text.includes(s))throw new Error(`${label} missing ${s}`)};
          need(assistant,'!window.LISTIA_MARKETPLACE_EXPERIENCE&&isMarketplaceIntent','legacy voice deferral');
          for(const s of ['marketplaceV8SearchButton','marketplace-v8-voice-button','data-marketplace-view="list"','data-marketplace-view="map"','marketplaceV8NearButton','marketplaceV8Map']) need(experience,s,'experience');
          if(!/(hasta|under|up to)/i.test(experience)) throw new Error('experience missing max-budget language parser');
          for(const s of ['registerAction','SpeechRecognition','speechSynthesis']) need(voice,s,'voice');
          for(const s of ['marketplace-interest-button','sendInterestClick','pendingReset=false','queueMicrotask(()=>load(true))']) need(base,s,'marketplace core');
          for(const s of ['marketplace-pro-tabs','marketplace-pro-voice','qroo-intel-chart']) need(qroo,s,'marketplace map shell');
          for(const s of ['resetMarketplaceList','scrollLeft=0','MutationObserver']) need(nativeRuntime,s,'native mobile reset runtime');
          console.log('Marketplace UI + voice + latest-search-wins contracts OK');
          NODE

      - name: Validate Marketplace firewall contract
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const worker=fs.readFileSync('listia-app-worker/index.js','utf8');
          const set=worker.match(/const FEED_KEYS=new Set\(\[([^\]]+)\]\)/s);
          if(!set) throw new Error('FEED_KEYS missing');
          const keys=set[1];
          for(const s of ["'p_limit'","'p_offset'","'p_q'","'p_operation'","'p_property_type'","'p_min_price'","'p_max_price'","'p_bedrooms'","'p_lat'","'p_lng'"]) if(!keys.includes(s)) throw new Error(`feed firewall missing ${s}`);
          if(keys.includes("'mode'")) throw new Error('client-only mode must stay outside Worker firewall payload');
          for(const s of ['TURNSTILE_VERIFY','MARKETPLACE_EDGE_PROOF','unexpected_parameter','export default']) if(!worker.includes(s)) throw new Error(`worker security missing ${s}`);
          console.log('Marketplace firewall contract preserved');
          NODE

      - name: Validate PWA runtime and immutable icon state
        run: |
          set -Eeuo pipefail
          python scripts/audit-public-runtime.py
          grep -Fq '/marketplace.js?v=13' public/config.js
          grep -Fq '/marketplace.js?v=13' public/sw.js
          grep -Fq '/marketplace-native-runtime-v1.js?v=3' public/config.js
          grep -Fq '/marketplace-native-runtime-v1.js?v=3' public/sw.js
          grep -Fq '/marketplace-visible-mobile-v2.css' public/config.js
          grep -Fq '/marketplace-visible-mobile-v2.css' public/sw.js
          ! grep -Fq '/marketplace-visible-mobile-v1.css?v=1' public/config.js
          ! grep -Fq '/marketplace-visible-mobile-v1.css?v=1' public/sw.js
          grep -Fq 'outer_white_background=removed' public/APP_ICON_VERSION.txt
          grep -Fq 'extra_wheel_or_pointer=forbidden' public/APP_ICON_VERSION.txt

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm current Marketplace runtime reached app.listiaapp.com
        run: |
          set -Eeuo pipefail
          base='https://app.listiaapp.com'
          deployed=0
          for i in $(seq 1 45); do
            sw="$(curl -fLsS --connect-timeout 5 --max-time 15 "$base/sw.js?gate=$GITHUB_SHA" || true)"
            if grep -Fq '/marketplace.js?v=13' <<<"$sw" && grep -Fq 'mobile-v2-runtime-v3' <<<"$sw"; then deployed=1; break; fi
            sleep 10
          done
          test "$deployed" = 1
          fetch(){ local url="$1" out="$2"; local code; code="$(curl -sS -L --connect-timeout 5 --max-time 20 -o "$out" -w '%{http_code}' "$url")"; echo "LIVE ${url} -> ${code}"; test "$code" = 200; }
          fetch "$base/marketplace?gate=$GITHUB_SHA" /tmp/marketplace.html
          fetch "$base/marketplace-gateway-v9.js?v=5&gate=$GITHUB_SHA" /tmp/gateway.js
          fetch "$base/marketplace.js?v=13&gate=$GITHUB_SHA" /tmp/marketplace.js
          fetch "$base/marketplace-native-runtime-v1.js?v=3&gate=$GITHUB_SHA" /tmp/native.js
          fetch "$base/marketplace-visible-mobile-v2.css?gate=$GITHUB_SHA" /tmp/mobile.css
          fetch "$base/manifest.webmanifest?gate=$GITHUB_SHA" /tmp/manifest.json
          grep -Fq 'EDGE_PAGE_SIZE=30' /tmp/gateway.js
          grep -Fq 'firewallPreserved:true' /tmp/gateway.js
          grep -Fq 'pendingReset=false' /tmp/marketplace.js
          grep -Fq 'queueMicrotask(()=>load(true))' /tmp/marketplace.js
          grep -Fq 'resetMarketplaceList' /tmp/native.js
          grep -Fq 'marketplace-filters' /tmp/mobile.css
          grep -Fq 'LISTIA' /tmp/marketplace.html
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          icons=m.get('icons') or []
          assert icons and any('maskable' in str(i.get('purpose','')) for i in icons)
          for i in icons:
              src=str(i.get('src',''))
              assert '?v=' not in src, src
              assert 'listia-app-icon-v17-' in src, src
          print('Live immutable icon manifest contract OK')
          PY

      - name: Confirm Marketplace firewall remains enforced
        run: |
          set -Eeuo pipefail
          base='https://app.listiaapp.com'
          code=$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' -X POST "$base/api/marketplace/feed" -H 'content-type: application/json' --data '{"p_limit":1,"p_offset":0}')
          test "$code" = '403'
          code=$(curl -sS -o /tmp/feed.json -w '%{http_code}' -X POST "$base/api/marketplace/feed" -H 'Origin: https://app.listiaapp.com' -H 'content-type: application/json' --data '{"p_limit":1,"p_offset":0}')
          test "$code" = '200'
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/feed.json'))
          assert isinstance(rows,list) and len(rows)>0
          print(f'Protected feed OK rows={len(rows)}')
          PY
          code=$(curl -sS -o /tmp/interest.json -w '%{http_code}' -X POST "$base/api/interest" -H 'Origin: https://app.listiaapp.com' -H 'content-type: application/json' --data '{}')
          test "$code" = '401'
          echo 'Marketplace firewall and protected interest endpoint OK'
