name: LISTIA Cloudflare Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/listia-cloudflare-security-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in CF_TOKEN CF_ZONE_ID CF_ACCOUNT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required secret for ${variable} is missing."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets are present."

      - name: Prepare read-only audit helper
        shell: bash
        run: |
          cat > /tmp/cf-audit.sh <<'AUDIT_HELPER'
          audit_endpoint() {
            local label="$1"
            local url="$2"
            local jq_filter="$3"
            local required="${4:-false}"
            local response_file
            response_file="$(mktemp)"

            local http_code
            if ! http_code=$(curl --silent --show-error               --output "${response_file}"               --write-out "%{http_code}"               --header "Authorization: Bearer ${CF_TOKEN}"               --header "Content-Type: application/json"               "${url}"); then
              echo "::warning::${label}: network request failed."
              echo "- ⚠️ ${label}: network request failed" >> "${GITHUB_STEP_SUMMARY}"
              rm -f "${response_file}"
              [ "${required}" = "true" ] && return 1 || return 0
            fi

            if ! jq empty "${response_file}" >/dev/null 2>&1; then
              echo "::warning::${label}: Cloudflare returned a non-JSON response (HTTP ${http_code})."
              echo "- ⚠️ ${label}: non-JSON response (HTTP ${http_code})" >> "${GITHUB_STEP_SUMMARY}"
              rm -f "${response_file}"
              [ "${required}" = "true" ] && return 1 || return 0
            fi

            local success
            success=$(jq -r '.success // false' "${response_file}")
            if [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ] && [ "${success}" = "true" ]; then
              echo "=== ${label} ==="
              jq "${jq_filter}" "${response_file}"
              echo "- ✅ ${label}: available" >> "${GITHUB_STEP_SUMMARY}"
              rm -f "${response_file}"
              return 0
            fi

            echo "::warning::${label}: unavailable or not permitted (HTTP ${http_code})."
            jq '{success, errors: [.errors[]? | {code, message}]}' "${response_file}"
            echo "- ⚠️ ${label}: unavailable or not permitted (HTTP ${http_code})" >> "${GITHUB_STEP_SUMMARY}"
            rm -f "${response_file}"
            [ "${required}" = "true" ] && return 1 || return 0
          }
          AUDIT_HELPER

          echo "## LISTIA Cloudflare Security Audit" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Read-only audit. No Cloudflare setting is modified." >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve token and effective zone access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code=$(curl --silent --show-error             --output "${response_file}"             --write-out "%{http_code}"             --header "Authorization: Bearer ${CF_TOKEN}"             "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}")

          if [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ] && [ "$(jq -r '.success // false' "${response_file}")" = "true" ]; then
            echo "::add-mask::${CF_ZONE_ID}"
            echo "EFFECTIVE_CF_ZONE_ID=${CF_ZONE_ID}" >> "${GITHUB_ENV}"
            echo "- ✅ Token and zone access: available using configured Zone ID" >> "${GITHUB_STEP_SUMMARY}"
            rm -f "${response_file}"
            exit 0
          fi

          echo "::warning::Configured CLOUDFLARE_ZONE_ID was rejected; attempting read-only zone discovery."
          discovery_file="$(mktemp)"
          discovery_code=$(curl --silent --show-error             --get             --output "${discovery_file}"             --write-out "%{http_code}"             --header "Authorization: Bearer ${CF_TOKEN}"             --data-urlencode "name=listiaapp.com"             --data-urlencode "account.id=${CF_ACCOUNT_ID}"             "https://api.cloudflare.com/client/v4/zones")

          discovered_zone_id=$(jq -r '.result[0].id // empty' "${discovery_file}" 2>/dev/null || true)
          if [ "${discovery_code}" -ge 200 ] && [ "${discovery_code}" -lt 300 ] && [ -n "${discovered_zone_id}" ]; then
            echo "::add-mask::${discovered_zone_id}"
            echo "EFFECTIVE_CF_ZONE_ID=${discovered_zone_id}" >> "${GITHUB_ENV}"
            echo "- ✅ Token and zone access: available; zone resolved safely by name and account" >> "${GITHUB_STEP_SUMMARY}"
            echo "- ⚠️ Stored CLOUDFLARE_ZONE_ID should be corrected later" >> "${GITHUB_STEP_SUMMARY}"
            rm -f "${response_file}" "${discovery_file}"
            exit 0
          fi

          echo "::error::Unable to access or discover the LISTIA zone with the configured token/account."
          jq '{success, errors: [.errors[]? | {code, message}]}' "${discovery_file}" || true
          echo "- ❌ Token and zone access: unavailable" >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${response_file}" "${discovery_file}"
          exit 1

      - name: Audit account access
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/cf-audit.sh
          audit_endpoint             "Account access"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"             '{success, result: {id: .result.id, name: .result.name, type: .result.type}, errors}'

      - name: Audit Browser Integrity Check
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          audit_endpoint "Browser Integrity Check" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/browser_check" '{success, setting: .result.id, value: .result.value, editable: .result.editable, errors}'

      - name: Audit Security Level
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          audit_endpoint "Security Level" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/security_level" '{success, setting: .result.id, value: .result.value, editable: .result.editable, errors}'

      - name: Audit Bot Management
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          audit_endpoint "Bot Management" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/bot_management" '{success, result: {fight_mode: .result.fight_mode, ai_bots_protection: .result.ai_bots_protection, crawler_protection: .result.crawler_protection, cf_robots_variant: .result.cf_robots_variant, sbfm_likely_automated: .result.sbfm_likely_automated, sbfm_definitely_automated: .result.sbfm_definitely_automated, sbfm_verified_bots: .result.sbfm_verified_bots}, errors}'

      - name: Audit WAF Custom Rules
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          audit_endpoint "WAF Custom Rules" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/rulesets/phases/http_request_firewall_custom/entrypoint" '{success, ruleset_id: .result.id, phase: .result.phase, rules: [.result.rules[]? | {id, description, expression, action, enabled}], errors}'

      - name: Audit Rate Limiting
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          audit_endpoint "Rate Limiting" "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/rulesets/phases/http_ratelimit/entrypoint" '{success, ruleset_id: .result.id, phase: .result.phase, rules: [.result.rules[]? | {id, description, expression, action, enabled, ratelimit}], errors}'

      - name: Audit HTTPS and TLS settings
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          for setting in always_use_https min_tls_version opportunistic_encryption automatic_https_rewrites tls_1_3 ssl; do
            audit_endpoint               "Zone setting: ${setting}"               "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/${setting}"               '{success, setting: .result.id, value: .result.value, editable: .result.editable, errors}'
          done

      - name: Audit additional security settings
        shell: bash
        run: |
          source /tmp/cf-audit.sh
          for setting in challenge_ttl privacy_pass origin_error_page_pass_thru always_online; do
            audit_endpoint               "Zone setting: ${setting}"               "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/${setting}"               '{success, setting: .result.id, value: .result.value, editable: .result.editable, errors}'
          done

      - name: Security audit completed
        shell: bash
        run: |
          echo "LISTIA Cloudflare security audit completed."
          echo "No Cloudflare configuration was modified."
