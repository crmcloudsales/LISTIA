name: LISTIA Cloudflare Security Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CF_TOKEN:-}" ]; then
            echo "CLOUDFLARE_SECURITY_TOKEN is missing"
            exit 1
          fi

          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID is missing"
            exit 1
          fi

          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi

          echo "All required LISTIA Cloudflare secrets are present."

      - name: Verify Cloudflare Account API token
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify")

          echo "${RESPONSE}" | jq '{
            success,
            status: .result.status,
            expires_on: .result.expires_on,
            errors
          }'

          SUCCESS=$(echo "${RESPONSE}" | jq -r '.success')

          if [ "${SUCCESS}" != "true" ]; then
            echo "Cloudflare Account API token verification failed."
            exit 1
          fi

          echo "Cloudflare Account API token verified successfully."

      - name: Audit Browser Integrity Check
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/browser_check")

          echo "${RESPONSE}" | jq '{
            success,
            setting: .result.id,
            value: .result.value,
            editable: .result.editable,
            errors
          }'

      - name: Audit Security Level
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/security_level")

          echo "${RESPONSE}" | jq '{
            success,
            setting: .result.id,
            value: .result.value,
            editable: .result.editable,
            errors
          }'

      - name: Audit Bot Management
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/bot_management")

          echo "${RESPONSE}" | jq '{
            success,
            ai_bots_protection: .result.ai_bots_protection,
            content_bots_protection: .result.content_bots_protection,
            crawler_protection: .result.crawler_protection,
            cf_robots_variant: .result.cf_robots_variant,
            fight_mode: .result.fight_mode,
            sbfm_likely_automated: .result.sbfm_likely_automated,
            sbfm_definitely_automated: .result.sbfm_definitely_automated,
            sbfm_verified_bots: .result.sbfm_verified_bots,
            errors
          }'

      - name: Audit WAF Custom Rules
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS \
            -o /tmp/waf.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/rulesets/phases/http_request_firewall_custom/entrypoint")

          echo "WAF HTTP status: ${HTTP_CODE}"

          jq '{
            success,
            ruleset_id: .result.id,
            phase: .result.phase,
            rules: [
              (.result.rules[]? | {
                id,
                description,
                expression,
                action,
                enabled
              })
            ],
            errors
          }' /tmp/waf.json

      - name: Audit Rate Limiting
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS \
            -o /tmp/ratelimit.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/rulesets/phases/http_ratelimit/entrypoint")

          echo "Rate Limit HTTP status: ${HTTP_CODE}"

          jq '{
            success,
            ruleset_id: .result.id,
            phase: .result.phase,
            rules: [
              (.result.rules[]? | {
                id,
                description,
                expression,
                action,
                enabled,
                ratelimit
              })
            ],
            errors
          }' /tmp/ratelimit.json

      - name: Audit HTTPS Enforcement
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/always_use_https")

          echo "${RESPONSE}" | jq '{
            success,
            setting: .result.id,
            value: .result.value,
            editable: .result.editable,
            errors
          }'

      - name: Audit TLS Minimum Version
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/min_tls_version")

          echo "${RESPONSE}" | jq '{
            success,
            setting: .result.id,
            value: .result.value,
            editable: .result.editable,
            errors
          }'

      - name: Audit Opportunistic Encryption
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/opportunistic_encryption")

          echo "${RESPONSE}" | jq '{
            success,
            setting: .result.id,
            value: .result.value,
            editable: .result.editable,
            errors
          }'

      - name: Security Audit Completed
        shell: bash
        run: |
          echo "LISTIA Cloudflare security audit completed."
          echo "This workflow performed READ-ONLY checks."
          echo "No Cloudflare security setting was modified."
