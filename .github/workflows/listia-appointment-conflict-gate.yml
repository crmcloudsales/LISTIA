name: LISTIA Appointment Conflict Gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
      - 'supabase/functions/appointment-action/index.ts'
      - 'public/appointment-actions.js'
      - '.github/workflows/listia-appointment-conflict-gate.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
      - 'supabase/functions/appointment-action/index.ts'
      - 'public/appointment-actions.js'
      - '.github/workflows/listia-appointment-conflict-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appointment-conflict-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify advisor appointment conflict protection
        shell: bash
        run: |
          set -Eeuo pipefail
          migration='supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
          edge='supabase/functions/appointment-action/index.ts'
          ui='public/appointment-actions.js'

          node --check "$ui"

          # Schema owns advisor assignment and time integrity.
          grep -Fq 'add column if not exists assigned_user_id uuid references public.profiles(id)' "$migration"
          grep -Fq 'appointments_time_order_check' "$migration"
          grep -Fq "ends_at is null or ends_at > starts_at" "$migration"
          grep -Fq 'appointments_org_assignee_starts_idx' "$migration"

          # Lead assignment is inherited, but no advisor identity is invented.
          grep -Fq 'new.lead_id is not null and new.assigned_user_id is null' "$migration"
          grep -Fq 'select l.assigned_user_id' "$migration"
          grep -Fq 'appointment_assignee_not_active_member' "$migration"

          # Conflict check is serialized per advisor to prevent concurrent races.
          grep -Fq "pg_advisory_xact_lock" "$migration"
          grep -Fq "'listia-appointment:'" "$migration"
          grep -Fq "a.status in ('scheduled','confirmed')" "$migration"
          grep -Fq "message='appointment_conflict'" "$migration"
          grep -Fq 'revoke all on function private.enforce_appointment_assignee_and_conflict() from public, anon, authenticated' "$migration"

          # Edge translates database contract into an actionable 409.
          grep -Fq "diagnostic.includes('appointment_conflict')" "$edge"
          grep -Fq "{ error: 'appointment_conflict' }, 409" "$edge"
          grep -Fq 'assigned_user_id,status,starts_at,ends_at' "$edge"
          ! grep -Eq 'marketplace_listings|public\.marketplace_|/functions/v1/marketplace' "$edge"

          # PWA gives the user a meaningful conflict message.
          grep -Fq "==='appointment_conflict'?c().conflict:c().error" "$ui"
          grep -Fq "assigned_user_id" "$ui"
          ! grep -Eq 'marketplace_listings|public\.marketplace_|/functions/v1/marketplace' "$ui"

          echo 'LISTIA_APPOINTMENT_CONFLICT_BOUNDARY_OK'
