name: LISTIA Appointment Operations Gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
      - 'supabase/functions/appointment-action/index.ts'
      - 'supabase/functions/appointment-create/index.ts'
      - 'public/appointment-actions.js'
      - '.github/workflows/listia-appointment-conflict-gate.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
      - 'supabase/functions/appointment-action/index.ts'
      - 'supabase/functions/appointment-create/index.ts'
      - 'public/appointment-actions.js'
      - '.github/workflows/listia-appointment-conflict-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appointment-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify LISTIA appointment operations
        shell: bash
        run: |
          set -Eeuo pipefail
          migration='supabase/migrations/20260904135011_add_appointment_assignee_conflict_guard.sql'
          action='supabase/functions/appointment-action/index.ts'
          create='supabase/functions/appointment-create/index.ts'
          ui='public/appointment-actions.js'

          node --check "$ui"

          # Schema owns assignment and time integrity.
          grep -Fq 'add column if not exists assigned_user_id uuid references public.profiles(id)' "$migration"
          grep -Fq 'appointments_time_order_check' "$migration"
          grep -Fq 'appointments_org_assignee_starts_idx' "$migration"
          grep -Fq 'new.lead_id is not null and new.assigned_user_id is null' "$migration"
          grep -Fq 'appointment_assignee_not_active_member' "$migration"
          grep -Fq 'pg_advisory_xact_lock' "$migration"
          grep -Fq "'listia-appointment:'" "$migration"
          grep -Fq "a.status in ('scheduled','confirmed')" "$migration"
          grep -Fq "message='appointment_conflict'" "$migration"

          # Canonical creation is authenticated, idempotent and organization-scoped.
          grep -Fq "appointment_create" "$create"
          grep -Fq "appointment_id" "$create"
          grep -Fq "crypto.randomUUID" "$ui"
          grep -Fq "lead_assigned_to_other_member" "$create"
          grep -Fq "assigned_user_id" "$create"
          grep -Fq ".eq('organization_id',organizationId)" "$create"
          grep -Fq "d.includes('appointment_conflict')" "$create"
          grep -Fq "status:'appointment'" "$create"

          # Owners/admins manage all; assigned advisors manage their own appointments.
          grep -Fq "['owner','admin'].includes" "$action"
          grep -Fq "assigned_user_id" "$action"
          grep -Fq "===user.id" "$action"
          grep -Fq "appointment_action" "$action"
          grep -Fq "d.includes('appointment_conflict')" "$action"
          grep -Fq "{error:'appointment_conflict'},409" "$action"

          # PWA has native create + conflict UX and only renders actions to authorized users.
          grep -Fq "appointment-create" "$ui"
          grep -Fq "listiaAgendaCreate" "$ui"
          grep -Fq "lead_assigned_to_other_member" "$ui"
          grep -Fq "appointment_conflict" "$ui"
          grep -Fq "a.assigned_user_id" "$ui"
          grep -Fq "external_event_id" "$ui"
          ! grep -Eq 'marketplace_listings|public\.marketplace_|/functions/v1/marketplace' "$action" "$create" "$ui"

          echo 'LISTIA_APPOINTMENT_OPERATIONS_OK'
