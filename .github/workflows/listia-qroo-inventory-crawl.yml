name: LISTIA Quintana Roo Inventory Crawl

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crawl-quintana-roo-properties.py'
      - 'scripts/crawl-quintana-roo-properties-parallel.py'
      - '.github/workflows/listia-qroo-inventory-crawl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-qroo-inventory-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: pip install --disable-pip-version-check beautifulsoup4 curl_cffi

      - name: Crawl all public Quintana Roo result pages
        env:
          QROO_CRAWL_URL: https://propiedades.com/quintana-roo/
          QROO_CRAWL_OUT: data/qroo-crawl
          QROO_CHUNK_SIZE: '1500'
          QROO_WORKERS: '14'
        run: python scripts/crawl-quintana-roo-properties-parallel.py

      - name: Validate snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s data/qroo-crawl/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/qroo-crawl/manifest.json').read_text())
          print(m)
          assert m['unique_listings'] > 0
          assert m['chunks']
          PY

      - name: Commit latest normalized inventory snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA Inventory Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/qroo-crawl
          git commit -m 'Refresh Quintana Roo inventory snapshot' || exit 0
          git pull --rebase origin main
          git push origin main
