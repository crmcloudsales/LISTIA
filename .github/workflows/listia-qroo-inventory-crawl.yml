name: LISTIA Quintana Roo Inventory Crawl

# SECURITY HOLD (2026-08-29):
# Legacy state-wide crawl previously committed raw inventory snapshots to the
# public repository. It is disabled until LISTIA has a private server-to-server
# ingestion path that does not depend on public GitHub raw files.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listia-qroo-inventory-crawl
  cancel-in-progress: true

jobs:
  security-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Block public crawl snapshot publication
        shell: bash
        run: |
          echo "Legacy Q.Roo crawl is intentionally blocked: do not publish raw inventory snapshots to public GitHub."
          echo "Use a private server-to-server ingest channel before re-enabling."
          exit 1
