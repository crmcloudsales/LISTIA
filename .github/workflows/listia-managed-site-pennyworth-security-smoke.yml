name: LISTIA Managed Site Pennyworth Security Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-managed-site-pennyworth-security-smoke.yml'
      - 'sites-worker/**'
      - 'supabase/functions/managed-site-interest/**'
      - 'supabase/functions/managed-site-resolver/**'
  workflow_run:
    workflows:
      - 'LISTIA Managed Sites'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listia-managed-site-pennyworth-security-smoke
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify Pennyworth source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check sites-worker/index.js
          node --check sites-worker/router.js
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('sites-worker/index.js').read_text()
          edge = Path('supabase/functions/managed-site-interest/index.ts').read_text()
          resolver = Path('supabase/functions/managed-site-resolver/index.ts').read_text()
          worker_required = [
              "origin_blocked",
              "turnstile_failed",
              "MANAGED_SITE_EDGE_PROOF",
              "'x-listia-edge-proof':env.MANAGED_SITE_EDGE_PROOF",
              "turnstile_verified:true",
              "/functions/v1/managed-site-interest",
              "/functions/v1/managed-site-resolver",
          ]
          edge_required = [
              "gateway_auth_required",
              "body.turnstile_verified!==true",
              "score>=80?'accepted':score>=60?'review':'junk'",
              "if(decision!=='accepted')return json({ok:true})",
              "submit_marketplace_interest",
              "quality_score:score",
              "firewall:'pennyworth_v1'",
          ]
          resolver_required = ["resolve_listia_public_site", "host_not_allowed"]
          missing = [f'worker:{x}' for x in worker_required if x not in worker]
          missing += [f'edge:{x}' for x in edge_required if x not in edge]
          missing += [f'resolver:{x}' for x in resolver_required if x not in resolver]
          if missing:
              raise SystemExit('PENNYWORTH_CONTRACT_MISSING=' + ','.join(missing))
          print('PENNYWORTH_SOURCE_CONTRACT_OK')
          PY

  live-route-and-gates:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose Bonavista route and verify live security gates
        shell: bash
        env:
          SITE: https://bonavista.listiaapp.com
        run: |
          set -Eeuo pipefail
          supabase_url=$(sed -nE "s/^const SUPABASE_URL='([^']+)'.*/\1/p" sites-worker/index.js | head -n1)
          supabase_key=$(sed -nE "s/^const SUPABASE_KEY='([^']+)'.*/\1/p" sites-worker/index.js | head -n1)
          [[ -n "$supabase_url" && -n "$supabase_key" ]] || { echo 'SUPABASE_PUBLIC_CONFIG_MISSING'; exit 20; }

          code=$(curl -sS -L --max-time 30 -D /tmp/site.headers -o /tmp/site.html -w '%{http_code}' "$SITE/?pennyworth_security_smoke=${GITHUB_RUN_ID}")
          title=$(sed -nE 's/.*<title>([^<]+)<\/title>.*/\1/ip' /tmp/site.html | head -n1 || true)
          bytes=$(wc -c </tmp/site.html | tr -d ' ')
          brand_count=$( { grep -Fo 'Bonavista Realtors' /tmp/site.html || true; } | wc -l | tr -d ' ')
          interest_count=$( { grep -oE 'data-interest="[0-9a-fA-F-]{36}"' /tmp/site.html || true; } | wc -l | tr -d ' ')
          echo "SITE_DIAGNOSTIC status=${code} title=${title:-none} bytes=${bytes} brand=${brand_count} interests=${interest_count}"
          grep -Ei '^(server|cf-ray|content-type|location):' /tmp/site.headers || true
          [[ "$code" == 200 ]] || { echo 'MANAGED_SITE_NOT_200'; exit 21; }

          resolver_code=$(curl -sS --max-time 30 -o /tmp/resolver.json -w '%{http_code}' \
            -X POST "$supabase_url/functions/v1/managed-site-resolver" \
            -H "apikey: $supabase_key" \
            -H 'Content-Type: application/json' \
            --data '{"host":"bonavista.listiaapp.com"}')
          resolver_name=$(jq -r '.site.organization.name // ""' /tmp/resolver.json)
          resolver_count=$(jq -r '(.site.listings // []) | length' /tmp/resolver.json)
          listing_id=$(jq -r '.site.listings[0].id // ""' /tmp/resolver.json)
          echo "RESOLVER_DIAGNOSTIC status=${resolver_code} org=${resolver_name:-none} listings=${resolver_count} first=${listing_id:-none}"
          [[ "$resolver_code" == 200 && "$resolver_name" == 'Bonavista Realtors' && "$resolver_count" -gt 0 && -n "$listing_id" ]] || { cat /tmp/resolver.json; exit 22; }

          if [[ "$brand_count" -lt 1 || "$interest_count" -lt 1 ]]; then
            echo "MANAGED_SITE_ROUTE_CONTENT_MISMATCH title=${title:-none} resolver_listings=${resolver_count}"
            echo 'HTML_HEAD_BEGIN'
            head -c 600 /tmp/site.html | tr '\n' ' '
            echo
            echo 'HTML_HEAD_END'
            exit 23
          fi

          cat >/tmp/invalid-turnstile.json <<JSON
          {"listing_id":"${listing_id}","name":"Security Probe","email":"security-probe-${GITHUB_RUN_ID}@example.com","message":"LISTIA security gate probe","locale":"es","website":null,"turnstile_token":"invalid-ci-token","form_elapsed_ms":3000}
          JSON
          code=$(curl -sS --max-time 30 -o /tmp/invalid-turnstile.out -w '%{http_code}' \
            -X POST "$SITE/api/interest" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://bonavista.listiaapp.com' \
            -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @/tmp/invalid-turnstile.json)
          [[ "$code" == 403 ]] || { echo "TURNSTILE_GATE_STATUS=${code}"; cat /tmp/invalid-turnstile.out; exit 24; }
          grep -Fq 'turnstile_failed' /tmp/invalid-turnstile.out

          cat >/tmp/honeypot.json <<JSON
          {"listing_id":"${listing_id}","name":"Bot Probe","email":"bot-probe-${GITHUB_RUN_ID}@example.com","website":"https://spam.invalid","locale":"es","turnstile_token":"","form_elapsed_ms":50}
          JSON
          code=$(curl -sS --max-time 30 -o /tmp/honeypot.out -w '%{http_code}' \
            -X POST "$SITE/api/interest" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://bonavista.listiaapp.com' \
            -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @/tmp/honeypot.json)
          [[ "$code" == 200 ]] || { echo "HONEYPOT_GATE_STATUS=${code}"; cat /tmp/honeypot.out; exit 25; }
          grep -Fq '"ok":true' /tmp/honeypot.out

          code=$(curl -sS --max-time 30 -o /tmp/private-gateway.out -w '%{http_code}' \
            -X POST "$supabase_url/functions/v1/managed-site-interest" \
            -H "apikey: $supabase_key" \
            -H 'Content-Type: application/json' \
            --data '{}')
          [[ "$code" == 401 ]] || { echo "PRIVATE_GATEWAY_STATUS=${code}"; cat /tmp/private-gateway.out; exit 26; }
          grep -Fq 'gateway_auth_required' /tmp/private-gateway.out
          echo "LISTIA_LIVE_SECURITY_GATES_OK listing=${listing_id}"
