name: LISTIA Managed Site Pennyworth Security Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-managed-site-pennyworth-security-smoke.yml'
      - 'listia-app-worker/index.js'
      - 'supabase/functions/managed-site-inquiry/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listia-managed-site-pennyworth-security-smoke
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify canonical Pennyworth source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check listia-app-worker/index.js
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('listia-app-worker/index.js').read_text()
          edge = Path('supabase/functions/managed-site-inquiry/index.ts').read_text()
          worker_required = [
              "SUPABASE_SITE_INQUIRY",
              "managed_site_inquiry",
              "verifyHuman(req,env",
              "form_elapsed_ms:Math.max(0,Date.now()-opened)",
              "website:body.website,form_elapsed_ms:body.form_elapsed_ms",
              "'x-listia-client-ip':clientIp(req)",
              "'x-listia-client-ua':String(req.headers.get('user-agent')||'').slice(0,500)",
              "'x-listia-country':String(req.cf?.country||'').slice(0,8)",
              "/api/site/inquiry",
          ]
          edge_required = [
              "private.managed_site_firewall_attempts",
              "score>=80?'accepted':score>=60?'review':'junk'",
              "if(decision!=='accepted')return json({ok:true})",
              "disposable_email",
              "canonical_edge_verified",
              ".rpc('submit_marketplace_interest'",
              "source:'listia_managed_site'",
              "quality_score:score",
              "firewall:'pennyworth_v1'",
          ]
          missing = [f'worker:{x}' for x in worker_required if x not in worker]
          missing += [f'edge:{x}' for x in edge_required if x not in edge]
          if missing:
              raise SystemExit('PENNYWORTH_CANONICAL_CONTRACT_MISSING=' + ','.join(missing))
          accepted_pos=edge.index("if(decision!=='accepted')return json({ok:true})")
          pipeline_pos=edge.index(".rpc('submit_marketplace_interest'")
          if pipeline_pos <= accepted_pos:
              raise SystemExit('PENNYWORTH_PIPELINE_ORDER_INVALID')
          print('PENNYWORTH_CANONICAL_SOURCE_CONTRACT_OK')
          PY

  live-security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live canonical route and Pennyworth public boundary
        shell: bash
        env:
          SITE: https://bonavista.listiaapp.com
          EDGE: https://zvzafiarwerbuoaccnoz.supabase.co/functions/v1/managed-site-inquiry
        run: |
          set -Eeuo pipefail
          ready=false
          for attempt in $(seq 1 48); do
            code=$(curl -sS -L --max-time 30 -o /tmp/site.html -w '%{http_code}' "$SITE/?pennyworth_security_smoke=${GITHUB_RUN_ID}_${attempt}" || true)
            brand_count=$( { grep -Fo 'Bonavista Realtors' /tmp/site.html || true; } | wc -l | tr -d ' ')
            interest_count=$( { grep -oE '<button class="interest" data-id="[0-9a-fA-F-]{36}"' /tmp/site.html || true; } | wc -l | tr -d ' ')
            if [[ "$code" == 200 && "$brand_count" -gt 0 && "$interest_count" -gt 0 ]] && grep -Fq 'form_elapsed_ms:Math.max(0,Date.now()-opened)' /tmp/site.html && grep -Fq 'data-action="managed_site_inquiry"' /tmp/site.html; then
              ready=true
              break
            fi
            echo "Waiting for canonical Pennyworth v2 edge (${attempt}/48): status=${code} brand=${brand_count} interests=${interest_count}"
            sleep 5
          done
          [[ "$ready" == true ]] || { echo 'PENNYWORTH_V2_NOT_LIVE'; exit 21; }

          listing_id=$(grep -oE '<button class="interest" data-id="[0-9a-fA-F-]{36}"' /tmp/site.html | head -n1 | sed -E 's/.*data-id="([0-9a-fA-F-]{36})"/\1/' || true)
          [[ -n "$listing_id" ]] || exit 22

          code=$(curl -sS -L --max-time 20 -o /tmp/health.json -w '%{http_code}' "$SITE/.well-known/listia-health")
          [[ "$code" == 200 ]] && jq -e '.ok==true and .managed==true and .host=="bonavista.listiaapp.com"' /tmp/health.json >/dev/null

          cat >/tmp/invalid-turnstile.json <<JSON
          {"listing_id":"${listing_id}","name":"Security Probe","email":"security-probe-${GITHUB_RUN_ID}@example.com","message":"LISTIA invalid Turnstile gate probe","form_elapsed_ms":3000,"turnstile_token":"invalid-ci-token"}
          JSON
          code=$(curl -sS --max-time 30 -o /tmp/invalid-turnstile.out -w '%{http_code}' \
            -X POST "$SITE/api/site/inquiry" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://bonavista.listiaapp.com' \
            -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @/tmp/invalid-turnstile.json)
          [[ "$code" == 403 ]] || { echo "TURNSTILE_GATE_STATUS=${code}"; cat /tmp/invalid-turnstile.out; exit 23; }
          grep -Eq 'human_verification_failed|missing_human_verification|hostname_mismatch|action_mismatch' /tmp/invalid-turnstile.out

          code=$(curl -sS --max-time 30 -o /tmp/private-edge.out -w '%{http_code}' -X POST "$EDGE" -H 'Content-Type: application/json' --data '{}')
          [[ "$code" == 403 ]] || { echo "PRIVATE_EDGE_STATUS=${code}"; cat /tmp/private-edge.out; exit 24; }
          grep -Fq 'edge_firewall_required' /tmp/private-edge.out
          echo "LISTIA_PENNYWORTH_V2_LIVE_SECURITY_OK listing=${listing_id}"
