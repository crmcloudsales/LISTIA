name: LISTIA Official App Icon Sync
on:
  push:
    paths:
      - '.github/workflows/listia-official-app-icon-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write official icon binaries
        shell: bash
        run: |
          printf '%s' '' | base64 -d > public/listia-app-icon-32.png
          printf '%s' '' | base64 -d > public/listia-app-icon-180.png
          printf '%s' '' | base64 -d > public/listia-app-icon-192.png
          printf '%s' '' | base64 -d > public/listia-app-icon-512.png
          cp public/listia-app-icon-192.png public/listia-app-icon-maskable-192.png
          cp public/listia-app-icon-512.png public/listia-app-icon-maskable-512.png
      - name: Update icon references and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('public').glob('manifest*.webmanifest'):
              s=p.read_text()
              for old in ('?v=12','?v=13'):
                  s=s.replace(old,'?v=14')
              p.write_text(s)
          p=Path('public/index.html')
          s=p.read_text().replace('/listia-app-icon-180.png?v=12','/listia-app-icon-180.png?v=14').replace('/listia-app-icon-32.png?v=12','/listia-app-icon-32.png?v=14')
          p.write_text(s)
          p=Path('public/sw.js')
          s=p.read_text().replace('listia-pwa-v0.27.9-marketplace-v14','listia-pwa-v0.27.10-icon-v14')
          for name in ['listia-app-icon-192.png','listia-app-icon-512.png','listia-app-icon-maskable-192.png','listia-app-icon-maskable-512.png','listia-app-icon-180.png','listia-app-icon-32.png']:
              s=s.replace(name+'?v=13',name+'?v=14').replace(name+'?v=12',name+'?v=14')
          p.write_text(s)
          Path('public/APP_ICON_VERSION.txt').write_text('LISTIA OFFICIAL APPLICATION ICON\nversion=14\nicon_version=14\nsource=Google Drive file 1v-MeZmwDa6EBR-vo1T7d9m_hk3jTnceB\nscope=application-icon-launcher-favicon-apple-touch-and-pwa\nrelease=0.27.10\npwa_release=0.27.10\nartwork=purple rounded square with white house\nwhite_house=required\nouter_white_background=removed\ninternal_isotipo=listia-site-isotipo-v4.svg\ninternal_isotipo_change=none\ncache_version=v14\n')
          PY
      - name: Commit official icon replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/listia-app-icon-*.png public/manifest*.webmanifest public/index.html public/sw.js public/APP_ICON_VERSION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: set official LISTIA square-house app icon"
          git push origin HEAD:main
