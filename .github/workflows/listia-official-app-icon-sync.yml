name: LISTIA Official App Icon Sync
on:
  push:
    paths:
      - '.github/workflows/listia-official-app-icon-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Write canonical icon source
        shell: bash
        run: |
          cat > /tmp/listia-icon.b64 <<'B64'

B64
          base64 -d /tmp/listia-icon.b64 > /tmp/listia-icon-512.png
      - name: Generate all official icon sizes
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          src=Image.open('/tmp/listia-icon-512.png').convert('RGBA')
          outputs={
            'public/listia-app-icon-32.png':32,
            'public/listia-app-icon-180.png':180,
            'public/listia-app-icon-192.png':192,
            'public/listia-app-icon-512.png':512,
            'public/listia-app-icon-maskable-192.png':192,
            'public/listia-app-icon-maskable-512.png':512,
          }
          for path,size in outputs.items():
              im=src if size==512 else src.resize((size,size), Image.Resampling.LANCZOS)
              im.save(path,optimize=True)
          PY
      - name: Update icon references and canonical metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manifests=list(Path('public').glob('manifest*.webmanifest'))
          for p in manifests:
              s=p.read_text()
              s=s.replace('?v=13','?v=14')
              p.write_text(s)
          p=Path('public/index.html'); s=p.read_text(); s=s.replace('/listia-app-icon-180.png?v=12','/listia-app-icon-180.png?v=14').replace('/listia-app-icon-32.png?v=12','/listia-app-icon-32.png?v=14'); p.write_text(s)
          p=Path('public/sw.js'); s=p.read_text(); s=s.replace('listia-pwa-v0.27.9-marketplace-v14','listia-pwa-v0.27.10-icon-v14').replace('listia-app-icon-192.png?v=13','listia-app-icon-192.png?v=14').replace('listia-app-icon-512.png?v=13','listia-app-icon-512.png?v=14').replace('listia-app-icon-maskable-192.png?v=13','listia-app-icon-maskable-192.png?v=14').replace('listia-app-icon-maskable-512.png?v=13','listia-app-icon-maskable-512.png?v=14').replace('listia-app-icon-180.png?v=13','listia-app-icon-180.png?v=14').replace('listia-app-icon-32.png?v=13','listia-app-icon-32.png?v=14'); p.write_text(s)
          Path('public/APP_ICON_VERSION.txt').write_text('LISTIA OFFICIAL APPLICATION ICON\nversion=14\nicon_version=14\nsource=Google Drive file 1v-MeZmwDa6EBR-vo1T7d9m_hk3jTnceB\nscope=application-icon-launcher-favicon-apple-touch-and-pwa\nrelease=0.27.10\npwa_release=0.27.10\nartwork=purple rounded square with white house\nwhite_house=required\nouter_white_background=removed\ninternal_isotipo=listia-site-isotipo-v4.svg\ninternal_isotipo_change=none\ncache_version=v14\n')
          PY
      - name: Commit official icon replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/listia-app-icon-32.png public/listia-app-icon-180.png public/listia-app-icon-192.png public/listia-app-icon-512.png public/listia-app-icon-maskable-192.png public/listia-app-icon-maskable-512.png public/manifest*.webmanifest public/index.html public/sw.js public/APP_ICON_VERSION.txt
          if git diff --cached --quiet; then
            echo "Official icon already synchronized."
            exit 0
          fi
          git commit -m "fix: set official LISTIA square-house app icon"
          git push origin HEAD:main
