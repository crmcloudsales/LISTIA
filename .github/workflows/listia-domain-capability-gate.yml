name: LISTIA Domain Capability Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/external-domain-guard.js'
      - 'supabase/functions/website-provision/**'
      - 'CLOUDFLARE_SAAS_AUDIT.txt'
      - '.github/workflows/listia-domain-capability-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate browser guard
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/external-domain-guard.js
          node --check public/config.js
          node --check public/sw.js
          grep -Fq 'EXTERNAL_CUSTOM_DOMAINS_ENABLED:false' public/config.js
          grep -Fq '/external-domain-guard.js?v=1' public/config.js
          grep -Fq '/external-domain-guard.js?v=1' public/sw.js
          grep -Fq 'LISTIA_EXTERNAL_DOMAIN_GUARD' public/external-domain-guard.js
      - name: Validate server-side fail-closed behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "LISTIA_EXTERNAL_DOMAINS_ENABLED" supabase/functions/website-provision/index.ts
          grep -Fq "external_domains_temporarily_unavailable" supabase/functions/website-provision/index.ts
          grep -Eq "charge_created:[[:space:]]*false" supabase/functions/website-provision/index.ts
          grep -Eq "listia_subdomain_available:[[:space:]]*true" supabase/functions/website-provision/index.ts
      - name: Validate current Cloudflare capability proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f CLOUDFLARE_SAAS_AUDIT.txt
          grep -Fq 'ready=false' CLOUDFLARE_SAAS_AUDIT.txt
          grep -Fq '"code":1404' CLOUDFLARE_SAAS_AUDIT.txt
          grep -Fq '"code":1456' CLOUDFLARE_SAAS_AUDIT.txt
