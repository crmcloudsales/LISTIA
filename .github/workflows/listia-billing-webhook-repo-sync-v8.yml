name: LISTIA Billing Webhook Repo Sync v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-billing-webhook-repo-sync-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-billing-webhook-repo-sync-v8
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize source with deployed webhook v8
        run: python3 scripts/sync-billing-webhook-v8.py

      - name: Validate canonical billing policy and affiliate commissions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "effectivePlan === 'pro' ? 20 : effectivePlan === 'premium' ? 10 : 30" supabase/functions/billing-stripe-webhook/index.ts
          grep -Fq 'recordAffiliateCommission' supabase/functions/billing-stripe-webhook/index.ts
          grep -Fq 'affiliate_commissions' supabase/functions/billing-stripe-webhook/index.ts

      - name: Commit synchronized webhook source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/billing-stripe-webhook/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Sync LISTIA billing webhook v8 source'
          git pull --rebase origin main
          git push origin HEAD:main
