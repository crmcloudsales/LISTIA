name: Deploy LISTIA App to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'listia-app-worker/index.js'
      - 'wrangler-listia-app.jsonc'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_SECURITY: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CLOUDFLARE_ZONE_ID: cb7b05213bf99ff0700becf4aebdf2ab
      APP_HOSTNAME: app.listiaapp.com
      WORKER_NAME: listia-app
      WRANGLER_VERSION: '4.125.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate PWA 11-language release
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "ru:" public/global-locales.js
          grep -Fq "he:" public/global-locales.js
          grep -Fq "'zh-CN':" public/global-locales.js
          grep -Fq "const LANGUAGE='ja'" public/japanese-locale.js
          grep -Fq "ru-RU" public/listia-voice.js
          grep -Fq "he-IL" public/listia-voice.js
          grep -Fq "zh-CN" public/listia-voice.js
          grep -Fq "ja-JP" public/listia-voice.js
          grep -Fq 'Version 1.4' public/terms.html
          grep -Fq 'Version 1.3' public/privacy.html
          grep -Fq 'single-page-application' wrangler-listia-app.jsonc
          test -f public/manifest-ja.webmanifest
          test -f public/sw.js
          test -f public/_headers
          test -f wrangler-listia-app.jsonc
          test ! -f public/_redirects

      - name: Build protected production artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist-pwa public-source
          cp -a public dist-pwa
          find dist-pwa -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' \) -delete
          find dist-pwa -type f -name '.deploy-trigger-*' -delete
          rm -f dist-pwa/APP_ICON_VERSION.txt

          for file in dist-pwa/*.js; do
            [[ -f "$file" ]] || continue
            tmp="${file}.protected"
            npx --yes terser@5 "$file" --compress passes=2,drop_console=false --mangle --comments false --output "$tmp"
            mv "$tmp" "$file"
          done

          for file in dist-pwa/*.css; do
            [[ -f "$file" ]] || continue
            tmp="${file}.protected"
            npx --yes csso-cli@4 "$file" --output "$tmp"
            mv "$tmp" "$file"
          done

          printf '\n;Object.defineProperty(window,"LISTIA_BUILD_FINGERPRINT",{value:"%s",writable:false,configurable:false});\n' "${GITHUB_SHA}" >> dist-pwa/config.js

          if find dist-pwa -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' \) | grep -q .; then
            echo 'Protected artifact still contains source/development files.'
            exit 1
          fi

          node --check dist-pwa/config.js
          node --check dist-pwa/app.js
          node --check dist-pwa/listia-voice.js
          node --check dist-pwa/assistant-intelligence.js
          grep -Fq "LISTIA_BUILD_FINGERPRINT" dist-pwa/config.js

          mv public public-source
          mv dist-pwa public
          echo "Protected artifact ready for ${GITHUB_SHA}"

      - name: Deploy isolated Workers Static Assets release
        id: worker_deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN_PRIMARY}${CLOUDFLARE_API_TOKEN_SECURITY}" || { echo 'No Cloudflare token is configured'; exit 1; }

          selected=''
          preview_url=''
          for source in security primary; do
            if [[ "${source}" == security ]]; then token="${CLOUDFLARE_API_TOKEN_SECURITY}"; else token="${CLOUDFLARE_API_TOKEN_PRIMARY}"; fi
            [[ -n "${token}" ]] || continue
            echo "Trying Workers Static Assets deployment with ${source} token"
            if CLOUDFLARE_API_TOKEN="${token}" CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}" \
              npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler-listia-app.jsonc \
              2>&1 | tee "/tmp/listia-app-${source}.log"; then
              selected="${source}"
              preview_url="$(grep -Eo 'https://[^[:space:]]+workers\.dev[^[:space:]]*' "/tmp/listia-app-${source}.log" | head -1 | sed 's/[),]$//' || true)"
              break
            fi
          done

          [[ -n "${selected}" ]] || { echo 'WORKER_DEPLOY_BLOCKED: neither token can deploy Workers Static Assets.'; exit 1; }
          [[ -n "${preview_url}" ]] || { echo 'Worker deployed but workers.dev URL could not be resolved from Wrangler output.'; exit 1; }
          echo "token_source=${selected}" >> "${GITHUB_OUTPUT}"
          echo "preview_url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "Worker preview URL: ${preview_url}"

      - name: Smoke-test isolated Worker before production route
        shell: bash
        run: |
          set -Eeuo pipefail
          base='${{ steps.worker_deploy.outputs.preview_url }}'
          ok=false
          for attempt in $(seq 1 12); do
            root="$(curl -sS -L --max-time 20 -o /tmp/worker-root.html -w '%{http_code}' "${base}?lang=ja" || true)"
            voice="$(curl -sS -L --max-time 20 -o /tmp/worker-voice.js -w '%{http_code}' "${base%/}/listia-voice.js" || true)"
            terms="$(curl -sS -L --max-time 20 -o /tmp/worker-terms.html -w '%{http_code}' "${base%/}/terms.html" || true)"
            config="$(curl -sS -L --max-time 20 -o /tmp/worker-config.js -w '%{http_code}' "${base%/}/config.js" || true)"
            if [[ "$root" == 200 && "$voice" == 200 && "$terms" == 200 && "$config" == 200 ]] && grep -Fq 'LISTIA' /tmp/worker-root.html && grep -Fq 'ru-RU' /tmp/worker-voice.js && grep -Fq 'ja-JP' /tmp/worker-voice.js && grep -Fq 'Version 1.4' /tmp/worker-terms.html && grep -Fq 'LISTIA_BUILD_FINGERPRINT' /tmp/worker-config.js; then ok=true; break; fi
            echo "Isolated Worker smoke test waiting (${attempt}/12): root=${root} voice=${voice} terms=${terms} config=${config}"
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'Isolated Worker failed smoke tests; production route was not changed.'; exit 1; }

      - name: Ensure app.listiaapp.com Worker Route
        id: route
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes"
          pattern="${APP_HOSTNAME}/*"
          selected=''
          for source in primary security; do
            if [[ "$source" == primary ]]; then token="${CLOUDFLARE_API_TOKEN_PRIMARY}"; else token="${CLOUDFLARE_API_TOKEN_SECURITY}"; fi
            [[ -n "$token" ]] || continue
            out="/tmp/routes-${source}.json"
            http="$(curl -sS --max-time 25 --header "Authorization: Bearer ${token}" --header 'Accept: application/json' --output "$out" --write-out '%{http_code}' "$api" || true)"
            echo "Workers Routes probe (${source}): HTTP ${http}"
            [[ "$http" == 200 ]] || { jq -c '{success,errors:[(.errors // [])[]|{code,message}]}' "$out" 2>/dev/null || true; continue; }

            exact_count="$(jq --arg pattern "$pattern" '[.result[] | select(.pattern == $pattern)] | length' "$out")"
            exact_script="$(jq -r --arg pattern "$pattern" '[.result[] | select(.pattern == $pattern)][0].script // "absent"' "$out")"
            [[ "$exact_count" -le 1 ]] || { echo 'Refusing ambiguous app route ownership.'; exit 1; }
            if [[ "$exact_count" == 1 ]]; then
              [[ "$exact_script" == "$WORKER_NAME" ]] || { echo "Refusing to overwrite app route owned by ${exact_script}."; exit 1; }
              selected="$source"
              echo 'Existing LISTIA app Worker Route preserved.'
              break
            fi

            body="$(jq -nc --arg pattern "$pattern" --arg script "$WORKER_NAME" '{pattern:$pattern,script:$script}')"
            create_out="/tmp/route-create-${source}.json"
            create_http="$(curl -sS --max-time 30 --request POST --header "Authorization: Bearer ${token}" --header 'Accept: application/json' --header 'Content-Type: application/json' --data "$body" --output "$create_out" --write-out '%{http_code}' "$api" || true)"
            echo "Create LISTIA app route (${source}): HTTP ${create_http}"
            if [[ "$create_http" =~ ^2[0-9][0-9]$ ]] && jq -e '.success == true' "$create_out" >/dev/null 2>&1; then
              selected="$source"
              break
            fi
            jq -c '{success,errors:[(.errors // [])[]|{code,message}]}' "$create_out" 2>/dev/null || true
          done
          [[ -n "$selected" ]] || { echo 'ROUTE_CUTOVER_BLOCKED: no configured token can manage the LISTIA app Worker Route.'; exit 1; }
          echo "token_source=${selected}" >> "$GITHUB_OUTPUT"

      - name: Verify LISTIA production PWA live
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=false
          for attempt in $(seq 1 30); do
            root_ru="$(curl -sS -L --max-time 20 -o /tmp/pwa.html -w '%{http_code}' 'https://app.listiaapp.com/?lang=ru' || true)"
            ja="$(curl -sS -L --max-time 20 -o /tmp/ja.js -w '%{http_code}' 'https://app.listiaapp.com/japanese-locale.js' || true)"
            voice="$(curl -sS -L --max-time 20 -o /tmp/voice.js -w '%{http_code}' 'https://app.listiaapp.com/listia-voice.js' || true)"
            config="$(curl -sS -L --max-time 20 -o /tmp/config.js -w '%{http_code}' 'https://app.listiaapp.com/config.js' || true)"
            terms="$(curl -sS -L --max-time 20 -o /tmp/terms.html -w '%{http_code}' 'https://app.listiaapp.com/terms.html' || true)"
            privacy="$(curl -sS -L --max-time 20 -o /tmp/privacy.html -w '%{http_code}' 'https://app.listiaapp.com/privacy.html' || true)"
            if [[ "$root_ru" == 200 && "$ja" == 200 && "$voice" == 200 && "$config" == 200 && "$terms" == 200 && "$privacy" == 200 ]] && grep -Fq '日本語' /tmp/ja.js && grep -Fq 'ru-RU' /tmp/voice.js && grep -Fq 'ja-JP' /tmp/voice.js && grep -Fq 'LISTIA_BUILD_FINGERPRINT' /tmp/config.js && grep -Fq 'Version 1.4' /tmp/terms.html && grep -Fq 'Version 1.3' /tmp/privacy.html; then ok=true; break; fi
            echo "Production verification waiting (${attempt}/30): root=${root_ru} ja=${ja} voice=${voice} config=${config} terms=${terms} privacy=${privacy}"
            sleep 5
          done
          [[ "$ok" == true ]]
          for lang in es en fr it pt-BR de ar-AE ru he zh-CN ja; do
            code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "https://app.listiaapp.com/?lang=${lang}")"
            test "$code" = 200
          done
          code="$(curl -sS -L --max-time 20 -o /tmp/voice-lab.html -w '%{http_code}' 'https://app.listiaapp.com/voice-lab.html')"
          test "$code" = 200
          grep -Fq '日本語 · 日本' /tmp/voice-lab.html

      - name: Persist PWA live deployment proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          {
            echo 'LISTIA PWA 11-LANGUAGE VOICE DEPLOYMENT VERIFIED'
            echo "verified_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "source_commit=${GITHUB_SHA}"
            echo 'source_worker=listia-app'
            echo 'hosting=Cloudflare Workers Static Assets via Worker Route'
            echo 'route=app.listiaapp.com/*'
            echo "worker_deploy_token_source=${{ steps.worker_deploy.outputs.token_source }}"
            echo "route_token_source=${{ steps.route.outputs.token_source }}"
            echo 'languages=es,en,fr,it,pt-BR,de,ar-AE,ru,he,zh-CN,ja'
            echo 'voice_native_tts_11_languages=true'
            echo 'protected_artifact=true'
            echo 'source_maps=false'
            echo 'client_js_minified=true'
            echo 'build_fingerprint=true'
            echo 'terms_version=1.4'
            echo 'privacy_version=1.3'
            echo 'free_property_limit=3'
          } > PWA_LIVE_DEPLOYMENT_PROOF.txt
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add PWA_LIVE_DEPLOYMENT_PROOF.txt
          git commit -m 'Record verified LISTIA PWA Workers deployment' || exit 0
          git push origin main
