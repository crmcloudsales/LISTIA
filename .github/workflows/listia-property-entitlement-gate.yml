name: LISTIA Property Entitlement Gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/property-intake-start/index.ts'
      - 'supabase/functions/development-unit-promote/index.ts'
      - 'supabase/migrations/20260824113420_pricing_v2_markups_domains_free_three_properties.sql'
      - 'supabase/migrations/20260904123943_enforce_property_plan_limit_at_database_boundary.sql'
      - 'public/app.js'
      - 'public/i18n.js'
      - 'public/i18n-extra.js'
      - 'public/global-locales.js'
      - 'public/japanese-locale.js'
      - '.github/workflows/listia-property-entitlement-gate.yml'
  pull_request:
    paths:
      - 'supabase/functions/property-intake-start/index.ts'
      - 'supabase/functions/development-unit-promote/index.ts'
      - 'supabase/migrations/20260824113420_pricing_v2_markups_domains_free_three_properties.sql'
      - 'supabase/migrations/20260904123943_enforce_property_plan_limit_at_database_boundary.sql'
      - 'public/app.js'
      - 'public/i18n.js'
      - 'public/i18n-extra.js'
      - 'public/global-locales.js'
      - 'public/japanese-locale.js'
      - '.github/workflows/listia-property-entitlement-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entitlement-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify canonical LISTIA property entitlement boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          intake='supabase/functions/property-intake-start/index.ts'
          promote='supabase/functions/development-unit-promote/index.ts'
          pricing='supabase/migrations/20260824113420_pricing_v2_markups_domains_free_three_properties.sql'
          boundary='supabase/migrations/20260904123943_enforce_property_plan_limit_at_database_boundary.sql'

          # Canonical plan entitlement lives in private.plan_entitlements.
          grep -Fq 'create table if not exists private.plan_entitlements' "$pricing"
          grep -Fq "('free',3,50,now())" "$pricing"
          grep -Fq "('pro',null,25,now())" "$pricing"
          grep -Fq "('premium',null,12.5,now())" "$pricing"
          grep -Fq 'revoke all on private.plan_entitlements from public, anon, authenticated' "$pricing"

          # Browser/Edge intake must consume the canonical entitlement and
          # serialize count + insert in the same transaction.
          grep -Fq 'private.plan_entitlements' "$intake"
          grep -Fq 'pg_advisory_xact_lock' "$intake"
          grep -Fq "status <> 'archived'" "$intake"
          grep -Fq "error: 'property_limit_reached'" "$intake"
          grep -Fq "error: 'plan_entitlement_unavailable'" "$intake"
          grep -Fq 'await sql.begin' "$intake"

          # The Edge Function must not drift back to a duplicated free-only quota.
          ! grep -Eq "plan\s*===\s*['\"]free['\"].*(>=\s*3|>\s*2)" "$intake"
          ! grep -Fq 'free_property_limit' "$intake"

          # Database trigger is the final authority for every property creation
          # path, including current and future service-role functions.
          grep -Fq 'create or replace function private.enforce_property_plan_limit()' "$boundary"
          grep -Fq 'create trigger enforce_property_plan_limit' "$boundary"
          grep -Fq 'before insert or update of status, organization_id on public.properties' "$boundary"
          grep -Fq 'private.plan_entitlements' "$boundary"
          grep -Fq 'pg_advisory_xact_lock' "$boundary"
          grep -Fq "new.status = 'archived'" "$boundary"
          grep -Fq "p.status <> 'archived'" "$boundary"
          grep -Fq "message = 'property_limit_reached'" "$boundary"
          grep -Fq "message = 'plan_entitlement_unavailable'" "$boundary"

          # Development-unit promotion must surface quota failures instead of
          # masking them as a generic server error.
          grep -Fq "diagnostic.includes('property_limit_reached')" "$promote"
          grep -Fq "return out({ error: 'property_limit_reached' }, 409" "$promote"
          grep -Fq "diagnostic.includes('plan_entitlement_unavailable')" "$promote"
          grep -Fq "return out({ error: 'plan_entitlement_unavailable' }, 503" "$promote"

          # Runtime and product copy must describe the same entitlement.
          grep -Fq '"property_limit_reached": "msg.free_property_limit"' public/app.js
          grep -Fq 'raw === "property_limit_reached"' public/app.js
          ! grep -Fq '"free_property_limit": "msg.free_property_limit"' public/app.js
          ! grep -Fq 'raw === "free_property_limit"' public/app.js

          for locale_file in public/i18n.js public/i18n-extra.js public/global-locales.js public/japanese-locale.js; do
            ! grep -Eq "intake\.free_note.*(incluye 1 propiedad|includes 1 property|comprend 1 bien|include 1 immobile|inclui 1 imóvel|umfasst 1 Immobilie|عقاراً واحداً)" "$locale_file"
            ! grep -Eq "signup\.password_placeholder.*8" "$locale_file"
            ! grep -Eq "msg\.password_min8_signup.*8" "$locale_file"
          done

          grep -Fq "Free incluye hasta 3 propiedades activas" public/i18n.js
          grep -Fq "Free includes up to 3 active properties" public/i18n.js
          grep -Fq "Free comprend jusqu’à 3 biens actifs" public/i18n.js
          grep -Fq "fino a 3 immobili attivi" public/i18n-extra.js
          grep -Fq "até 3 imóveis ativos" public/i18n-extra.js
          grep -Fq "bis zu 3 aktive Immobilien" public/i18n-extra.js
          grep -Fq "3 عقارات نشطة" public/i18n-extra.js
          grep -Fq "до 3 активных объектов" public/global-locales.js
          grep -Fq "עד 3 נכסים פעילים" public/global-locales.js
          grep -Fq "3 个活跃房源" public/global-locales.js
          grep -Fq "最大3件の有効な物件" public/japanese-locale.js

          echo 'LISTIA_PROPERTY_ENTITLEMENT_BOUNDARY_OK'
