name: LISTIA Independence Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'listia-app-worker/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/20260904140142_retire_legacy_cloudco_investment_resources.sql'
      - 'supabase/migrations/20260904160900_move_property_ai_to_listia_native_runtime.sql'
      - '.github/workflows/listia-independence-gate.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'listia-app-worker/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/20260904140142_retire_legacy_cloudco_investment_resources.sql'
      - 'supabase/migrations/20260904160900_move_property_ai_to_listia_native_runtime.sql'
      - '.github/workflows/listia-independence-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify LISTIA runtime independence
        shell: bash
        run: |
          set -Eeuo pipefail

          # Block actual cross-product resources. The GitHub owner name crmcloudsales
          # is not itself a product dependency and is intentionally not matched.
          forbidden='cloudsales\.app|@cloudsales\.app|cloudsalescrm\.com|CLOUDSALES_[A-Z0-9_]*|fkahaqprzgcimgyathqx|listia_cloudco_nvidia_gateway_token|nvidia:cloudco|cloudco_gateway'
          if grep -RniE "$forbidden" public listia-app-worker supabase/functions --exclude-dir=node_modules; then
            echo 'Cross-product dependency detected in LISTIA runtime.'
            exit 1
          fi

          legacy='supabase/functions/cloudco-investment-lead/index.ts'
          canonical='supabase/functions/listia-investment-lead/index.ts'
          property_ai='supabase/functions/property-ai-worker/index.ts'
          ai_engine='supabase/functions/listia-ai-engine/index.ts'
          legacy_migration='supabase/migrations/20260904140142_retire_legacy_cloudco_investment_resources.sql'
          ai_migration='supabase/migrations/20260904160900_move_property_ai_to_listia_native_runtime.sql'

          # Historical CloudCo-named public form endpoint is allowed only as a
          # no-I/O tombstone. It must never regain database or external transport access.
          grep -Fq "error: 'retired_endpoint'" "$legacy"
          grep -Fq "replacement: 'listia-investment-lead'" "$legacy"
          grep -Fq "boundary: 'LISTIA_ONLY'" "$legacy"
          grep -Fq 'status: 410' "$legacy"
          ! grep -Fq 'SUPABASE_DB_URL' "$legacy"
          ! grep -Fq 'formsubmit.co' "$legacy"
          ! grep -Fq 'cloudco_investment_leads' "$legacy"
          ! grep -Fq 'cloudco_form_rate_limits' "$legacy"

          # Canonical investment flow is LISTIA-owned end to end.
          grep -Fq 'listia_investment_leads' "$canonical"
          grep -Fq 'listia_public_form_rate_limit_consume' "$canonical"
          grep -Fq 'listia_email_enqueue' "$canonical"
          grep -Fq "boundary:'LISTIA_ONLY'" "$canonical"
          ! grep -Fq 'formsubmit.co' "$canonical"

          # Property AI remains LISTIA-owned, but provider routing is now centralized
          # behind the authenticated LISTIA AI engine rather than hard-coded in this worker.
          grep -Fq "name='listia_ai_engine_secret'" "$property_ai"
          grep -Fq '/functions/v1/listia-ai-engine' "$property_ai"
          grep -Fq "task_type:'property_extract'" "$property_ai"
          grep -Fq "data_classification:'private'" "$property_ai"
          grep -Fq "LOCAL_MODEL='deterministic-property-type-v1'" "$property_ai"
          ! grep -Fq 'fkahaqprzgcimgyathqx' "$property_ai"
          ! grep -Fq 'listia_cloudco_nvidia_gateway_token' "$property_ai"
          ! grep -Fq 'cloudco_gateway' "$property_ai"

          # Central engine is authenticated with a LISTIA-owned secret and enforces
          # the free-only default before a provider adapter can execute.
          grep -Fq "name='listia_ai_engine_secret'" "$ai_engine"
          grep -Fq "mode:'free_only'" "$ai_engine"
          grep -Fq 'paid_fallback_enabled:false' "$ai_engine"
          grep -Fq "data_classification" "$ai_engine"
          grep -Fq "premium_spend_blocked" "$ai_engine"

          # Legacy tables remain historical only and are closed to browser roles.
          grep -Fq 'revoke all on public.cloudco_investment_leads from public, anon, authenticated' "$legacy_migration"
          grep -Fq 'revoke all on public.cloudco_form_rate_limits from public, anon, authenticated' "$legacy_migration"
          grep -Fq 'LEGACY RETIRED' "$legacy_migration"

          # Historical migration established the LISTIA-owned provider registry.
          # Runtime execution may now be centralized through listia-ai-engine.
          grep -Fq "'nvidia:listia_direct'" "$ai_migration"
          grep -Fq "'listia_nvidia_api_key'" "$ai_migration"
          grep -Fq "'credential_owner', 'listia'" "$ai_migration"
          grep -Fq "'deterministic_property_type_v1'" "$ai_migration"

          echo 'LISTIA_RUNTIME_INDEPENDENCE_OK'
