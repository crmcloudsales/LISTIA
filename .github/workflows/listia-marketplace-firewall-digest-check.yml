name: LISTIA Marketplace Firewall Digest Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-marketplace-firewall-digest-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for firewall digest endpoint and print SHA-256 only
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://app.listiaapp.com'
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/digest.json -w '%{http_code}' "$base/api/marketplace/firewall-digest" \
              -H 'Origin: https://app.listiaapp.com' \
              -H 'Referer: https://app.listiaapp.com/marketplace' \
              -H 'Sec-Fetch-Site: same-origin' \
              -H 'Sec-Fetch-Mode: cors' \
              -H 'Accept: application/json' \
              -H 'User-Agent: Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' || true)
            if [ "$code" = '200' ]; then
              python3 - <<'PY'
          import json,re
          x=json.load(open('/tmp/digest.json'))
          h=str(x.get('sha256',''))
          assert re.fullmatch(r'[0-9a-f]{64}',h), x
          print('MARKETPLACE_EDGE_PROOF_SHA256='+h)
          PY
              exit 0
            fi
            echo "Digest endpoint waiting (${i}/90) HTTP ${code}"
            sleep 6
          done
          echo 'Digest endpoint did not become available in time'
          cat /tmp/digest.json || true
          exit 1
