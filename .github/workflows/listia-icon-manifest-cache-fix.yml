name: LISTIA Icon Manifest Cache Fix
on:
  push:
    paths:
      - '.github/workflows/listia-icon-manifest-cache-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch manifest cache version only
        run: |
          sed -i 's#manifest-en.webmanifest?v=12#manifest-en.webmanifest?v=14#g' public/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: refresh LISTIA app manifest cache reference"
          git push origin HEAD:main
