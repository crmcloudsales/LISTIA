name: LISTIA Conversion Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/conversion-health.js'
      - 'supabase/functions/conversion-integrations-status/**'
      - '.github/workflows/listia-conversion-readiness-gate.yml'
  pull_request:
    paths:
      - 'public/conversion-health.js'
      - 'supabase/functions/conversion-integrations-status/**'
      - '.github/workflows/listia-conversion-readiness-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Signal Health client contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/conversion-health.js
          grep -Fq 'missing_requirements' public/conversion-health.js
          grep -Fq 'function requirementGroup(code)' public/conversion-health.js
          grep -Fq 'signal-health-needs' public/conversion-health.js
          grep -Fq "need_permission" public/conversion-health.js
          grep -Fq "need_account" public/conversion-health.js
          grep -Fq "need_events" public/conversion-health.js

      - name: Validate safe readiness API contract
        shell: bash
        run: |
          set -Eeuo pipefail
          edge='supabase/functions/conversion-integrations-status/index.ts'
          grep -Fq 'missing_requirements' "$edge"
          grep -Fq 'safeConfig(c)' "$edge"
          grep -Fq "token:{present:" "$edge"
          grep -Fq "google_datamanager_scope" "$edge"
          grep -Fq "google_ads_customer" "$edge"
          grep -Fq "google_qualified_lead_action" "$edge"
          grep -Fq "google_appointment_action" "$edge"
          grep -Fq "google_conversion_action" "$edge"
          if grep -Eq 'account_id:m|customer_id:m|dataset_id:m|advertiser_id:m|conversion_id:m' "$edge"; then
            echo 'ERROR: conversion readiness API exposes raw provider identifiers.'
            exit 1
          fi
          echo 'LISTIA conversion readiness contract passed.'
