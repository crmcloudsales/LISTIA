name: LISTIA Conversion Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/conversion-health.js'
      - 'public/google-ads-connect.js'
      - 'supabase/functions/conversion-integrations-status/**'
      - 'supabase/functions/conversion-signal-dispatch/**'
      - 'supabase/functions/google-ads-config/**'
      - 'supabase/functions/google-oauth-start/**'
      - 'supabase/functions/google-oauth-callback/**'
      - '.github/workflows/listia-conversion-readiness-gate.yml'
  pull_request:
    paths:
      - 'public/conversion-health.js'
      - 'public/google-ads-connect.js'
      - 'supabase/functions/conversion-integrations-status/**'
      - 'supabase/functions/conversion-signal-dispatch/**'
      - 'supabase/functions/google-ads-config/**'
      - 'supabase/functions/google-oauth-start/**'
      - 'supabase/functions/google-oauth-callback/**'
      - '.github/workflows/listia-conversion-readiness-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Signal Health client contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/conversion-health.js
          node --check public/google-ads-connect.js
          grep -Fq 'missing_requirements' public/conversion-health.js
          grep -Fq 'function requirementGroup(code)' public/conversion-health.js
          grep -Fq 'signal-health-needs' public/conversion-health.js
          grep -Fq "need_permission" public/conversion-health.js
          grep -Fq "need_account" public/conversion-health.js
          grep -Fq "need_events" public/conversion-health.js
          grep -Fq "['qualified_lead','appointment','conversion'].every" public/google-ads-connect.js
          grep -Fq 'actions for qualified lead, appointment and conversion' public/google-ads-connect.js

      - name: Validate safe readiness API contract
        shell: bash
        run: |
          set -Eeuo pipefail
          edge='supabase/functions/conversion-integrations-status/index.ts'
          grep -Fq 'missing_requirements' "$edge"
          grep -Fq 'safeConfig(c)' "$edge"
          grep -Fq "token:{present:" "$edge"
          grep -Fq "google_datamanager_scope" "$edge"
          grep -Fq "google_ads_customer" "$edge"
          grep -Fq "for(const k of ['qualified_lead','appointment','conversion'])" "$edge"
          grep -Fq 'missing.push(`google_${k}_action`)' "$edge"
          if grep -Eq 'account_id:m|customer_id:m|dataset_id:m|advertiser_id:m|conversion_id:m' "$edge"; then
            echo 'ERROR: conversion readiness API exposes raw provider identifiers.'
            exit 1
          fi

      - name: Validate Google Ads full-readiness flow
        shell: bash
        run: |
          set -Eeuo pipefail
          config='supabase/functions/google-ads-config/index.ts'
          start='supabase/functions/google-oauth-start/index.ts'
          callback='supabase/functions/google-oauth-callback/index.ts'
          grep -Fq "const requiredActions=['qualified_lead','appointment','conversion'] as const" "$config"
          grep -Fq 'const ready=requiredActions.every' "$config"
          grep -Fq 'missing_actions:requiredActions.filter' "$config"
          ! grep -Fq 'ok:true,google_ads_customer_id:' "$config"
          grep -Fq "const ADS_SCOPES=['https://www.googleapis.com/auth/datamanager']" "$start"
          grep -Fq "if(caps.includes('ads'))for(const s of ADS_SCOPES)scopeSet.add(s)" "$start"
          grep -Fq 'function uniqScopes(existing:unknown,incoming:string)' "$callback"
          grep -Fq 'refresh_token_secret_id=coalesce(excluded.refresh_token_secret_id' "$callback"

      - name: Validate conversion dispatch privacy and quality gates
        shell: bash
        run: |
          set -Eeuo pipefail
          dispatch='supabase/functions/conversion-signal-dispatch/index.ts'
          grep -Fq "blockedVerification=new Set(['bot','suspicious','duplicate','fake','invalid','blocked','junk','spam'])" "$dispatch"
          grep -Fq "if(requireConsent&&!granted)" "$dispatch"
          grep -Fq "last_error='marketing_consent_required'" "$dispatch"
          grep -Fq "minQ!==null&&(q===null||q<minQ)" "$dispatch"
          grep -Fq "last_error='lead_quality_gate'" "$dispatch"
          grep -Fq 'user.externalIds=[await sha256(String(lead.id))]' "$dispatch"
          ! grep -Fq 'user.externalIds=[String(lead.id)]' "$dispatch"
          echo 'LISTIA conversion readiness and dispatch privacy contract passed.'
