name: LISTIA Official Brand Assets v8

on:
  push:
    branches: [main]
    paths:
      - 'public/listia-official-icon-v3.svg'
      - 'public/listia-official-icon-maskable-v4.svg'
      - 'public/listia-site-isotipo-v4.svg'
      - 'public/listia-wordmark-light.webp'
      - 'public/listia-wordmark-dark.webp'
      - '.github/workflows/listia-official-app-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-official-brand-assets-v8
  cancel-in-progress: true

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Build official derivatives
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import cairosvg

          root=Path('public')
          def render(svg_path,size):
              data=cairosvg.svg2png(url=str(svg_path),output_width=size,output_height=size)
              return Image.open(BytesIO(data)).convert('RGBA')
          def png(img,path): img.save(path,format='PNG',optimize=True)

          app_svg=root/'listia-official-icon-v3.svg'
          mask_svg=root/'listia-official-icon-maskable-v4.svg'
          iso_svg=root/'listia-site-isotipo-v4.svg'

          for size in (32,180,192,512):
              png(render(app_svg,size),root/f'listia-app-icon-{size}.png')
          for size in (192,512):
              png(render(mask_svg,size),root/f'listia-app-icon-maskable-{size}.png')
          render(app_svg,1024).convert('RGB').save(root/'listia-app-icon-official.jpg',quality=95,optimize=True)

          iso1024=render(iso_svg,1024)
          png(iso1024,root/'listia-isotipo-official-v4.png')
          for size,name in ((32,'listia-isotipo-32-v2.png'),(180,'listia-isotipo-180-v2.png'),(192,'listia-isotipo-192-v2.png'),(512,'listia-isotipo-512-v2.png')):
              png(render(iso_svg,size),root/name)
          png(render(iso_svg,192),root/'listia-isotipo-maskable-192-v3.png')
          png(render(iso_svg,512),root/'listia-isotipo-maskable-512-v3.png')

          mark=render(iso_svg,512)
          mark.save(root/'listia-mark-transparent.webp',format='WEBP',lossless=True,method=6)
          wm=Image.open(root/'listia-wordmark-light.webp').convert('RGBA')
          target_h=180
          wm=wm.resize((round(wm.width*target_h/wm.height),target_h),Image.Resampling.LANCZOS)
          iso=render(iso_svg,260)
          pad,gap=20,28
          canvas=Image.new('RGBA',(pad+iso.width+gap+wm.width+pad,max(iso.height,wm.height)+2*pad),(0,0,0,0))
          canvas.alpha_composite(iso,(pad,(canvas.height-iso.height)//2))
          canvas.alpha_composite(wm,(pad+iso.width+gap,(canvas.height-wm.height)//2))
          canvas.save(root/'listia-logo-transparent.webp',format='WEBP',lossless=True,method=6)
          PY
      - name: Validate generated scope
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)marketplace' >/dev/null; then
            echo 'Brand build must never modify Marketplace files.'
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
      - name: Commit derivatives
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/listia-app-icon-32.png public/listia-app-icon-180.png public/listia-app-icon-192.png public/listia-app-icon-512.png \
            public/listia-app-icon-maskable-192.png public/listia-app-icon-maskable-512.png public/listia-app-icon-official.jpg \
            public/listia-isotipo-official-v4.png public/listia-isotipo-32-v2.png public/listia-isotipo-180-v2.png public/listia-isotipo-192-v2.png public/listia-isotipo-512-v2.png \
            public/listia-isotipo-maskable-192-v3.png public/listia-isotipo-maskable-512-v3.png public/listia-mark-transparent.webp public/listia-logo-transparent.webp
          if git diff --cached --quiet; then echo 'Brand derivatives already current.'; exit 0; fi
          git commit -m 'Build LISTIA official brand assets v8'
          git pull --rebase origin main
          git push origin HEAD:main
