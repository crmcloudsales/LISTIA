name: LISTIA Official App Icon v15 Lock

on:
  push:
    branches: [main]
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/index.html'
      - 'public/manifest*.webmanifest'
      - 'public/listia-app-icon-*.png'
      - 'public/listia-official-icon-v5.svg'
      - 'public/APP_ICON_VERSION.txt'
      - '.github/workflows/listia-official-app-icon.yml'
  pull_request:
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/index.html'
      - 'public/manifest*.webmanifest'
      - 'public/listia-app-icon-*.png'
      - 'public/listia-official-icon-v5.svg'
      - 'public/APP_ICON_VERSION.txt'
      - '.github/workflows/listia-official-app-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-brand-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate canonical LISTIA installed-app icon v15
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f public/listia-official-icon-v5.svg
          grep -Fq '<rect width="1536" height="1536" fill="url(#g)"/>' public/listia-official-icon-v5.svg
          grep -Fq 'translate(768 765) scale(.90)' public/listia-official-icon-v5.svg
          grep -Fq 'fill="#fff"' public/listia-official-icon-v5.svg
          if grep -Fq 'fill="url(#house)"' public/listia-official-icon-v5.svg; then
            echo 'Purple house must not return; official launcher house is white.' >&2
            exit 1
          fi
          for f in public/listia-app-icon-32.png public/listia-app-icon-180.png public/listia-app-icon-192.png public/listia-app-icon-512.png public/listia-app-icon-maskable-192.png public/listia-app-icon-maskable-512.png; do test -f "$f"; done
          node --check public/config.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={'listia-app-icon-32.png':(32,32),'listia-app-icon-180.png':(180,180),'listia-app-icon-192.png':(192,192),'listia-app-icon-512.png':(512,512),'listia-app-icon-maskable-192.png':(192,192),'listia-app-icon-maskable-512.png':(512,512)}
          for name,size in expected.items():
              data=(Path('public')/name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{name}: invalid PNG')
              width,height=struct.unpack('>II',data[16:24])
              if (width,height)!=size: raise SystemExit(f'{name}: expected {size}, got {(width,height)}')
          PY
          node <<'NODE'
          const fs=require('fs');
          const config=fs.readFileSync('public/config.js','utf8');
          if(!config.includes("const v='15'")) throw new Error('config.js must force icon cache v15');
          const files=fs.readdirSync('public').filter(f=>/^manifest.*\.webmanifest$/.test(f));
          if(files.length<12) throw new Error(`Expected at least 12 manifests, found ${files.length}`);
          for(const file of files){
            const m=JSON.parse(fs.readFileSync(`public/${file}`,'utf8'));
            for(const icon of m.icons||[]){
              if(!String(icon.src||'').endsWith('?v=15')) throw new Error(`${file}: stale icon ${icon.src}`);
            }
          }
          const marker=fs.readFileSync('public/APP_ICON_VERSION.txt','utf8');
          for(const expected of ['icon_version=15','white_house=required','outer_white_background=removed','house_scale=0.90','extra_wheel_or_pointer=forbidden','cache_version=v15']){
            if(!marker.includes(expected)) throw new Error(`Missing canonical marker ${expected}`);
          }
          console.log('LISTIA app icon v15 lock OK: white house, full-bleed purple, no wheel/pointer, no outer white tile');
          NODE
