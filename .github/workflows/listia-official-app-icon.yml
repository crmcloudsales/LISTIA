name: Install official LISTIA application icon

on:
  push:
    branches: [main]
    paths:
      - '.github/icon-source/**'
      - '.github/workflows/listia-official-app-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-official-app-icon
  cancel-in-progress: false

jobs:
  install-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect staged exact source
        id: source
        shell: bash
        run: |
          if [[ -f .github/icon-source/part07b07.b64 ]]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi

      - name: Reconstruct and verify exact user-supplied source
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat \
            .github/icon-source/part01.b64 \
            .github/icon-source/part02.b64 \
            .github/icon-source/part03.b64 \
            .github/icon-source/part04.b64 \
            .github/icon-source/part05.b64 \
            .github/icon-source/part06.b64 \
            .github/icon-source/part07a.b64 \
            .github/icon-source/part07b01.b64 \
            .github/icon-source/part07b02.b64 \
            .github/icon-source/part07b03.b64 \
            .github/icon-source/part07b04.b64 \
            .github/icon-source/part07b05.b64 \
            .github/icon-source/part07b06.b64 \
            .github/icon-source/part07b07.b64 \
            | tr -d '\n\r ' | base64 --decode > /tmp/listia-app-icon-official.jpg
          echo 'aab91cc3ce7cd1bece514a3763253147dcf4e364b5074d02b852befe1973befa  /tmp/listia-app-icon-official.jpg' | sha256sum -c -
          file /tmp/listia-app-icon-official.jpg

      - name: Build application icon derivatives
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('/tmp/listia-app-icon-official.jpg')
          im=Image.open(src)
          assert im.size==(1536,1536), im.size
          if im.mode not in ('RGB','RGBA'): im=im.convert('RGB')
          out=Path('public')
          (out/'listia-app-icon-official.jpg').write_bytes(src.read_bytes())
          for size in (32,180,192,512): im.resize((size,size),Image.Resampling.LANCZOS).save(out/f'listia-app-icon-{size}.png','PNG',optimize=True)
          for size in (192,512): im.resize((size,size),Image.Resampling.LANCZOS).save(out/f'listia-app-icon-maskable-{size}.png','PNG',optimize=True)
          PY

      - name: Wire icon into PWA only
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          icons=[
            {'src':'/listia-app-icon-192.png?v=1','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'/listia-app-icon-512.png?v=1','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'/listia-app-icon-maskable-192.png?v=1','sizes':'192x192','type':'image/png','purpose':'maskable'},
            {'src':'/listia-app-icon-maskable-512.png?v=1','sizes':'512x512','type':'image/png','purpose':'maskable'}]
          manifests=list(Path('public').glob('manifest*.webmanifest'))
          for p in manifests:
              d=json.loads(p.read_text(encoding='utf-8')); d['icons']=icons; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('public/index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link href="/listia-isotipo-180-v2\.png\?v=\d+" rel="apple-touch-icon" sizes="180x180"/>','<link href="/listia-app-icon-180.png?v=1" rel="apple-touch-icon" sizes="180x180"/>',s)
          s=re.sub(r'<link href="/listia-isotipo-32-v2\.png\?v=\d+" rel="icon" sizes="32x32" type="image/png"/>','<link href="/listia-app-icon-32.png?v=1" rel="icon" sizes="32x32" type="image/png"/>',s)
          assert 'class="brand-logo" src="/listia-logo-transparent.webp"' in s
          p.write_text(s,encoding='utf-8')
          p=Path('public/sw.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE="listia-pwa-v[^"]+";','const CACHE="listia-pwa-v0.9.9";',s)
          for a,b in {
            '/listia-isotipo-192-v2.png?v=4':'/listia-app-icon-192.png?v=1','/listia-isotipo-512-v2.png?v=4':'/listia-app-icon-512.png?v=1',
            '/listia-isotipo-maskable-192-v3.png?v=5':'/listia-app-icon-maskable-192.png?v=1','/listia-isotipo-maskable-512-v3.png?v=5':'/listia-app-icon-maskable-512.png?v=1',
            '/listia-isotipo-180-v2.png?v=4':'/listia-app-icon-180.png?v=1','/listia-isotipo-32-v2.png?v=4':'/listia-app-icon-32.png?v=1'}.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          p=Path('public/_headers'); s=p.read_text(encoding='utf-8')
          if '/listia-app-icon-*.png' not in s: s=s.rstrip()+'\n\n/listia-app-icon-*.png\n  Cache-Control: public, max-age=31536000, immutable\n\n/listia-app-icon-official.jpg\n  Cache-Control: public, max-age=31536000, immutable\n'
          p.write_text(s,encoding='utf-8')
          assert len(manifests)>=12
          PY

      - name: Commit exact official app icon
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/icon-source
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public .github/icon-source
          git commit -m 'feat: set supplied artwork as official LISTIA application icon'
          for attempt in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
