name: LISTIA Official Brand Assets v9 Lock

on:
  push:
    branches: [main]
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/index.html'
      - 'public/manifest*.webmanifest'
      - 'public/listia-app-icon-*.png'
      - 'public/listia-app-icon-official.jpg'
      - 'public/listia-official-icon-v3.svg'
      - 'public/listia-official-icon-maskable-v4.svg'
      - 'public/listia-site-isotipo-v4.svg'
      - 'public/listia-wordmark-*.webp'
      - 'public/listia-logo-transparent.webp'
      - 'public/listia-mark-transparent.webp'
      - '.github/workflows/listia-official-app-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-brand-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate canonical LISTIA branding transition v8 to v9
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object public/listia-official-icon-v3.svg)" = "665cee559b286d8087748339b23c2838cab45362"
          test -f public/listia-app-icon-32.png
          test -f public/listia-app-icon-180.png
          test -f public/listia-app-icon-192.png
          test -f public/listia-app-icon-512.png
          test -f public/listia-app-icon-maskable-192.png
          test -f public/listia-app-icon-maskable-512.png
          node --check public/config.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={
            'listia-app-icon-32.png':(32,32),
            'listia-app-icon-180.png':(180,180),
            'listia-app-icon-192.png':(192,192),
            'listia-app-icon-512.png':(512,512),
            'listia-app-icon-maskable-192.png':(192,192),
            'listia-app-icon-maskable-512.png':(512,512),
          }
          for name,size in expected.items():
              data=(Path('public')/name).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{name}: invalid PNG')
              width,height=struct.unpack('>II',data[16:24])
              if (width,height)!=size: raise SystemExit(f'{name}: expected {size}, got {(width,height)}')
          PY
          node <<'NODE'
          const fs=require('fs');
          const config=fs.readFileSync('public/config.js','utf8');
          const sw=fs.readFileSync('public/sw.js','utf8');
          const app=config.match(/BOOTSTRAP_VERSION:"([^"]+)"/);
          const cache=sw.match(/const CACHE="listia-pwa-v([^"]+)"/);
          if(!app||!cache) throw new Error('Missing LISTIA release metadata');
          if(app[1]!==cache[1]) throw new Error(`PWA release mismatch app=${app?.[1]} cache=${cache?.[1]}`);
          if(!['0.27.2','0.27.3'].includes(app[1])) throw new Error(`Unexpected release ${app[1]}`);
          const files=fs.readdirSync('public').filter(f=>/^manifest.*\.webmanifest$/.test(f));
          if(files.length<12) throw new Error(`Expected at least 12 manifests, found ${files.length}`);
          const versions=new Set();
          for(const file of files){
            const m=JSON.parse(fs.readFileSync(`public/${file}`,'utf8'));
            if(!Array.isArray(m.icons)||!m.icons.length) throw new Error(`${file}: missing icons`);
            for(const icon of m.icons){
              const src=String(icon.src||'');
              const match=src.match(/\?v=(\d+)$/);
              if(!match) throw new Error(`${file}: unversioned icon ${src}`);
              versions.add(match[1]);
            }
          }
          if(versions.size!==1||![...versions].every(v=>v==='8'||v==='9')) throw new Error(`Mixed or unexpected icon versions: ${[...versions]}`);
          console.log(`LISTIA brand lock OK release=${app[1]} icon=v${[...versions][0]}`);
          NODE
