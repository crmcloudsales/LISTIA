name: LISTIA Commercial Generated Deploy Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-commercial-generated-deploy-bridge.yml'
  workflow_run:
    workflows:
      - 'LISTIA Commercial Isolation Apply'
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: listia-commercial-generated-deploy-bridge
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch commercial preview/deploy and resource isolation validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          for workflow in listia-commercial-global-i18n-v1.yml listia-resource-isolation-gate.yml; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"main"}'
            echo "Dispatched ${workflow} on main"
          done
