name: LISTIA PWA Browser Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-pwa-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit LISTIA production in mobile browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const pageErrors=[];const consoleErrors=[];const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||''}`));
            const response=await page.goto('https://app.listiaapp.com/?audit=browser',{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()!==200)throw new Error(`root HTTP ${response?.status()}`);
            await page.waitForFunction(()=>window.LISTIA_BOOTSTRAP_STATE!==undefined,{timeout:45000});
            await page.waitForFunction(()=>window.LISTIA_BOOTSTRAP_STATE?.ready===true,{timeout:60000});
            await page.waitForSelector('#screen-marketplace',{state:'attached',timeout:20000});
            await page.waitForSelector('#listiaVoiceButton',{state:'attached',timeout:20000});
            const state=await page.evaluate(()=>({
              bootstrap:window.LISTIA_BOOTSTRAP_STATE,
              voice:!!window.LISTIA_VOICE,
              marketplace:!!document.getElementById('screen-marketplace'),
              detail:!!document.getElementById('screen-marketplace-detail'),
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              bodyWidth:document.body.scrollWidth,
              name:document.querySelector('link[rel="manifest"]')?.href||''
            }));
            console.log(JSON.stringify(state,null,2));
            if(!state.voice||!state.marketplace||!state.detail)throw new Error('advanced runtime modules not mounted');
            if(state.scrollWidth>state.viewport+2||state.bodyWidth>state.viewport+2)throw new Error(`horizontal overflow viewport=${state.viewport} html=${state.scrollWidth} body=${state.bodyWidth}`);
            if(pageErrors.length)throw new Error('page errors: '+pageErrors.join(' | '));
            const criticalFailed=failed.filter(x=>/listia-bootstrap|marketplace|listia-voice|runtime|account-center|office-modules/i.test(x));
            if(criticalFailed.length)throw new Error('critical failed requests: '+criticalFailed.join(' | '));
            console.log(`consoleErrors=${consoleErrors.length} failedRequests=${failed.length}`);
            if(consoleErrors.length)console.log('CONSOLE_ERRORS\n'+consoleErrors.join('\n'));
            if(failed.length)console.log('FAILED_REQUESTS\n'+failed.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
