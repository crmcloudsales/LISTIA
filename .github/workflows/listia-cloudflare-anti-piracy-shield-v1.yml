name: LISTIA Cloudflare Anti-Piracy Shield v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-cloudflare-anti-piracy-shield-v1.yml'

permissions:
  contents: read

jobs:
  shield:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: listiaapp.com
    steps:
      - name: Upgrade all five LISTIA WAF rules in place
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${CF_TOKEN:-}" && -n "${CF_ACCOUNT_ID:-}" ]] || { echo 'Missing Cloudflare security credentials'; exit 1; }
          z=$(mktemp)
          curl -fsS --get -H "Authorization: Bearer ${CF_TOKEN}" --data-urlencode "name=${ZONE_NAME}" --data-urlencode "account.id=${CF_ACCOUNT_ID}" 'https://api.cloudflare.com/client/v4/zones' > "$z"
          ZONE_ID=$(jq -r '.result[0].id // empty' "$z")
          [[ -n "$ZONE_ID" ]] || exit 2
          current=$(mktemp)
          curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_firewall_custom/entrypoint" > "$current"
          RULESET_ID=$(jq -r '.result.id // empty' "$current")
          [[ -n "$RULESET_ID" ]] || exit 3

          patch_rule() {
            local desc="$1" extra="${2:-}" id expr combined payload out code
            id=$(jq -r --arg d "$desc" '.result.rules[]? | select(.description==$d) | .id' "$current" | head -n1)
            expr=$(jq -r --arg d "$desc" '.result.rules[]? | select(.description==$d) | .expression' "$current" | head -n1)
            [[ -n "$id" && -n "$expr" ]] || { echo "Missing rule: $desc"; exit 4; }
            if [[ -n "$extra" && "$expr" != *"${extra:0:20}"* ]]; then combined="(${expr} or ${extra})"; else combined="$expr"; fi
            payload=$(jq -nc --arg d "$desc" --arg e "$combined" '{description:$d,expression:$e,action:"block",enabled:true}')
            out=$(mktemp)
            code=$(curl -sS -X PATCH -o "$out" -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json' --data "$payload" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/${RULESET_ID}/rules/${id}")
            [[ "$code" =~ ^20 ]] && jq -e '.success == true' "$out" >/dev/null || { jq '{success,errors}' "$out"; exit 5; }
          }

          patch_rule 'LISTIA P3 1/5 - Sensitive files and secrets' '(starts_with(lower(raw.http.request.uri.path), "/.aws") or starts_with(lower(raw.http.request.uri.path), "/.ssh") or ends_with(lower(raw.http.request.uri.path), "/id_rsa") or ends_with(lower(raw.http.request.uri.path), "/credentials"))'
          patch_rule 'LISTIA P3 2/5 - Unused technology probes' '(starts_with(lower(http.request.uri.path), "/server-status") or starts_with(lower(http.request.uri.path), "/actuator") or starts_with(lower(http.request.uri.path), "/solr/") or starts_with(lower(http.request.uri.path), "/jenkins/") or lower(http.request.uri.path) contains "/manager/html")'
          patch_rule 'LISTIA P3 3/5 - Unsafe HTTP methods' ''
          patch_rule 'LISTIA P3 4/5 - Traversal and system file probes' '(lower(raw.http.request.uri.path) contains "%00" or lower(raw.http.request.uri.path) contains "%5c.." or lower(raw.http.request.uri.path) contains "..%5c")'
          patch_rule 'LISTIA P3 5/5 - Offensive scanner user agents' '(lower(http.user_agent) contains "zgrab" or lower(http.user_agent) contains "gobuster" or lower(http.user_agent) contains "dirbuster" or lower(http.user_agent) contains "feroxbuster" or lower(http.user_agent) contains "ffuf" or lower(http.user_agent) contains "dirsearch" or lower(http.user_agent) contains "whatweb" or (not cf.client.bot and (http.request.uri.path eq "/api/marketplace/feed" or http.request.uri.path eq "/marketplace/api/feed") and (lower(http.user_agent) contains "scrapy" or lower(http.user_agent) contains "python-requests" or lower(http.user_agent) contains "aiohttp" or lower(http.user_agent) contains "python-httpx" or lower(http.user_agent) contains "go-http-client" or lower(http.user_agent) contains "libwww-perl" or lower(http.user_agent) contains "wget" or lower(http.user_agent) contains "curl/")))'

          echo '### LISTIA Anti-Piracy WAF' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing custom WAF slots preserved: 5/5' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reconnaissance signatures expanded' >> "$GITHUB_STEP_SUMMARY"
          echo '- Marketplace API scraper fingerprints expanded without blocking verified search crawlers' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WAF blocks and normal traffic
        shell: bash
        run: |
          set -Eeuo pipefail
          normal=$(curl -sS -L -o /tmp/normal -w '%{http_code}' https://app.listiaapp.com/)
          [[ "$normal" == 200 ]] || exit 10
          for spec in \
            'https://app.listiaapp.com/.aws/credentials|curl/8' \
            'https://listiaapp.com/server-status|curl/8' \
            'https://listiaapp.com/|ffuf/2.1' \
            'https://listiaapp.com/marketplace/api/feed|python-requests/2.32'; do
            url=${spec%%|*}; ua=${spec##*|}
            code=$(curl -sS -A "$ua" -o /tmp/probe -w '%{http_code}' "$url" || true)
            [[ "$code" == 403 ]] || { echo "WAF did not block $url with $ua: $code"; exit 11; }
          done
          for url in 'https://listiaapp.com/' 'https://listiaapp.com/marketplace' 'https://app.listiaapp.com/'; do
            code=$(curl -sS -L -o /tmp/normal -w '%{http_code}' "$url")
            [[ "$code" == 200 ]] || exit 12
          done
          echo '- WAF hostile probe smoke: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Normal browser-facing traffic smoke: passed' >> "$GITHUB_STEP_SUMMARY"
