name: LISTIA Normalize Build Info

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-normalize-build-info.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-normalize-build-info
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize verified release identity only
        env:
          OBSERVED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('BUILD_INFO.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          observed=os.environ['OBSERVED_COMMIT']
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          production_source='901fbc5976906a2badc451283f5f3bb4060f564b'
          production_verified='2026-08-29T13:05:16Z'
          deployment_proof='36126c4a6e8a1e81476a48b51225f537396c750a'
          migration='20260829131750_enable_property_ai_dispatch_cron'
          migration_source='c1cf480ee18fa053d8293d4bf59e461fa17ee32d'

          data['version']='0.27.2'
          data['as_of']='2026-08-29'
          data['head_commit_verified']=observed
          data['status']='production_active_v0_27_2_pwa_cloudco_nvidia_property_ai'

          sot=data.setdefault('source_of_truth',{})
          sot['main_observed_commit']=observed
          sot['main_observed_at_utc']=now
          sot['production_source_commit']=production_source
          sot['production_verified_at_utc']=production_verified
          sot['deployment_proof_commit']=deployment_proof
          sot['deployment_proof_file']='PWA_LIVE_DEPLOYMENT_PROOF.txt'
          sot['backend_last_verified_migration']=migration
          sot['backend_migration_source_commit']=migration_source

          prod=data.setdefault('production',{})
          pwa=prod.setdefault('pwa',{})
          pwa['active']=True
          pwa['bootstrap_version']='0.27.2'
          pwa['source_commit']=production_source
          pwa['source_worker']='listia-app'

          props=prod.setdefault('properties',{})
          props['ai_processing_pipeline']=True
          props['ai_provider']='nvidia'
          props['ai_model']='nvidia/nemotron-3.5-lightning-30b-a3b'
          props['ai_transport']='cloudco_gateway'
          props['ai_runtime_health']='healthy'
          props['property_ai_worker_version']=3
          props['property_ai_dispatch_cron']=True
          props['property_ai_dispatch_schedule']='* * * * *'
          props['property_ai_dispatch_batch_max']=3
          props['property_ai_empty_queue_short_circuit']=True
          props['property_ai_controlled_e2e_verified']=True

          supa=data.setdefault('supabase',{})
          supa['last_verified_migration']=migration
          supa['property_ai_runtime']='nvidia:cloudco'
          supa['property_ai_gateway_server_side_only']=True
          supa['property_ai_dispatch_cron']=True

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate normalized build info
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          d=json.load(open('BUILD_INFO.json',encoding='utf-8'))
          assert d['version']=='0.27.2'
          assert d['production']['pwa']['bootstrap_version']=='0.27.2'
          assert d['production']['pwa']['source_commit']=='901fbc5976906a2badc451283f5f3bb4060f564b'
          assert d['production']['properties']['ai_transport']=='cloudco_gateway'
          assert d['production']['properties']['property_ai_worker_version']==3
          assert d['supabase']['last_verified_migration']=='20260829131750_enable_property_ai_dispatch_cron'
          print('BUILD_INFO normalization OK')
          PY

      - name: Commit normalized build info
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add BUILD_INFO.json
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize LISTIA v0.27.2 production source of truth'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
