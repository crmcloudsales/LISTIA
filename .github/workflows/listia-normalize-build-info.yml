name: LISTIA Normalize Build Info

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-normalize-build-info.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-normalize-build-info
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize verified release identity only
        env:
          OBSERVED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('BUILD_INFO.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          observed=os.environ['OBSERVED_COMMIT']
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          production_source='6ccbd99fdd3ca59cfc34831d77e0e7106456a151'
          production_verified='2026-08-29T14:48:46Z'
          deployment_proof='09acdcbb42c97788f813c7d2f6c72f6b62209fcb'
          migration='20260829140851_add_google_oauth_capability_state'
          migration_source='60b910b3289dd7e03b5cf541341cf081a0548213'

          data['version']='0.27.2'
          data['as_of']='2026-08-29'
          data['head_commit_verified']=observed
          data['status']='production_active_v0_27_2_pwa_cloudco_nvidia_conversion_runtime'

          sot=data.setdefault('source_of_truth',{})
          sot['main_observed_commit']=observed
          sot['main_observed_at_utc']=now
          sot['production_source_commit']=production_source
          sot['production_verified_at_utc']=production_verified
          sot['deployment_proof_commit']=deployment_proof
          sot['deployment_proof_file']='PWA_LIVE_DEPLOYMENT_PROOF.txt'
          sot['backend_last_verified_migration']=migration
          sot['backend_migration_source_commit']=migration_source

          prod=data.setdefault('production',{})
          pwa=prod.setdefault('pwa',{})
          pwa['active']=True
          pwa['bootstrap_version']='0.27.2'
          pwa['source_commit']=production_source
          pwa['source_worker']='listia-app'

          props=prod.setdefault('properties',{})
          props['ai_processing_pipeline']=True
          props['ai_provider']='nvidia'
          props['ai_model']='nvidia/nemotron-3.5-lightning-30b-a3b'
          props['ai_transport']='cloudco_gateway'
          props['ai_runtime_health']='healthy'
          props['property_ai_worker_version']=3
          props['property_ai_dispatch_cron']=True
          props['property_ai_dispatch_schedule']='* * * * *'
          props['property_ai_dispatch_batch_max']=3
          props['property_ai_empty_queue_short_circuit']=True
          props['property_ai_controlled_e2e_verified']=True

          attr=prod.setdefault('attribution',{})
          attr['conversion_signal_queue']=True
          attr['real_ad_platform_dispatch_runtime']=True
          attr['real_ad_platform_delivery_verified']=False
          attr['conversion_dispatch_worker_version']=2
          attr['conversion_dispatch_cron']=True
          attr['conversion_dispatch_schedule']='* * * * *'
          attr['conversion_dispatch_batch_max']=25
          attr['conversion_dispatch_empty_queue_short_circuit']=True
          attr['conversion_dispatch_server_side_tokens']=True
          attr['conversion_dispatch_consent_gate']=True
          attr['conversion_dispatch_lead_quality_gate']=True
          attr['conversion_dispatch_fail_closed_without_connection']=True
          attr['conversion_dispatch_per_platform_delivery_state']=True
          attr['conversion_dispatch_retry_backoff']=True
          attr['meta_capi_adapter']=True
          attr['meta_capi_config_endpoint']=True
          attr['meta_capi_config_function_version']=2
          attr['meta_capi_setup_ui']=True
          attr['meta_capi_connection_verified']=False
          attr['meta_capi_delivery_verified']=False
          attr['google_data_manager_api_adapter']=True
          attr['google_ads_incremental_oauth']=True
          attr['google_ads_config_endpoint']=True
          attr['google_ads_setup_ui']=True
          attr['google_ads_real_delivery_verified']=False
          attr['tiktok_events_api_adapter']=True
          attr['linkedin_conversions_api_adapter']=True

          supa=data.setdefault('supabase',{})
          supa['last_verified_migration']=migration
          supa['property_ai_runtime']='nvidia:cloudco'
          supa['property_ai_gateway_server_side_only']=True
          supa['property_ai_dispatch_cron']=True
          supa['conversion_dispatch_worker_version']=2
          supa['conversion_dispatch_cron']=True
          supa['conversion_dispatch_private_delivery_state']=True
          supa['google_oauth_incremental_capabilities']=True
          supa['meta_capi_config_function']=True
          supa['meta_capi_config_function_version']=2

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate normalized build info
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          d=json.load(open('BUILD_INFO.json',encoding='utf-8'))
          assert d['version']=='0.27.2'
          assert d['production']['pwa']['bootstrap_version']=='0.27.2'
          assert d['production']['pwa']['source_commit']=='6ccbd99fdd3ca59cfc34831d77e0e7106456a151'
          assert d['production']['properties']['ai_transport']=='cloudco_gateway'
          assert d['production']['properties']['property_ai_worker_version']==3
          assert d['production']['attribution']['conversion_dispatch_worker_version']==2
          assert d['production']['attribution']['real_ad_platform_dispatch_runtime'] is True
          assert d['production']['attribution']['real_ad_platform_delivery_verified'] is False
          assert d['production']['attribution']['conversion_dispatch_consent_gate'] is True
          assert d['production']['attribution']['conversion_dispatch_lead_quality_gate'] is True
          assert d['production']['attribution']['google_ads_incremental_oauth'] is True
          assert d['production']['attribution']['google_ads_setup_ui'] is True
          assert d['production']['attribution']['meta_capi_config_endpoint'] is True
          assert d['production']['attribution']['meta_capi_setup_ui'] is True
          assert d['production']['attribution']['meta_capi_config_function_version']==2
          assert d['production']['attribution']['meta_capi_connection_verified'] is False
          assert d['supabase']['last_verified_migration']=='20260829140851_add_google_oauth_capability_state'
          print('BUILD_INFO normalization OK')
          PY

      - name: Commit normalized build info
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add BUILD_INFO.json
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize LISTIA v0.27.2 production source of truth'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
