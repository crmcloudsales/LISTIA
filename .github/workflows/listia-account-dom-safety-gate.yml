name: LISTIA Account DOM Safety Gate

on:
  pull_request:
    paths:
      - 'public/account-center.js'
      - 'public/account-resilience.js'
      - 'scripts/audit-listia-account-dom-safety.py'
      - '.github/workflows/listia-account-dom-safety-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'public/account-center.js'
      - 'public/account-resilience.js'
      - 'scripts/audit-listia-account-dom-safety.py'
      - '.github/workflows/listia-account-dom-safety-gate.yml'

permissions:
  contents: read

jobs:
  account-dom-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check public/account-center.js
          node --check public/account-resilience.js

      - name: Enforce safe account rendering
        run: python3 scripts/audit-listia-account-dom-safety.py
