name: LISTIA Marketplace Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-bootstrap.js'
      - 'public/sw.js'
      - 'listia-app-worker/index.js'
      - '.github/workflows/listia-marketplace-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/listia-browser-smoke && cd /tmp/listia-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify live mobile Marketplace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/listia-browser-smoke
          cat > smoke.js <<'NODE'
          const { chromium, devices } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({...devices['Pixel 7'],locale:'es-MX'});
            const page=await context.newPage();
            const feed=[]; const qroo=[]; const errors=[];
            page.on('response',async r=>{
              if(r.url().includes('/api/marketplace/feed')){
                let j=null; try{j=await r.json()}catch{}
                feed.push({status:r.status(),length:Array.isArray(j)?j.length:0,total:Array.isArray(j)&&j[0]?Number(j[0].total_count||0):0});
              }
              if(r.url().includes('/api/marketplace/qroo')) qroo.push({status:r.status(),url:r.url()});
            });
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});

            await page.goto('https://app.listiaapp.com/marketplace?browser_smoke=final',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(15000);

            const list=await page.evaluate(()=>({
              cards:document.querySelectorAll('#marketplaceGrid .marketplace-card').length,
              published:Array.isArray(window.LISTIA_MARKETPLACE_DATA)?window.LISTIA_MARKETPLACE_DATA.length:0,
              count:Number(document.getElementById('marketplaceCount')?.textContent||0),
              nearActive:window.LISTIA_MARKETPLACE_NEAR_ACTIVE===true,
              gateway:window.LISTIA_MARKETPLACE_GATEWAY?.version||null,
              scrollH:document.documentElement.scrollHeight,
              viewportH:innerHeight,
              tabs:document.querySelectorAll('.marketplace-pro-tabs').length
            }));

            const mapBtn=page.locator('.marketplace-pro-tabs button').filter({hasText:/^Mapa$/i}).first();
            if(await mapBtn.count())await mapBtn.click();
            await page.waitForTimeout(5000);

            const map=await page.evaluate(()=>({
              mount:!!document.getElementById('qrooMarketplaceMapMount'),
              dots:document.querySelectorAll('#qrooMarketplaceMapMount .qroo-map-dot').length,
              places:document.querySelectorAll('#qrooMarketplaceMapMount .qroo-place').length,
              unavailable:/mapa no disponible|no disponible/i.test(document.getElementById('qrooMarketplaceMapMount')?.innerText||''),
              scrollH:document.documentElement.scrollHeight,
              viewportH:innerHeight
            }));

            console.log('LIST='+JSON.stringify(list));
            console.log('MAP='+JSON.stringify(map));
            console.log('FEED='+JSON.stringify(feed.slice(0,5)));
            console.log('QROO='+JSON.stringify(qroo));
            console.log('ERRORS='+JSON.stringify(errors.slice(0,20)));

            if(!feed.some(x=>x.status===200&&x.length>0&&x.total>0))throw new Error('feed_inventory_missing');
            if(list.cards<1||list.published<1||list.count<1)throw new Error('list_not_rendered');
            if(list.nearActive)throw new Error('near_me_activated_without_user_action');
            if(list.scrollH>list.viewportH+120)throw new Error('list_exceeds_mobile_viewport');
            if(list.tabs!==1)throw new Error('marketplace_tab_bar_duplicate');
            if(!map.mount||map.unavailable)throw new Error('map_unavailable');
            if(map.dots<1||map.places<1)throw new Error('map_points_missing');
            if(map.scrollH>map.viewportH+120)throw new Error('map_exceeds_mobile_viewport');
            if(!qroo.some(x=>x.status===200&&x.url.includes('mode=clusters')))throw new Error('clusters_not_200');
            if(!qroo.some(x=>x.status===200&&x.url.includes('mode=microzones')))throw new Error('microzones_not_200');
            if(errors.some(x=>/\bCORS\b|map_502|feed_502|edge_firewall_required/i.test(x)))throw new Error('marketplace_runtime_error');

            console.log(`LISTIA_BROWSER_SMOKE_OK cards=${list.cards} total=${list.count} dots=${map.dots} gateway=${list.gateway}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.js
