name: LISTIA Marketplace Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/marketplace*.js'
      - 'public/marketplace*.css'
      - 'public/listia-bootstrap.js'
      - 'public/sw.js'
      - 'listia-app-worker/index.js'
      - '.github/workflows/listia-marketplace-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose QROO edge upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://zvzafiarwerbuoaccnoz.supabase.co/functions/v1/marketplace-map-qroo?mode=clusters&limit=3'
          code=$(curl -sS -D /tmp/qroo-direct.headers -o /tmp/qroo-direct.body -w '%{http_code}' "$url" || true)
          echo "QROO_DIRECT_STATUS=$code"
          echo 'QROO_DIRECT_HEADERS:'
          cat /tmp/qroo-direct.headers || true
          echo 'QROO_DIRECT_BODY:'
          head -c 3000 /tmp/qroo-direct.body || true
          echo

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/listia-browser-smoke && cd /tmp/listia-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Diagnose live mobile Marketplace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/listia-browser-smoke
          cat > smoke.js <<'NODE'
          const { chromium, devices } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({...devices['Pixel 7'],locale:'es-MX'});
            const page=await context.newPage();
            const feed=[]; const feedRequests=[]; const errors=[]; const qroo=[]; const qrooRequests=[];
            page.on('request',r=>{
              if(r.url().includes('/api/marketplace/feed')) feedRequests.push({url:r.url(),method:r.method(),postData:r.postData()});
              if(r.url().includes('/api/marketplace/qroo')) qrooRequests.push({url:r.url(),method:r.method(),postData:r.postData()});
            });
            page.on('response',async r=>{
              if(r.url().includes('/api/marketplace/feed')){
                let body=null;try{body=await r.json()}catch{}
                feed.push({status:r.status(),length:Array.isArray(body)?body.length:null,total:Array.isArray(body)&&body[0]?Number(body[0].total_count||0):0});
              }
              if(r.url().includes('/api/marketplace/qroo')){
                let body='';try{body=(await r.text()).slice(0,1000)}catch{}
                qroo.push({status:r.status(),url:r.url(),body});
              }
            });
            page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')errors.push('console-'+m.type()+':'+m.text())});
            await page.goto('https://app.listiaapp.com/marketplace?browser_smoke=diagnostic',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(15000);
            const state=await page.evaluate(()=>({
              filters:Object.fromEntries(['marketplaceSearch','marketplaceOperation','marketplaceType','marketplaceBedrooms','marketplaceMin','marketplaceMax'].map(id=>[id,document.getElementById(id)?.value??null])),
              nearActive:window.LISTIA_MARKETPLACE_NEAR_ACTIVE===true,
              geoGet:window.LISTIA_MARKETPLACE_GEOLOCATION?.get?.()||null,
              geoGlobal:window.LISTIA_MARKETPLACE_GEO||null,
              gateway:window.LISTIA_MARKETPLACE_GATEWAY?.version||null,
              cards:document.querySelectorAll('#marketplaceGrid .marketplace-card,.marketplace-card').length,
              published:Array.isArray(window.LISTIA_MARKETPLACE_DATA)?window.LISTIA_MARKETPLACE_DATA.length:0,
              countText:(document.querySelector('#marketplaceCount')?.textContent||document.querySelector('.marketplace-count')?.textContent||'').trim(),
              scrollH:document.documentElement.scrollHeight,
              viewportH:innerHeight
            }));
            const direct=await page.evaluate(async()=>{
              const r=await fetch('/api/marketplace/feed',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({p_limit:3,p_offset:0}),cache:'no-store'});
              let j=null;try{j=await r.json()}catch{}
              return {status:r.status,length:Array.isArray(j)?j.length:null,total:Array.isArray(j)&&j[0]?Number(j[0].total_count||0):0,first:Array.isArray(j)&&j[0]?{id:j[0].id,title:j[0].title}:null};
            });
            console.log('STATE='+JSON.stringify(state));
            console.log('FEED_REQUESTS='+JSON.stringify(feedRequests));
            console.log('FEED_RESPONSES='+JSON.stringify(feed));
            console.log('DIRECT_CONTROL='+JSON.stringify(direct));
            console.log('ERRORS_BEFORE_MAP='+JSON.stringify(errors.slice(0,30)));

            const mapBtn=page.locator('.marketplace-pro-tabs button').filter({hasText:/^Mapa$/i}).first();
            if(await mapBtn.count())await mapBtn.click();
            await page.waitForTimeout(10000);
            const map=await page.evaluate(()=>({
              markers:document.querySelectorAll('#qrooMarketplaceMapMount .marker,.marketplace-v8-marker,.leaflet-marker-icon,.qroo-map-marker').length,
              unavailable:/mapa no disponible|no disponible/i.test(document.querySelector('#qrooMarketplaceMapMount')?.innerText||''),
              mountVisible:!!document.querySelector('#qrooMarketplaceMapMount'),
              scrollH:document.documentElement.scrollHeight,
              viewportH:innerHeight
            }));
            console.log('MAP_STATE='+JSON.stringify(map));
            console.log('QROO_REQUESTS='+JSON.stringify(qrooRequests));
            console.log('QROO_RESPONSES='+JSON.stringify(qroo));
            console.log('ERRORS_FINAL='+JSON.stringify(errors.slice(0,40)));
            await browser.close();
            if(!direct||direct.status!==200||direct.length<1||direct.total<1)throw new Error('Direct clean feed unhealthy');
            if(!feed.some(x=>x.status===200&&x.length>0&&x.total>0))throw new Error('Automatic Marketplace feed did not return inventory');
            if(state.cards<1||state.published<1)throw new Error(`Marketplace list rendered no properties cards=${state.cards} data=${state.published}`);
            if(!map.mountVisible||map.unavailable)throw new Error('Marketplace map is unavailable');
            if(!qroo.some(x=>x.status===200))throw new Error('QROO same-origin map endpoint did not return 200');
            if(map.markers<1)throw new Error('Marketplace map rendered zero property markers');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.js
