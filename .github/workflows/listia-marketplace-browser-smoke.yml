name: LISTIA Marketplace Browser Smoke

on:
  workflow_run:
    workflows:
      - 'Deploy LISTIA App to Cloudflare Workers'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listia-marketplace-browser-smoke
  cancel-in-progress: true

jobs:
  mobile-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/listia-browser-smoke && cd /tmp/listia-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify live mobile Marketplace visually and functionally
        run: |
          set -Eeuo pipefail
          cd /tmp/listia-browser-smoke
          cat > smoke.js <<'NODE'
          const { chromium, devices } = require('playwright');
          const crypto=require('crypto');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({...devices['Pixel 7'],locale:'es-MX'});
            const page=await context.newPage();
            const feed=[]; const qroo=[]; const errors=[]; const rateLimited=[];
            page.on('response',async r=>{
              if(r.status()===429)rateLimited.push(r.url());
              if(r.url().includes('/api/marketplace/feed')){
                let j=null; try{j=await r.json()}catch{}
                feed.push({status:r.status(),length:Array.isArray(j)?j.length:0,total:Array.isArray(j)&&j[0]?Number(j[0].total_count||0):0});
              }
              if(r.url().includes('/api/marketplace/qroo')) qroo.push({status:r.status(),url:r.url()});
            });
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('https://app.listiaapp.com/marketplace?browser_smoke=visual-v3',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#marketplaceGrid .marketplace-card',{state:'attached',timeout:45000});
            await page.waitForTimeout(3500);

            const list=await page.evaluate(()=>{
              const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{x:r.x,y:r.y,w:r.width,h:r.height,top:r.top,bottom:r.bottom,left:r.left,right:r.right,display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1)}};
              const intersects=(a,b)=>a&&b&&Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
              const screen=document.getElementById('screen-marketplace');
              const card=document.querySelector('#marketplaceGrid .marketplace-card');
              const cardRect=rect(card);
              const input=document.getElementById('marketplaceSearch');
              const search=document.getElementById('marketplaceV8SearchButton');
              const inputRect=rect(input),searchRect=rect(search);
              const back=[...document.querySelectorAll('#screen-marketplace button')].find(b=>['←','‹','⟵'].includes((b.textContent||'').trim())||/back|volver|regresar/i.test(b.getAttribute('aria-label')||''));
              const backRect=rect(back);
              const filters=document.querySelector('#screen-marketplace .marketplace-filters');
              const properties=[...document.querySelectorAll('.marketplace-pro-tabs button')].find(b=>/^(Propiedades|Properties)$/i.test((b.textContent||'').trim()));
              const active=[...document.querySelectorAll('.marketplace-pro-tabs button.active')].map(b=>(b.textContent||'').trim());
              const img=card?.querySelector('img');
              const x=cardRect?Math.min(innerWidth-2,Math.max(1,cardRect.left+cardRect.w/2)):1;
              const y=cardRect?Math.min(innerHeight-2,Math.max(1,cardRect.top+Math.min(cardRect.h,120)/2)):1;
              const center=cardRect?document.elementFromPoint(x,y):null;
              return {
                cards:document.querySelectorAll('#marketplaceGrid .marketplace-card').length,
                published:Array.isArray(window.LISTIA_MARKETPLACE_DATA)?window.LISTIA_MARKETPLACE_DATA.length:0,
                count:Number(document.getElementById('marketplaceCount')?.textContent||0),
                gateway:window.LISTIA_MARKETPLACE_GATEWAY?.version||null,
                screenClass:screen?.className||'', activeTabs:active,
                propertiesActive:!!properties?.classList.contains('active'),
                cardRect, cardCenterBelongs:!!(card&&center&&(card===center||card.contains(center))),
                coveringElement:center?{tag:center.tagName,id:center.id||'',className:String(center.className||''),text:(center.textContent||'').trim().slice(0,80)}:null,
                imageLoaded:!img||img.naturalWidth>0,
                inputRect,searchRect,backRect,
                searchBackOverlap:intersects(searchRect,backRect), inputSearchOverlap:intersects(inputRect,searchRect),
                filtersDisplay:filters?getComputedStyle(filters).display:'missing',
                nearActive:window.LISTIA_MARKETPLACE_NEAR_ACTIVE===true,
                bodyWidth:document.body.scrollWidth,viewportWidth:innerWidth,viewportH:innerHeight,
                tabs:document.querySelectorAll('.marketplace-pro-tabs').length
              };
            });
            const listShot=await page.screenshot({path:'/tmp/listia-browser-smoke/marketplace-list-mobile.png',fullPage:true});
            console.log('LIST='+JSON.stringify(list)); console.log('FEED='+JSON.stringify(feed.slice(0,5)));
            if(!feed.some(x=>x.status===200&&x.length>0&&x.total>0))throw new Error('feed_inventory_missing');
            if(list.cards<1||list.published<1||list.count<1)throw new Error('list_not_rendered');
            if(!list.propertiesActive||!/marketplace-pro-list/.test(list.screenClass))throw new Error('mobile_did_not_open_properties');
            if(!list.cardRect||list.cardRect.w<180||list.cardRect.h<180||list.cardRect.bottom<0||list.cardRect.top>list.viewportH)throw new Error('first_card_not_visibly_sized');
            if(!list.cardCenterBelongs)throw new Error('first_card_is_covered_by_overlay');
            if(!list.imageLoaded)throw new Error('first_card_image_not_loaded');
            if(list.filtersDisplay!=='none')throw new Error('desktop_filters_visible_on_mobile');
            if(!list.inputRect||!list.searchRect||list.inputRect.w<120||list.searchRect.w<72)throw new Error('mobile_search_controls_not_sized');
            if(list.inputSearchOverlap>2)throw new Error('search_input_button_overlap');
            if(list.searchBackOverlap>2)throw new Error('search_button_back_overlap');
            if(list.nearActive)throw new Error('near_me_activated_without_user_action');
            if(list.tabs!==1)throw new Error('marketplace_tab_bar_duplicate');
            if(list.bodyWidth>list.viewportWidth+2)throw new Error('list_horizontal_overflow');

            const mapBtn=page.locator('.marketplace-pro-tabs button').filter({hasText:/^(Mapa|Map)$/i}).first();
            if(!await mapBtn.count())throw new Error('map_tab_missing');
            await mapBtn.click();
            await page.waitForFunction(()=>document.getElementById('screen-marketplace')?.classList.contains('marketplace-pro-map'),null,{timeout:10000});
            await page.waitForTimeout(1800);
            const map=await page.evaluate(()=>{
              const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{x:r.x,y:r.y,w:r.width,h:r.height,top:r.top,bottom:r.bottom,left:r.left,right:r.right,display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1)}};
              const stage=document.querySelector('#qrooMarketplaceMapMount .qroo-map-stage');
              const svg=document.querySelector('#qrooMarketplaceMapMount .qroo-map-svg');
              const dots=[...document.querySelectorAll('#qrooMarketplaceMapMount .qroo-map-dot')];
              const places=[...document.querySelectorAll('#qrooMarketplaceMapMount .qroo-place')];
              const visibleDots=dots.filter(d=>{const r=d.getBoundingClientRect(),s=getComputedStyle(d);return r.width>2&&r.height>2&&s.visibility!=='hidden'&&s.display!=='none'}).length;
              const root=document.getElementById('qrooMarketplaceMapMount');
              return {mount:!!root,rootRect:rect(root),stageRect:rect(stage),svgRect:rect(svg),dots:dots.length,visibleDots,places:places.length,unavailable:/mapa no disponible|no disponible/i.test(root?.innerText||''),bodyWidth:document.body.scrollWidth,viewportWidth:innerWidth,viewportH:innerHeight,screenClass:document.getElementById('screen-marketplace')?.className||''};
            });
            const mapShot=await page.screenshot({path:'/tmp/listia-browser-smoke/marketplace-map-mobile.png',fullPage:true});
            const listHash=crypto.createHash('sha256').update(listShot).digest('hex');
            const mapHash=crypto.createHash('sha256').update(mapShot).digest('hex');
            const sameOrigin429=rateLimited.filter(u=>{try{return new URL(u).origin==='https://app.listiaapp.com'}catch{return false}});
            console.log('MAP='+JSON.stringify(map)); console.log('QROO='+JSON.stringify(qroo)); console.log('ERRORS='+JSON.stringify(errors.slice(0,20))); console.log(`SHOTS=${listHash} ${mapHash}`);
            if(!map.mount||map.unavailable||!/marketplace-pro-map/.test(map.screenClass))throw new Error('map_unavailable');
            if(!map.stageRect||map.stageRect.w<240||map.stageRect.h<180||map.stageRect.bottom<0||map.stageRect.top>map.viewportH)throw new Error('map_stage_not_visible');
            if(!map.svgRect||map.svgRect.w<240||map.svgRect.h<180)throw new Error('map_svg_not_visible');
            if(map.dots<1||map.visibleDots<1||map.places<1)throw new Error('map_points_not_visibly_rendered');
            if(map.bodyWidth>map.viewportWidth+2)throw new Error('map_horizontal_overflow');
            if(listHash===mapHash)throw new Error('list_and_map_screenshots_identical');
            if(!qroo.some(x=>x.status===200&&x.url.includes('mode=clusters')))throw new Error('clusters_not_200');
            if(!qroo.some(x=>x.status===200&&x.url.includes('mode=microzones')))throw new Error('microzones_not_200');
            if(sameOrigin429.some(u=>u.includes('/api/marketplace/')))throw new Error('marketplace_api_rate_limited');
            if(errors.some(x=>/\bCORS\b|map_502|feed_502|edge_firewall_required/i.test(x)))throw new Error('marketplace_runtime_error');
            console.log(`LISTIA_BROWSER_SMOKE_VISUAL_OK cards=${list.cards} total=${list.count} visibleDots=${map.visibleDots} gateway=${list.gateway}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.js

      - name: Upload Marketplace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listia-marketplace-mobile-evidence
          path: /tmp/listia-browser-smoke/marketplace-*-mobile.png
          if-no-files-found: warn
          retention-days: 7
