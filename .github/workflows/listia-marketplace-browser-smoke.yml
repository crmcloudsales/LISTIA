name: LISTIA Marketplace Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-marketplace-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/listia-browser-smoke && cd /tmp/listia-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Capture Marketplace automatic request payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/listia-browser-smoke
          cat > smoke.js <<'NODE'
          const { chromium, devices } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({...devices['Pixel 7'],locale:'es-MX'});
            const page=await context.newPage();
            const reqs=[]; const resps=[]; const errors=[];
            page.on('request',r=>{if(r.url().includes('/api/marketplace/feed'))reqs.push({url:r.url(),method:r.method(),postData:r.postData()})});
            page.on('response',async r=>{if(!r.url().includes('/api/marketplace/feed'))return;let body=null;try{body=await r.json()}catch{}resps.push({status:r.status(),length:Array.isArray(body)?body.length:null,total:Array.isArray(body)&&body[0]?body[0].total_count:null})});
            page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')errors.push('console-'+m.type()+':'+m.text())});
            await page.goto('https://app.listiaapp.com/marketplace?browser_smoke=3',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(14000);
            const filters=await page.evaluate(()=>Object.fromEntries(['marketplaceSearch','marketplaceOperation','marketplaceType','marketplaceBedrooms','marketplaceMin','marketplaceMax'].map(id=>[id,document.getElementById(id)?.value??null])));
            console.log('FILTER_VALUES='+JSON.stringify(filters));
            console.log('AUTO_REQUESTS='+JSON.stringify(reqs));
            console.log('AUTO_RESPONSES='+JSON.stringify(resps));
            console.log('PAGE_ERRORS='+JSON.stringify(errors.slice(0,30)));
            const direct=await page.evaluate(async()=>{const r=await fetch('/api/marketplace/feed',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({p_limit:3,p_offset:0}),cache:'no-store'});const j=await r.json();return {status:r.status,length:Array.isArray(j)?j.length:null,total:Array.isArray(j)&&j[0]?j[0].total_count:null}});
            console.log('DIRECT='+JSON.stringify(direct));
            await browser.close();
            if(!direct||direct.status!==200||direct.length<1)throw new Error('Direct feed unhealthy');
            if(!reqs.length)throw new Error('No automatic Marketplace request captured');
            process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.js
