name: LISTIA Managed Site Pennyworth v1 Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-managed-site-pennyworth-v1-apply.yml'
      - 'scripts/apply_pennyworth_managed_sites.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-managed-site-pennyworth-v1-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply managed-site Pennyworth runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply_pennyworth_managed_sites.py
          node --check sites-worker/index.js
          grep -Fq 'MANAGED_SITE_EDGE_PROOF' sites-worker/index.js
          grep -Fq "'x-listia-edge-proof':env.MANAGED_SITE_EDGE_PROOF" sites-worker/index.js
          if grep -Fq "'x-listia-turnstile-secret'" sites-worker/index.js; then exit 31; fi
          grep -Fq 'form_elapsed_ms' sites-worker/index.js
          grep -Fq 'siteBrand(data)' sites-worker/index.js
          grep -Fq 'brandStyle(data)' sites-worker/index.js
          grep -Fq 'bot_score' sites-worker/index.js

      - name: Guard unrelated systems
        shell: bash
        run: |
          set -Eeuo pipefail
          changed=$(git diff --name-only)
          bad=$(printf '%s\n' "$changed" | grep -E '(^|/)(marketplace|data/qroo|scripts/crawl|supabase/.*marketplace)' || true)
          test -z "$bad"

      - name: Commit managed-site runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'LISTIA Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sites-worker/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce Pennyworth lead firewall on LISTIA managed sites'
          git pull --rebase origin main
          git push origin HEAD:main
