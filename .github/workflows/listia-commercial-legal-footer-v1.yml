name: LISTIA commercial legal footer v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-commercial-legal-footer-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add legal footer module to commercial site
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('commercial/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="/footer-legal.js?v=1" defer></script>'
          if tag in text:
              print('Legal footer module already installed.')
          else:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in commercial/index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')
              print('Installed legal footer module.')
          PY

      - name: Commit commercial footer patch
        run: |
          if git diff --quiet -- commercial/index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "LISTIA DevOps"
          git config user.email "actions@users.noreply.github.com"
          git add commercial/index.html
          git commit -m "Add multilingual legal links and CloudSales attribution"
          git push origin main
