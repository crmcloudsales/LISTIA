name: LISTIA PWA i18n Manifest Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/listia-pwa-i18n-manifest-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch language manifest switching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/i18n.js')
          s=p.read_text(encoding='utf-8')
          old="`/manifest-${locale.manifest}.webmanifest?v=0.9.5`"
          new="`/manifest-${locale.manifest}.webmanifest?v=16`"
          if old not in s: raise SystemExit('manifest language switch anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check public/i18n.js
          grep -Fq 'manifest-${locale.manifest}.webmanifest?v=16' public/i18n.js
          if grep -Fq 'manifest-${locale.manifest}.webmanifest?v=0.9.5' public/i18n.js; then exit 1; fi
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name LISTIA-PWA-i18n-Bot
          git config user.email actions@users.noreply.github.com
          git add public/i18n.js
          git commit -m 'fix pwa keep language manifests on canonical v16'
          git push origin HEAD:main
