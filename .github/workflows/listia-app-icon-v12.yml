name: LISTIA App Icon v15

on:
  push:
    branches: [main]
    paths:
      - 'public/listia-official-icon-v5.svg'
      - 'scripts/build-listia-icon-v12.py'
      - '.github/workflows/listia-app-icon-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-app-icon-v15
  cancel-in-progress: true

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate official LISTIA PWA launcher icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python scripts/build-listia-icon-v12.py
      - name: Verify full-bleed purple background and white centered house
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name,size in [('listia-app-icon-32.png',32),('listia-app-icon-180.png',180),('listia-app-icon-192.png',192),('listia-app-icon-512.png',512),('listia-app-icon-maskable-192.png',192),('listia-app-icon-maskable-512.png',512)]:
              im=Image.open(Path('public')/name).convert('RGBA')
              assert im.size==(size,size),(name,im.size)
              for xy in [(0,0),(size-1,0),(0,size-1),(size-1,size-1)]:
                  r,g,b,a=im.getpixel(xy)
                  assert a==255,(name,xy,'transparent outer tile')
                  assert not (r>245 and g>245 and b>245),(name,xy,'white outer tile')
              # Official house must remain visibly white in the center region.
              white=0
              for y in range(size//5,4*size//5):
                  for x in range(size//5,4*size//5):
                      r,g,b,a=im.getpixel((x,y))
                      white += int(a>245 and r>245 and g>245 and b>245)
              assert white > (size*size)*0.08,(name,'white house missing')
          print('LISTIA icon v15 verification passed')
          PY
          grep -Fq 'cache_version=v15' public/APP_ICON_VERSION.txt
          grep -Fq 'white_house=required' public/APP_ICON_VERSION.txt
          grep -Fq 'extra_wheel_or_pointer=forbidden' public/APP_ICON_VERSION.txt
          grep -Fq '?v=15' public/manifest.webmanifest
      - name: Commit generated icon release
        run: |
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public/listia-app-icon-32.png public/listia-app-icon-180.png public/listia-app-icon-192.png public/listia-app-icon-512.png public/listia-app-icon-maskable-192.png public/listia-app-icon-maskable-512.png public/manifest*.webmanifest public/index.html public/config.js public/sw.js public/APP_ICON_VERSION.txt
          git commit -m 'Release LISTIA application icon v15 without white launcher tile' || exit 0
          git push origin main
