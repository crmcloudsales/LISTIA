name: LISTIA App Icon v17

on:
  push:
    branches: [main]
    paths:
      - 'public/listia-app-icon-official.jpg'
      - 'scripts/build-listia-icon-v12.py'
      - '.github/workflows/listia-app-icon-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-app-icon-v17
  cancel-in-progress: true

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate LISTIA launcher icons from official master
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build-listia-icon-v12.py
      - name: Verify physical v17 icon release
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          pub=Path('public')
          expected=[('listia-app-icon-v17-32.png',32),('listia-app-icon-v17-180.png',180),('listia-app-icon-v17-192.png',192),('listia-app-icon-v17-512.png',512),('listia-app-icon-v17-maskable-192.png',192),('listia-app-icon-v17-maskable-512.png',512)]
          for name,size in expected:
              im=Image.open(pub/name).convert('RGB')
              assert im.size==(size,size),(name,im.size)
              for xy in ((0,0),(size-1,0),(0,size-1),(size-1,size-1)):
                  r,g,b=im.getpixel(xy)
                  assert not (r>235 and g>235 and b>235),(name,xy,'white outer launcher tile')
              white=0
              for y in range(size//5,4*size//5):
                  for x in range(size//5,4*size//5):
                      r,g,b=im.getpixel((x,y)); white+=int(r>240 and g>240 and b>240)
              assert white>(size*size)*0.08,(name,'white house missing')
          for manifest in pub.glob('manifest*.webmanifest'):
              refs=[str(i.get('src','')) for i in json.loads(manifest.read_text(encoding='utf-8')).get('icons',[])]
              assert refs and all('v17' in ref and '?v=' not in ref for ref in refs),(manifest,refs)
          config=(pub/'config.js').read_text(encoding='utf-8')
          assert "const v='17'" in config
          assert '/listia-app-icon-v17-180.png' in config
          sw=(pub/'sw.js').read_text(encoding='utf-8')
          assert '-icon-v17' in sw
          note=(pub/'APP_ICON_VERSION.txt').read_text(encoding='utf-8')
          assert 'redraw=none' in note and 'recolor=none' in note
          assert 'cache_strategy=physical-versioned-filenames' in note
          print('LISTIA icon v17 verification passed')
          PY
      - name: Commit generated icon release
        run: |
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add public/listia-app-icon-32.png public/listia-app-icon-180.png public/listia-app-icon-192.png public/listia-app-icon-512.png public/listia-app-icon-maskable-192.png public/listia-app-icon-maskable-512.png public/listia-app-icon-v17-32.png public/listia-app-icon-v17-180.png public/listia-app-icon-v17-192.png public/listia-app-icon-v17-512.png public/listia-app-icon-v17-maskable-192.png public/listia-app-icon-v17-maskable-512.png public/manifest*.webmanifest public/index.html public/config.js public/sw.js public/APP_ICON_VERSION.txt
          git commit -m 'fix: release LISTIA official app icon v17 with physical filenames' || exit 0
          git pull --rebase origin main
          git push origin main
