name: LISTIA PWA Release Lock

on:
  push:
    branches: [main]
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/index.html'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - '.github/workflows/listia-pwa-release-lock.yml'
  pull_request:
    paths:
      - 'public/config.js'
      - 'public/sw.js'
      - 'public/index.html'
      - 'public/manifest*.webmanifest'
      - 'public/APP_ICON_VERSION.txt'
      - '.github/workflows/listia-pwa-release-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify PWA release and cache identity
        run: |
          set -Eeuo pipefail
          node --check public/config.js
          node --check public/sw.js
          node <<'NODE'
          const fs=require('fs');
          const config=fs.readFileSync('public/config.js','utf8');
          const sw=fs.readFileSync('public/sw.js','utf8');
          const app=config.match(/BOOTSTRAP_VERSION:"([^"]+)"/);
          const cache=sw.match(/const CACHE="listia-pwa-v(\d+\.\d+\.\d+)(?:-[^"]+)?"/);
          if(!app||!cache) throw new Error(`Missing release metadata app=${app?.[1]} cache=${cache?.[1]}`);
          if(app[1]!==cache[1]) throw new Error(`PWA release mismatch: BOOTSTRAP_VERSION=${app[1]} service-worker-release=${cache[1]}`);
          if(!sw.includes('marketplace-v14')) throw new Error('Expected Marketplace runtime cache generation v14');
          console.log(`PWA release lock OK: release=${app[1]} cache-generation=marketplace-v14`);
          NODE

      - name: Verify approved LISTIA launcher icon v17 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          pub=Path('public')
          note=(pub/'APP_ICON_VERSION.txt').read_text(encoding='utf-8')
          required_note=(
              'version=17','icon_version=17','release=0.28.0','pwa_release=0.28.0',
              'artwork=user-approved official master; house, lighting, volume and gradient preserved',
              'redraw=none','recolor=none','cache_strategy=physical-versioned-filenames','cache_version=v17'
          )
          missing=[x for x in required_note if x not in note]
          if missing: raise SystemExit('ICON_V17_NOTE_DRIFT=' + ','.join(missing))

          manifests=list(pub.glob('manifest*.webmanifest'))
          if not manifests: raise SystemExit('NO_PWA_MANIFESTS')
          for manifest in manifests:
              data=json.loads(manifest.read_text(encoding='utf-8'))
              refs=[str(i.get('src','')) for i in data.get('icons',[])]
              if not refs or not all('listia-app-icon-v17-' in ref and '?v=' not in ref for ref in refs):
                  raise SystemExit(f'ICON_MANIFEST_DRIFT={manifest.name}:{refs}')

          index=(pub/'index.html').read_text(encoding='utf-8')
          config=(pub/'config.js').read_text(encoding='utf-8')
          sw=(pub/'sw.js').read_text(encoding='utf-8')
          if "const v='17'" not in config: raise SystemExit('CONFIG_ICON_VERSION_NOT_V17')
          for ref in ('/listia-app-icon-v17-32.png','/listia-app-icon-v17-180.png'):
              if ref not in index and ref not in config:
                  raise SystemExit(f'ACTIVE_ICON_REF_MISSING={ref}')
          if '-icon-v17' not in sw: raise SystemExit('SW_ICON_CACHE_NOT_V17')
          active='\n'.join([index,config,sw]+[p.read_text(encoding='utf-8') for p in manifests])
          stale=sorted(set(re.findall(r'listia-app-icon-v(?:15|16)-[^"\'\s)>,]+',active)))
          if stale: raise SystemExit('STALE_ACTIVE_ICON_REFS=' + ','.join(stale))
          print(f'LISTIA launcher icon v17 lock OK across {len(manifests)} manifests')
          PY
