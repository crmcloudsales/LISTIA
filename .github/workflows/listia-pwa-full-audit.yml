name: LISTIA PWA Full Audit

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'listia-app-worker/**'
      - 'scripts/audit-public-runtime.py'
      - '.github/workflows/listia-pwa-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Audit HTML structure and local assets
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import collections
          root=Path('public'); html=(root/'index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.refs=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  for key in ('src','href'):
                      v=a.get(key)
                      if v and v.startswith('/') and not v.startswith('//'): self.refs.append(v)
                  if tag=='script' and a.get('src'): self.scripts.append(a['src'])
          p=P(); p.feed(html)
          dup=[k for k,v in collections.Counter(p.ids).items() if v>1]; assert not dup, f'Duplicate DOM ids: {dup}'
          required=['screen-login','screen-signup','screen-forgot','screen-reset','screen-onboarding','screen-plan','screen-google','screen-checkpoint']
          missing=[x for x in required if x not in p.ids]; assert not missing, f'Missing required static screens: {missing}'
          market=(root/'marketplace.js').read_text(encoding='utf-8')
          for marker in ["s.id='screen-marketplace'","d.id='screen-marketplace-detail'","main.append(s)","main.append(d)"]:
              assert marker in market, f'Marketplace dynamic screen contract missing: {marker}'
          bad=[]
          for ref in sorted(set(p.refs)):
              path=urlparse(ref).path.lstrip('/')
              if path and not path.endswith('/') and not (root/path).exists(): bad.append(ref)
          assert not bad, 'Missing local assets referenced by index.html: '+', '.join(bad)
          assert any(urlparse(x).path=='/listia-bootstrap.js' for x in p.scripts), 'Canonical bootstrap is not wired into index.html'
          print(f'HTML OK ids={len(p.ids)} local_refs={len(set(p.refs))}')
          PY

      - name: Validate JavaScript loaded by the PWA
        run: |
          set -Eeuo pipefail
          node --check public/config.js
          node --check public/sw.js
          node --check public/listia-bootstrap.js
          node --check public/marketplace-native-runtime-v1.js
          node --check public/marketplace-gateway-v9.js
          node --check public/marketplace.js
          node --check public/marketplace-qroo-map.js
          node --check public/listia-voice.js
          node --check public/listings-my-website.js
          node --check public/market-intelligence.js
          echo 'Critical PWA JavaScript syntax OK'

      - name: Audit current runtime graph, manifests and immutable app identity
        run: |
          set -Eeuo pipefail
          python scripts/audit-public-runtime.py
          python3 - <<'PY'
          from pathlib import Path
          import json,glob,re
          note=Path('public/APP_ICON_VERSION.txt').read_text(encoding='utf-8')
          m=re.search(r'icon_version=(\d+)|version=(\d+)',note)
          assert m, 'APP_ICON_VERSION missing version'
          version=next(x for x in m.groups() if x)
          assert 'outer_white_background=removed' in note
          assert 'extra_wheel_or_pointer=forbidden' in note
          files=glob.glob('public/manifest*.webmanifest'); assert len(files)>=12, f'Expected >=12 manifests, found {len(files)}'
          for p in files:
              d=json.load(open(p,encoding='utf-8'))
              assert d.get('name')=='Listia', f'{p}: name must be Listia'
              assert d.get('short_name')=='Listia', f'{p}: short_name must be Listia'
              assert d.get('display')=='standalone', f'{p}: display not standalone'
              icons=d.get('icons') or []
              assert any(i.get('sizes')=='192x192' for i in icons), f'{p}: missing 192 icon'
              assert any(i.get('sizes')=='512x512' for i in icons), f'{p}: missing 512 icon'
              assert any('maskable' in str(i.get('purpose','')) for i in icons), f'{p}: missing maskable icon'
              for icon in icons:
                  src=str(icon.get('src',''))
                  assert '?v=' not in src, f'{p}: icon must use physical immutable filename: {src}'
                  assert f'listia-app-icon-v{version}-' in src, f'{p}: icon version mismatch: {src}'
                  assert Path('public/'+src.lstrip('/')).exists(), f'{p}: missing physical icon {src}'
          print(f'Manifest identity + immutable icon v{version} OK')
          PY

      - name: Audit Service Worker precache references
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re,json
          s=Path('public/sw.js').read_text(encoding='utf-8')
          cache=re.search(r'const\s+CACHE\s*=\s*["\']([^"\']+)["\']\s*;',s)
          assert cache and cache.group(1).startswith('listia-pwa-'), 'Valid LISTIA cache marker missing'
          refs=re.findall(r'"(/[^"]+)"',s); missing=[]
          for ref in refs:
              path=urlparse(ref).path.lstrip('/')
              if path and not path.endswith('/') and not (Path('public')/path).exists(): missing.append(ref)
          assert not missing, 'Missing SW precache assets: '+', '.join(sorted(set(missing)))
          assert any(urlparse(r).path=='/listia-bootstrap.js' for r in refs), 'Bootstrap not precached'
          assert any('/marketplace.js?v=13' in r for r in refs), 'Marketplace v13 not precached'
          assert any('/marketplace-visible-mobile-v1.css?v=1' in r for r in refs), 'Visible mobile layer not precached'
          print(f'Service Worker refs OK cache={cache.group(1)} count={len(set(refs))}')
          PY

      - name: Marketplace mobile contracts
        run: |
          set -Eeuo pipefail
          grep -Fq '100dvh' public/marketplace-pro-mobile.css
          grep -Fq 'marketplace-pro-tabs' public/marketplace-qroo-map.js
          grep -Fq 'marketplace-pro-voice' public/marketplace-qroo-map.js
          grep -Fq 'qroo-intel-chart' public/marketplace-qroo-map.js
          grep -Fq 'pendingReset=false' public/marketplace.js
          grep -Fq 'queueMicrotask(()=>load(true))' public/marketplace.js
          echo 'Marketplace mobile and latest-search-wins contracts OK'
