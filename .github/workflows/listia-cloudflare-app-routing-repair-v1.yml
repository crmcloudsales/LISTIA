name: LISTIA Cloudflare App Routing Repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/listia-cloudflare-app-routing-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-routing:
    name: Attach app.listiaapp.com to LISTIA Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SECURITY_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CLOUDFLARE_ZONE_ID: cb7b05213bf99ff0700becf4aebdf2ab
      PAGES_PROJECT: listia-pwa
      APP_HOSTNAME: app.listiaapp.com
      PAGES_CNAME_TARGET: listia-pwa.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_SECURITY_TOKEN}" || { echo 'CLOUDFLARE_SECURITY_TOKEN is missing'; exit 1; }

      - name: Read current Pages routing and attach only if absent
        shell: bash
        run: |
          set -Eeuo pipefail

          api='https://api.cloudflare.com/client/v4'
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT

          cf_get() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Accept: application/json' \
              --output "${output}" \
              --write-out '%{http_code}' \
              "${url}"
          }

          cf_get_with_token() {
            local token="$1"
            local url="$2"
            local output="$3"
            curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --header "Authorization: Bearer ${token}" \
              --header 'Accept: application/json' \
              --output "${output}" \
              --write-out '%{http_code}' \
              "${url}"
          }

          cf_delete_with_token() {
            local token="$1"
            local url="$2"
            local output="$3"
            curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --request DELETE \
              --header "Authorization: Bearer ${token}" \
              --header 'Accept: application/json' \
              --output "${output}" \
              --write-out '%{http_code}' \
              "${url}"
          }

          safe_error() {
            local input="$1"
            if jq -e . "${input}" >/dev/null 2>&1; then
              jq -c '{success, errors: [(.errors // [])[] | {code, message}], messages: [(.messages // [])[] | {code, message}]}' "${input}"
            else
              echo '{"success":false,"errors":[{"message":"Non-JSON API response"}]}'
            fi
          }

          project_file="${work_dir}/project.json"
          project_http="$(cf_get "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}" "${project_file}")"
          echo "Pages project before: HTTP ${project_http}"
          if [[ "${project_http}" != '200' ]]; then
            safe_error "${project_file}"
            exit 1
          fi

          deployment_status="$(jq -r '.result.canonical_deployment.latest_stage.status // "missing"' "${project_file}")"
          deployment_url="$(jq -r '.result.canonical_deployment.url // "missing"' "${project_file}")"
          echo "Canonical deployment: status=${deployment_status} url=${deployment_url}"
          if [[ "${deployment_status}" != 'success' ]]; then
            echo 'Refusing to attach the production hostname to an unhealthy Pages deployment.'
            exit 1
          fi

          domains_url="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/domains"
          before_file="${work_dir}/domains-before.json"
          before_http="$(cf_get "${domains_url}" "${before_file}")"
          echo "Pages domains before: HTTP ${before_http}"
          if [[ "${before_http}" != '200' ]]; then
            safe_error "${before_file}"
            exit 1
          fi

          before_count="$(jq --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)] | length' "${before_file}")"
          before_status="$(jq -r --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)][0].status // "absent"' "${before_file}")"
          echo "app domain before: count=${before_count} status=${before_status}"

          if [[ "${before_count}" == '0' ]]; then
            create_file="${work_dir}/domain-create.json"
            create_body="$(jq -nc --arg name "${APP_HOSTNAME}" '{name: $name}')"
            create_http="$(curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "${create_body}" \
              --output "${create_file}" \
              --write-out '%{http_code}' \
              "${domains_url}")"
            echo "Attach Pages custom domain: HTTP ${create_http}"
            if [[ ! "${create_http}" =~ ^2[0-9][0-9]$ ]]; then
              safe_error "${create_file}"
              exit 1
            fi
            jq -c '.result | {
              id,
              name,
              status,
              validation_status: (.validation_data.status // null),
              verification_status: (.verification_data.status // null),
              zone_tag
            }' "${create_file}"
          else
            echo 'Pages custom domain already exists; no create request needed.'
          fi

          # A pre-existing placeholder Worker currently owns this exact hostname.
          # Detach only an exact Worker custom domain or exact Worker route, and
          # only after two independent public probes reproduce the placeholder.
          worker_domains_file="${work_dir}/worker-domains.json"
          worker_routes_file="${work_dir}/worker-routes.json"
          worker_domains_http='not-attempted'
          worker_routes_http='not-attempted'
          worker_domains_token=''
          worker_routes_token=''

          for token_source in pages security; do
            if [[ "${token_source}" == 'pages' ]]; then
              candidate_token="${CLOUDFLARE_API_TOKEN}"
            else
              candidate_token="${CLOUDFLARE_SECURITY_TOKEN}"
            fi

            candidate_file="${work_dir}/worker-domains-${token_source}.json"
            candidate_http="$(cf_get_with_token "${candidate_token}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=${APP_HOSTNAME}" "${candidate_file}")"
            echo "Worker custom domains API (${token_source} token): HTTP ${candidate_http}"
            if [[ "${candidate_http}" == '200' ]]; then
              cp "${candidate_file}" "${worker_domains_file}"
              worker_domains_http='200'
              worker_domains_token="${candidate_token}"
              break
            fi
            safe_error "${candidate_file}"
            worker_domains_http="${candidate_http}"
          done

          for token_source in pages security; do
            if [[ "${token_source}" == 'pages' ]]; then
              candidate_token="${CLOUDFLARE_API_TOKEN}"
            else
              candidate_token="${CLOUDFLARE_SECURITY_TOKEN}"
            fi

            candidate_file="${work_dir}/worker-routes-${token_source}.json"
            candidate_http="$(cf_get_with_token "${candidate_token}" "${api}/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" "${candidate_file}")"
            echo "Worker routes API (${token_source} token): HTTP ${candidate_http}"
            if [[ "${candidate_http}" == '200' ]]; then
              cp "${candidate_file}" "${worker_routes_file}"
              worker_routes_http='200'
              worker_routes_token="${candidate_token}"
              break
            fi
            safe_error "${candidate_file}"
            worker_routes_http="${candidate_http}"
          done

          worker_domain_count='0'
          worker_route_count='0'
          if [[ "${worker_domains_http}" == '200' ]]; then
            worker_domain_count="$(jq --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.hostname == $hostname)] | length' "${worker_domains_file}")"
            jq -c --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.hostname == $hostname) | {id, hostname, service, environment, zone_id, zone_name}]' "${worker_domains_file}"
          fi
          if [[ "${worker_routes_http}" == '200' ]]; then
            worker_route_count="$(jq --arg pattern "${APP_HOSTNAME}/*" '[.result[] | select(.pattern == $pattern)] | length' "${worker_routes_file}")"
            jq -c --arg pattern "${APP_HOSTNAME}/*" '[.result[] | select(.pattern == $pattern) | {id, pattern, script}]' "${worker_routes_file}"
          fi

          worker_target_count="$((worker_domain_count + worker_route_count))"
          if (( worker_target_count > 1 )); then
            echo "Refusing to detach ambiguous Worker routing: exact_targets=${worker_target_count}"
            exit 1
          fi

          routing_change='none'
          if (( worker_target_count == 1 )); then
            root_body="${work_dir}/placeholder-root.body"
            asset_body="${work_dir}/placeholder-app-js.body"
            root_http="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "${root_body}" --write-out '%{http_code}' "https://${APP_HOSTNAME}/")"
            asset_http="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "${asset_body}" --write-out '%{http_code}' "https://${APP_HOSTNAME}/app.js")"
            echo "Placeholder safety probes: root_http=${root_http} app_js_http=${asset_http}"
            if [[ "${root_http}" != '200' || "${asset_http}" != '200' ]] || \
               ! grep -Fxq 'Hello World!' "${root_body}" || \
               ! grep -Fxq 'Hello World!' "${asset_body}"; then
              echo 'Refusing to detach Worker routing because the exact placeholder fingerprint was not reproduced twice.'
              exit 1
            fi

            delete_file="${work_dir}/worker-delete.json"
            if (( worker_domain_count == 1 )); then
              worker_domain_id="$(jq -r --arg hostname "${APP_HOSTNAME}" '.result[] | select(.hostname == $hostname) | .id' "${worker_domains_file}")"
              delete_http="$(cf_delete_with_token "${worker_domains_token}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${worker_domain_id}" "${delete_file}")"
              routing_change='detached exact Worker custom domain app.listiaapp.com'
            else
              worker_route_id="$(jq -r --arg pattern "${APP_HOSTNAME}/*" '.result[] | select(.pattern == $pattern) | .id' "${worker_routes_file}")"
              delete_http="$(cf_delete_with_token "${worker_routes_token}" "${api}/zones/${CLOUDFLARE_ZONE_ID}/workers/routes/${worker_route_id}" "${delete_file}")"
              routing_change='deleted exact Worker route app.listiaapp.com/*'
            fi

            echo "Remove placeholder Worker ownership: HTTP ${delete_http}"
            if [[ ! "${delete_http}" =~ ^(200|204)$ ]]; then
              safe_error "${delete_file}"
              exit 1
            fi
            echo "Routing change: ${routing_change}"
          elif [[ "${worker_domains_http}" != '200' && "${worker_routes_http}" != '200' ]]; then
            echo 'Cannot inspect or detach the placeholder Worker with the existing tokens; Workers Scripts/Routes read-write permission is required.'
            blocked_root="${work_dir}/blocked-placeholder-root.body"
            blocked_asset="${work_dir}/blocked-placeholder-app-js.body"
            blocked_root_http="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "${blocked_root}" --write-out '%{http_code}' "https://${APP_HOSTNAME}/")"
            blocked_asset_http="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "${blocked_asset}" --write-out '%{http_code}' "https://${APP_HOSTNAME}/app.js")"
            if [[ "${blocked_root_http}" == '200' && "${blocked_asset_http}" == '200' ]] && \
               grep -Fxq 'Hello World!' "${blocked_root}" && \
               grep -Fxq 'Hello World!' "${blocked_asset}"; then
              echo 'BLOCKED: exact placeholder fingerprint remains active and neither token can read or detach its Worker ownership.'
              exit 1
            fi
          else
            echo 'No exact Worker custom domain or exact Worker route was found with the accessible APIs.'
          fi

          # Keep an existing pending Pages domain stable while DNS is provisioned.
          # Repeated delete/recreate cycles reset validation and are unnecessary.
          pages_domain_action='kept existing Pages domain'

          # Ensure exact Pages CNAME idempotently. Refuse to replace or delete
          # any conflicting DNS record.
          dns_records_url="${api}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${APP_HOSTNAME}"
          dns_records_file="${work_dir}/dns-records.json"
          dns_records_http='not-attempted'
          dns_token=''
          dns_token_source=''

          for token_source in security pages; do
            if [[ "${token_source}" == 'security' ]]; then
              candidate_token="${CLOUDFLARE_SECURITY_TOKEN}"
            else
              candidate_token="${CLOUDFLARE_API_TOKEN}"
            fi

            candidate_file="${work_dir}/dns-records-${token_source}.json"
            candidate_http="$(cf_get_with_token "${candidate_token}" "${dns_records_url}" "${candidate_file}")"
            echo "Read exact app DNS record (${token_source} token): HTTP ${candidate_http}"
            if [[ "${candidate_http}" == '200' ]]; then
              cp "${candidate_file}" "${dns_records_file}"
              dns_records_http='200'
              dns_token="${candidate_token}"
              dns_token_source="${token_source}"
              break
            fi
            safe_error "${candidate_file}"
            dns_records_http="${candidate_http}"
          done

          if [[ "${dns_records_http}" != '200' ]]; then
            echo 'BLOCKED: neither existing token can read DNS for listiaapp.com; Zone DNS Edit must be saved on one token scoped to this zone.'
            exit 1
          fi
          echo "DNS authorization source: ${dns_token_source} token"

          dns_record_count="$(jq --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)] | length' "${dns_records_file}")"
          if (( dns_record_count > 1 )); then
            jq -c --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname) | {id, type, name, content, proxied}]' "${dns_records_file}"
            echo "Refusing ambiguous DNS mutation: exact_records=${dns_record_count}"
            exit 1
          fi

          dns_action='kept existing exact Pages CNAME'
          if (( dns_record_count == 1 )); then
            dns_type="$(jq -r --arg hostname "${APP_HOSTNAME}" '.result[] | select(.name == $hostname) | .type' "${dns_records_file}")"
            dns_content="$(jq -r --arg hostname "${APP_HOSTNAME}" '.result[] | select(.name == $hostname) | .content | rtrimstr(".")' "${dns_records_file}")"
            dns_proxied="$(jq -r --arg hostname "${APP_HOSTNAME}" '.result[] | select(.name == $hostname) | .proxied' "${dns_records_file}")"
            if [[ "${dns_type}" != 'CNAME' || "${dns_content}" != "${PAGES_CNAME_TARGET}" || "${dns_proxied}" != 'true' ]]; then
              jq -c --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname) | {id, type, name, content, proxied}]' "${dns_records_file}"
              echo 'Refusing to overwrite a conflicting app.listiaapp.com DNS record.'
              exit 1
            fi
          else
            dns_create_file="${work_dir}/dns-create.json"
            dns_create_body="$(jq -nc \
              --arg type 'CNAME' \
              --arg name "${APP_HOSTNAME}" \
              --arg content "${PAGES_CNAME_TARGET}" \
              --arg comment 'LISTIA PWA on Cloudflare Pages' \
              '{type: $type, name: $name, content: $content, ttl: 1, proxied: true, comment: $comment}')"
            dns_create_http="$(curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --request POST \
              --header "Authorization: Bearer ${dns_token}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "${dns_create_body}" \
              --output "${dns_create_file}" \
              --write-out '%{http_code}' \
              "${api}/zones/${CLOUDFLARE_ZONE_ID}/dns_records")"
            echo "Create exact Pages CNAME: HTTP ${dns_create_http}"
            if [[ ! "${dns_create_http}" =~ ^2[0-9][0-9]$ ]]; then
              safe_error "${dns_create_file}"
              exit 1
            fi
            jq -c '.result | {id, type, name, content, proxied, ttl}' "${dns_create_file}"
            dns_action='created exact Pages CNAME'
          fi

          final_status='unknown'
          final_validation='unknown'
          final_verification='unknown'
          for attempt in $(seq 1 60); do
            current_file="${work_dir}/domains-current.json"
            current_http="$(cf_get "${domains_url}" "${current_file}")"
            if [[ "${current_http}" != '200' ]]; then
              echo "Pages domains verification attempt ${attempt}: HTTP ${current_http}"
              safe_error "${current_file}"
              exit 1
            fi

            final_status="$(jq -r --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)][0].status // "absent"' "${current_file}")"
            final_validation="$(jq -r --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)][0].validation_data.status // "unknown"' "${current_file}")"
            final_verification="$(jq -r --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname)][0].verification_data.status // "unknown"' "${current_file}")"
            echo "Pages domain verification ${attempt}/60: status=${final_status} validation=${final_validation} verification=${final_verification}"

            if [[ "${final_status}" == 'active' ]]; then
              break
            fi
            if [[ "${final_status}" =~ ^(error|blocked|deactivated)$ ]]; then
              jq -c --arg hostname "${APP_HOSTNAME}" '[.result[] | select(.name == $hostname) | {
                name,
                status,
                validation_status: (.validation_data.status // null),
                validation_error: (.validation_data.error_message // null),
                verification_status: (.verification_data.status // null),
                verification_error: (.verification_data.error_message // null)
              }]' "${current_file}"
              exit 1
            fi
            sleep 10
          done

          if [[ "${final_status}" != 'active' ]]; then
            echo "Pages custom domain did not become active within the verification window: ${final_status}"
            exit 1
          fi

          {
            echo '## LISTIA app routing repair'
            echo
            echo "- Before: count=${before_count}, status=${before_status}"
            echo "- After: status=${final_status}, validation=${final_validation}, verification=${final_verification}"
            echo '- Target Pages project: listia-pwa'
            echo "- Placeholder Worker routing change: ${routing_change}"
            echo "- Pages domain action: ${pages_domain_action}"
            echo "- DNS action: ${dns_action}"
            echo "- DNS authorization source: ${dns_token_source} token"
            echo '- Other hostnames changed: none'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify production routing and PWA assets
        shell: bash
        run: |
          set -Eeuo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT

          probe() {
            local label="$1"
            local url="$2"
            local expected_type="$3"
            local body="${probe_dir}/${label}.body"
            local metadata
            local http_code
            local content_type
            local size
            local marker='other'

            metadata="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --output "${body}" \
              --write-out '%{http_code}|%{content_type}|%{size_download}' \
              "${url}")"
            IFS='|' read -r http_code content_type size <<< "${metadata}"

            if grep -Fxq 'Hello World!' "${body}"; then
              marker='hello-world-worker'
            elif grep -Eiq '<!doctype html|<html' "${body}"; then
              marker='html'
            elif [[ "${content_type}" == *javascript* ]]; then
              marker='javascript'
            elif [[ "${content_type}" == *manifest* || "${content_type}" == *json* ]]; then
              marker='manifest'
            fi

            echo "${label}: ${metadata}|sha256=$(sha256sum "${body}" | awk '{print $1}')|marker=${marker}"
            [[ "${http_code}" == '200' ]] || { echo "${label} expected HTTP 200"; return 1; }
            [[ "${marker}" != 'hello-world-worker' ]] || { echo "${label} is still intercepted by the placeholder Worker"; return 1; }
            case "${expected_type}" in
              html) [[ "${marker}" == 'html' ]] ;;
              javascript) [[ "${content_type}" == *javascript* ]] ;;
              manifest) [[ "${content_type}" == *manifest* || "${content_type}" == *json* ]] ;;
            esac
          }

          probe app_root 'https://app.listiaapp.com/' html
          probe app_javascript 'https://app.listiaapp.com/app.js' javascript
          probe app_manifest 'https://app.listiaapp.com/manifest.webmanifest' manifest
          probe app_service_worker 'https://app.listiaapp.com/sw.js' javascript
          probe pages_production 'https://listia-pwa.pages.dev/' html
          probe public_root 'https://listiaapp.com/' html

          negative_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://app.listiaapp.com/.env')"
          echo "negative_sensitive_file: HTTP ${negative_status}"
          [[ "${negative_status}" == '403' ]] || { echo 'Expected Cloudflare WAF to block /.env'; exit 1; }
