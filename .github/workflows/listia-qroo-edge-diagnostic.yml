name: LISTIA QROO Edge Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-qroo-edge-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qroo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify QROO edge responses
        shell: bash
        run: |
          set -Eeuo pipefail
          check(){
            name="$1"; url="$2";
            code=$(curl -sS -o "/tmp/$name.body" -w '%{http_code}' "$url" || true)
            echo "$name STATUS=$code"
            head -c 2000 "/tmp/$name.body"; echo
            test "$code" = 200
          }
          check clusters 'https://zvzafiarwerbuoaccnoz.supabase.co/functions/v1/marketplace-map-qroo?mode=clusters&limit=3'
          check microzones 'https://zvzafiarwerbuoaccnoz.supabase.co/functions/v1/marketplace-map-qroo?mode=microzones&limit=3&operation=sale&currency=MXN'
