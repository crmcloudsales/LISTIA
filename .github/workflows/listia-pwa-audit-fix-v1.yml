name: LISTIA PWA Audit Fix v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-pwa-audit-fix-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wire canonical LISTIA bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          index=Path('public/index.html')
          html=index.read_text(encoding='utf-8')
          tag='<script defer="" src="/listia-bootstrap.js?v=1"></script>'
          if tag not in html:
              anchor='<script defer="" src="/app.js"></script>'
              assert anchor in html, 'app.js anchor missing'
              html=html.replace(anchor,anchor+'\n'+tag,1)
              index.write_text(html,encoding='utf-8')

          sw=Path('public/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=s.replace('listia-pwa-v0.27.12-pwa-audit','listia-pwa-v0.27.13-bootstrap')
          if '"/listia-bootstrap.js?v=1"' not in s:
              s=s.replace('"/i18n-extra.js",','"/listia-bootstrap.js?v=1","/i18n-extra.js",',1)
          s=s.replace('"/marketplace.js?v=9"','"/marketplace.js?v=10"')
          s=s.replace('"/marketplace-qroo-map.js?v=1"','"/marketplace-qroo-map.js?v=2"')
          sw.write_text(s,encoding='utf-8')
          PY

      - name: Validate bootstrap wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq '/listia-bootstrap.js?v=1' public/index.html
          grep -Fq 'listia-pwa-v0.27.13-bootstrap' public/sw.js
          grep -Fq '"/listia-bootstrap.js?v=1"' public/sw.js
          grep -Fq '"/marketplace.js?v=10"' public/sw.js
          grep -Fq '"/marketplace-qroo-map.js?v=2"' public/sw.js
          node --check public/listia-bootstrap.js
          node --check public/sw.js
          for f in marketplace.js listia-voice.js runtime.js account-center.js office-modules.js; do test -f "public/$f"; done
          echo 'Canonical bootstrap wiring OK'

      - name: Commit fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'LISTIA PWA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html public/sw.js
          git commit -m 'fix(pwa): execute advanced modules through canonical bootstrap'
          git push origin HEAD:main
