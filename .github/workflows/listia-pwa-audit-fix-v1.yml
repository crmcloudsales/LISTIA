name: LISTIA PWA Audit Fix v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listia-pwa-audit-fix-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize PWA identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,glob,re
          for path in glob.glob('public/manifest*.webmanifest'):
              p=Path(path)
              d=json.loads(p.read_text(encoding='utf-8'))
              d['name']='Listia'
              d['short_name']='Listia'
              for icon in d.get('icons') or []:
                  src=str(icon.get('src',''))
                  icon['src']=re.sub(r'\?v=\d+$','?v=16',src)
              p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

      - name: Validate canonical PWA identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,glob,re
          files=glob.glob('public/manifest*.webmanifest')
          assert len(files)>=12
          for p in files:
              d=json.load(open(p,encoding='utf-8'))
              assert d.get('name')=='Listia', p
              assert d.get('short_name')=='Listia', p
              assert d.get('display')=='standalone', p
              icons=d.get('icons') or []
              assert icons, p
              assert all(re.search(r'\?v=16$',str(i.get('src',''))) for i in icons), p
          print('All manifest identities are canonical Listia')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'LISTIA PWA Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/manifest*.webmanifest
          git commit -m 'fix(pwa): normalize Listia identity across manifests'
          git push origin HEAD:main
