name: LISTIA Commercial Global i18n

on:
  push:
    branches: [main]
    paths:
      - 'commercial/**'
      - 'public/terms.html'
      - 'public/privacy.html'
      - 'public/legal.css'
      - 'public/listia-mark-transparent.webp'
      - 'scripts/build-commercial-worker.py'
      - '.github/workflows/listia-commercial-global-i18n-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listia-commercial-global-i18n
  cancel-in-progress: true

jobs:
  deploy-commercial-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_SECURITY: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      WORKER_NAME: listia
      WRANGLER_VERSION: '4'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source and build protected Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN_PRIMARY}${CLOUDFLARE_API_TOKEN_SECURITY}"
          python3 -m py_compile scripts/build-commercial-worker.py
          python3 scripts/build-commercial-worker.py commercial/index.html /tmp/listia-commercial-worker.mjs
          node --check /tmp/listia-commercial-worker.mjs
          printf '\nconst __LISTIA_RELEASE_FINGERPRINT="%s";\n' "${GITHUB_SHA}" >> /tmp/listia-commercial-worker.mjs
          node --check /tmp/listia-commercial-worker.mjs
          test "$(grep -c '<option value=' commercial/index.html)" -eq 7
          grep -Fq '__SEO_CANONICAL__' commercial/marketplace.html
          grep -Fq 'LISTIA busca por ti' commercial/marketplace.html
          grep -Fq 'id="map"' commercial/marketplace.html
          grep -Fq "ru:" commercial/global-locales.js
          grep -Fq "he:" commercial/global-locales.js
          grep -Fq "'zh-CN':" commercial/global-locales.js
          grep -Fq "const key='ja'" commercial/japanese-locale.js
          grep -Fq 'Version 1.4' public/terms.html
          grep -Fq 'Version 1.3' public/privacy.html
          grep -Fq 'LISTIA — Inversión y alianzas estratégicas' commercial/investment.html
          grep -Fq 'id="investmentForm"' commercial/investment.html
          grep -Fq '/investment/contact' commercial/investment.html
          ! grep -Fiq 'CloudCo' commercial/investment.html
          ! grep -Fiq 'Powered by CloudCo' commercial/footer-legal.js
          grep -Fq '__LISTIA_RELEASE_FINGERPRINT' /tmp/listia-commercial-worker.mjs

      - name: Upload validated preview version
        id: upload
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''; version=''; preview=''
          for candidate in primary security; do
            if [[ "${candidate}" == primary ]]; then token="${CLOUDFLARE_API_TOKEN_PRIMARY}"; else token="${CLOUDFLARE_API_TOKEN_SECURITY}"; fi
            [[ -n "${token}" ]] || continue
            if CLOUDFLARE_API_TOKEN="${token}" timeout --signal=TERM 180s env npm_config_fetch_retries=2 npm_config_fetch_retry_maxtimeout=20000 npx --yes wrangler@${WRANGLER_VERSION} versions upload /tmp/listia-commercial-worker.mjs --name "${WORKER_NAME}" --compatibility-date 2026-08-24 --keep-vars --tag "commercial-marketplace-${GITHUB_SHA:0:12}" --message "LISTIA protected commercial release ${GITHUB_SHA:0:12}" --preview-alias commercial-marketplace 2>&1 | tee /tmp/upload.log; then
              selected="${candidate}"
              version="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/upload.log | tail -1)"
              preview="$(grep -Eo 'https://[^[:space:]]+workers\.dev[^[:space:]]*' /tmp/upload.log | head -1 | sed 's/[),]$//' || true)"
              break
            fi
          done
          test -n "${selected}" && test -n "${version}" && test -n "${preview}"
          echo "token_kind=${selected}" >> "$GITHUB_OUTPUT"
          echo "version_id=${version}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${preview}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test preview including marketplace and investment
        shell: bash
        run: |
          set -Eeuo pipefail
          base='${{ steps.upload.outputs.preview_url }}'
          for attempt in {1..8}; do
            code="$(curl -sS -L --max-time 20 -o /tmp/preview.html -w '%{http_code}' "${base}?lang=ja" || true)"
            market="$(curl -sS -L --max-time 20 -o /tmp/marketplace.html -w '%{http_code}' "${base%/}/marketplace" || true)"
            investment="$(curl -sS -L --max-time 20 -o /tmp/investment.html -w '%{http_code}' "${base%/}/investment" || true)"
            [[ "${code}" == 200 && "${market}" == 200 && "${investment}" == 200 ]] && break
            sleep 4
          done
          test "${code}" = 200
          test "${market}" = 200
          test "${investment}" = 200
          grep -Fq 'LISTIA' /tmp/preview.html
          grep -Fq 'LISTIA busca por ti' /tmp/marketplace.html
          grep -Fq 'id="map"' /tmp/marketplace.html
          grep -Fq 'LISTIA — Inversión y alianzas estratégicas' /tmp/investment.html
          grep -Fq 'id="investmentForm"' /tmp/investment.html
          for path in global-locales.js japanese-locale.js terms.html privacy.html sitemap.xml; do
            asset_code="$(curl -sS -L --max-time 20 -o "/tmp/${path//\//_}" -w '%{http_code}' "${base%/}/${path}" || true)"
            test "${asset_code}" = 200
          done
          grep -Fq 'https://listiaapp.com/marketplace' /tmp/sitemap.xml
          grep -Fq 'https://listiaapp.com/investment' /tmp/sitemap.xml
          grep -Fq 'Version 1.4' /tmp/terms.html
          grep -Fq 'Version 1.3' /tmp/privacy.html

      - name: Deploy validated version to production
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.upload.outputs.token_kind }}' == primary ]]; then token="${CLOUDFLARE_API_TOKEN_PRIMARY}"; else token="${CLOUDFLARE_API_TOKEN_SECURITY}"; fi
          CLOUDFLARE_API_TOKEN="${token}" timeout --signal=TERM 180s env npm_config_fetch_retries=2 npm_config_fetch_retry_maxtimeout=20000 npx --yes wrangler@${WRANGLER_VERSION} versions deploy '${{ steps.upload.outputs.version_id }}@100%' --name "${WORKER_NAME}" --message "Deploy LISTIA protected commercial release ${GITHUB_SHA:0:12}" --yes

      - name: Verify live commercial site, marketplace and investment
        shell: bash
        run: |
          set -Eeuo pipefail
          languages=(es en fr it pt-BR de ar-AE ru he zh-CN ja)
          ok=false
          for attempt in $(seq 1 24); do
            root="$(curl -sS -L --max-time 20 -o /tmp/root.html -w '%{http_code}' 'https://listiaapp.com/?lang=ru' || true)"
            marketplace="$(curl -sS -L --max-time 20 -o /tmp/marketplace-live.html -w '%{http_code}' 'https://listiaapp.com/marketplace' || true)"
            terms="$(curl -sS -L --max-time 20 -o /tmp/terms.html -w '%{http_code}' 'https://listiaapp.com/terms.html' || true)"
            privacy="$(curl -sS -L --max-time 20 -o /tmp/privacy.html -w '%{http_code}' 'https://listiaapp.com/privacy.html' || true)"
            investment="$(curl -sS -L --max-time 20 -o /tmp/investment-live.html -w '%{http_code}' 'https://listiaapp.com/investment' || true)"
            legacy="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}|%{redirect_url}' 'https://listiaapp.com/cloudco' || true)"
            sitemap="$(curl -sS -L --max-time 20 -o /tmp/sitemap-live.xml -w '%{http_code}' 'https://listiaapp.com/sitemap.xml' || true)"
            global="$(curl -sS -L --max-time 20 -o /tmp/global.js -w '%{http_code}' 'https://listiaapp.com/global-locales.js' || true)"
            japanese="$(curl -sS -L --max-time 20 -o /tmp/ja.js -w '%{http_code}' 'https://listiaapp.com/japanese-locale.js' || true)"
            if [[ "$root" == 200 && "$marketplace" == 200 && "$terms" == 200 && "$privacy" == 200 && "$investment" == 200 && "$sitemap" == 200 && "$global" == 200 && "$japanese" == 200 ]] && grep -Fq 'LISTIA busca por ti' /tmp/marketplace-live.html && grep -Fq 'id="map"' /tmp/marketplace-live.html && grep -Fq 'https://listiaapp.com/marketplace' /tmp/sitemap-live.xml && grep -Fq 'https://listiaapp.com/investment' /tmp/sitemap-live.xml && grep -Fq 'Version 1.4' /tmp/terms.html && grep -Fq 'Version 1.3' /tmp/privacy.html && grep -Fq 'LISTIA — Inversión y alianzas estratégicas' /tmp/investment-live.html && grep -Fq 'id="investmentForm"' /tmp/investment-live.html && [[ "$legacy" == 308\|https://listiaapp.com/investment* ]] && grep -Fq 'Русский' /tmp/global.js && grep -Fq '日本語' /tmp/ja.js; then ok=true; break; fi
            sleep 5
          done
          [[ "$ok" == true ]]
          for lang in "${languages[@]}"; do
            status="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "https://listiaapp.com/?lang=${lang}")"
            test "$status" = 200
          done
          for url in 'https://www.listiaapp.com/marketplace' 'https://app.listiaapp.com/?lang=ru' 'https://app.listiaapp.com/?lang=ja'; do
            status="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "$url")"
            test "$status" = 200
          done

      - name: Persist verified commercial deployment proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main
          {
            echo 'LISTIA COMMERCIAL + MARKETPLACE + INVESTMENT DEPLOYMENT VERIFIED'
            echo "verified_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "source_commit=${GITHUB_SHA}"
            echo 'marketplace_live=true'
            echo 'marketplace_url=https://listiaapp.com/marketplace'
            echo 'marketplace_map=true'
            echo 'investment_live=true'
            echo 'investment_url=https://listiaapp.com/investment'
            echo 'legacy_cloudco_route=redirect_only'
            echo 'resource_boundary=LISTIA_ONLY'
            echo 'commercial_worker_minified=false'
            echo 'commercial_worker_bundled_by_wrangler=true'
            echo 'commercial_worker_fingerprinted=true'
            echo 'languages=es,en,fr,it,pt-BR,de,ar-AE,ru,he,zh-CN,ja'
            echo 'terms_version=1.4'
            echo 'privacy_version=1.3'
          } > COMMERCIAL_LIVE_DEPLOYMENT_PROOF.txt
          git config user.name 'LISTIA DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add COMMERCIAL_LIVE_DEPLOYMENT_PROOF.txt
          git commit -m 'Record verified LISTIA protected commercial deployment' || exit 0
          git push origin main
