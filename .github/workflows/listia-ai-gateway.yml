name: LISTIA AI Gateway

on:
  push:
    branches: [main]
    paths:
      - 'ai-worker/**'
      - 'wrangler-listia-ai.jsonc'
      - '.github/workflows/listia-ai-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SECURITY_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_TOKEN }}
      CF_ZONE_ID: cb7b05213bf99ff0700becf4aebdf2ab
      WORKER_NAME: listia-ai
      AI_HOST: brain.listiaapp.com
      WRANGLER_VERSION: '4.125.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check ai-worker/index.js
      - name: Deploy LISTIA AI Worker with binding
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          for source in security primary; do
            if [[ "$source" == security ]]; then token="$CF_SECURITY_TOKEN"; else token="$CF_PRIMARY_TOKEN"; fi
            [[ -n "$token" ]] || continue
            if CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler-listia-ai.jsonc 2>&1 | tee "/tmp/listia-ai-${source}.log"; then selected="$source"; break; fi
          done
          [[ -n "$selected" ]] || { echo 'LISTIA_AI_DEPLOY_BLOCKED'; exit 1; }
          echo "token_source=${selected}" >> "$GITHUB_OUTPUT"
      - name: Ensure proxied DNS for brain.listiaapp.com
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          for source in security primary; do
            if [[ "$source" == security ]]; then token="$CF_SECURITY_TOKEN"; else token="$CF_PRIMARY_TOKEN"; fi
            [[ -n "$token" ]] || continue
            auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
            out="/tmp/dns-${source}.json"
            http=$(curl -sS --max-time 25 "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${AI_HOST}" "${auth[@]}" -o "$out" -w '%{http_code}' || true)
            [[ "$http" == 200 ]] || continue
            jq -e '.success == true' "$out" >/dev/null || continue
            count=$(jq '.result|length' "$out")
            [[ "$count" -le 1 ]] || { echo 'Ambiguous brain DNS records; refusing change'; exit 21; }
            if [[ "$count" == 1 ]]; then
              id=$(jq -r '.result[0].id' "$out"); type=$(jq -r '.result[0].type' "$out"); content=$(jq -r '.result[0].content' "$out"); proxied=$(jq -r '.result[0].proxied' "$out")
              [[ "$type" == CNAME && "$content" == listiaapp.com ]] || { echo "brain DNS exists with unexpected target: ${type} ${content}"; exit 22; }
              if [[ "$proxied" != true ]]; then payload=$(jq -nc '{type:"CNAME",name:"brain",content:"listiaapp.com",proxied:true,ttl:1}'); curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${id}" "${auth[@]}" --data "$payload" >/tmp/dns-write.json; jq -e '.success == true' /tmp/dns-write.json >/dev/null; fi
            else
              payload=$(jq -nc '{type:"CNAME",name:"brain",content:"listiaapp.com",proxied:true,ttl:1}'); curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" "${auth[@]}" --data "$payload" >/tmp/dns-write.json; jq -e '.success == true' /tmp/dns-write.json >/dev/null
            fi
            selected="$source"; break
          done
          [[ -n "$selected" ]] || { echo 'LISTIA_AI_DNS_BLOCKED'; exit 23; }
      - name: Install exact brain.listiaapp.com route
        shell: bash
        run: |
          set -Eeuo pipefail
          written='false'
          for source in security primary; do
            if [[ "$source" == security ]]; then token="$CF_SECURITY_TOKEN"; else token="$CF_PRIMARY_TOKEN"; fi
            [[ -n "$token" ]] || continue
            auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
            http=$(curl -sS --max-time 25 "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes" "${auth[@]}" -o /tmp/routes.json -w '%{http_code}' || true)
            [[ "$http" == 200 ]] || continue; jq -e '.success == true' /tmp/routes.json >/dev/null || continue
            route_id=$(jq -r --arg pattern "${AI_HOST}/*" '.result[] | select(.pattern == $pattern) | .id' /tmp/routes.json | head -n1); current_script=$(jq -r --arg pattern "${AI_HOST}/*" '.result[] | select(.pattern == $pattern) | .script // ""' /tmp/routes.json | head -n1)
            if [[ -n "$route_id" && "$route_id" != null && -n "$current_script" && "$current_script" != "$WORKER_NAME" ]]; then echo "${AI_HOST} route belongs to ${current_script}; refusing overwrite"; exit 31; fi
            payload=$(jq -nc --arg pattern "${AI_HOST}/*" --arg script "$WORKER_NAME" '{pattern:$pattern,script:$script}')
            if [[ -n "$route_id" && "$route_id" != null ]]; then curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes/${route_id}" "${auth[@]}" --data "$payload" >/tmp/write.json || continue; else curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes" "${auth[@]}" --data "$payload" >/tmp/write.json || continue; fi
            jq -e '.success == true' /tmp/write.json >/dev/null || continue; written='true'; break
          done
          [[ "$written" == true ]] || { echo 'LISTIA_AI_ROUTE_BLOCKED'; exit 32; }
      - name: Smoke hardened AI gateway protection
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=false
          for attempt in $(seq 1 24); do
            health=$(curl -sS -L --max-time 20 -o /tmp/health.json -w '%{http_code}' "https://${AI_HOST}/health" || true)
            no_origin=$(curl -sS -L --max-time 20 -o /tmp/no-origin.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"message":"hello"}' "https://${AI_HOST}/" || true)
            evil=$(curl -sS -L --max-time 20 -o /tmp/evil.json -w '%{http_code}' -X POST -H 'Origin: https://clone.example' -H 'Content-Type: application/json' --data '{"message":"hello"}' "https://${AI_HOST}/" || true)
            official=$(curl -sS -L --max-time 20 -o /tmp/official.json -w '%{http_code}' -X POST -H 'Origin: https://app.listiaapp.com' -H 'Content-Type: application/json' --data '{"message":"hello"}' "https://${AI_HOST}/" || true)
            if [[ "$health" == 200 && "$no_origin" == 403 && "$evil" == 403 && "$official" == 401 ]] && jq -e '.service == "LISTIA" and (.model|not) and (.provider|not)' /tmp/health.json >/dev/null 2>&1; then ok=true; break; fi
            echo "AI gateway convergence ${attempt}/24: health=${health} no_origin=${no_origin} evil=${evil} official=${official}"
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'LISTIA_AI_SMOKE_FAILED'; exit 33; }
